<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-labelledby="t d"><title id="t">Astra architecture</title><desc id="d">Experience surfaces (Web dashboard, CLI/TUI, TypeScript SDK, API clients) sit above a durable control backbone. The Context Pipeline, model decision and policy decision fan out to execution capacity: Server provider, User Runner on CLI or Edge, and MCP or sandbox. The User Runner reaches private enterprise IT. Evidence (Trace, Introspect, Explain, Reflect, Audit) returns to the Context Pipeline as future context, over durable facts in MatrixOne and Memoria.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker></defs><rect width="900" height="640" fill="none"/><text x="140.0" y="26.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.7" fill="#59636e">EXPERIENCE</text><rect x="140.0" y="34.0" width="680.0" height="46.0" rx="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/><text x="480.0" y="61.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Web dashboard · CLI/TUI · TypeScript SDK · API clients</text><path d="M480.0 80.0 L480.0 106.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><text x="140.0" y="118.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.7" fill="#59636e">CONTROL</text><rect x="140.0" y="126.0" width="680.0" height="46.0" rx="7" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/><text x="480.0" y="153.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Server · Session/Run/Work · identity · orchestration · checkpoints</text><path d="M480.0 172.0 L480.0 198.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><text x="140.0" y="200.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.7" fill="#59636e">INTELLIGENCE</text><rect x="140.0" y="208.0" width="190.0" height="48.0" rx="7" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/><text x="235.0" y="236.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Context Pipeline</text><path d="M330.0 232.0 L370.0 232.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="370.0" y="208.0" width="170.0" height="48.0" rx="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/><text x="455.0" y="236.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Model decision</text><path d="M540.0 232.0 L580.0 232.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="580.0" y="208.0" width="240.0" height="48.0" rx="7" fill="#fff8c5" stroke="#bf8700" stroke-width="1.4"/><text x="700.0" y="236.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Policy + provider decision</text><path d="M700.0 256.0 L700.0 290.0" fill="none" stroke="#8c959f" stroke-width="1.4"/><path d="M250.0 290.0 L730.0 290.0" fill="none" stroke="#8c959f" stroke-width="1.4"/><text x="140.0" y="308.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.7" fill="#59636e">EXECUTION</text><path d="M250.0 290.0 L250.0 316.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="140.0" y="316.0" width="220.0" height="56.0" rx="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/><text x="250.0" y="339.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Server provider</text><text x="250.0" y="355.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#59636e">shared state · control plane</text><path d="M490.0 290.0 L490.0 316.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="400.0" y="316.0" width="180.0" height="56.0" rx="7" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/><text x="490.0" y="339.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">User Runner</text><text x="490.0" y="355.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#59636e">CLI or Edge</text><path d="M730.0 290.0 L730.0 316.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="640.0" y="316.0" width="180.0" height="56.0" rx="7" fill="#fff8c5" stroke="#bf8700" stroke-width="1.4"/><text x="730.0" y="339.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">MCP / sandbox</text><text x="730.0" y="355.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#59636e">scoped runtime</text><path d="M490.0 372.0 L490.0 402.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="340.0" y="402.0" width="300.0" height="56.0" rx="7" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/><text x="490.0" y="425.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Private enterprise IT</text><text x="490.0" y="441.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#59636e">workspace · network · tools · data</text><path d="M490.0 458.0 L490.0 488.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><text x="140.0" y="480.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.7" fill="#59636e">EVIDENCE</text><rect x="140.0" y="488.0" width="680.0" height="46.0" rx="7" fill="#f6f8fa" stroke="#59636e" stroke-width="1.4"/><text x="480.0" y="515.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Trace · Introspect · Explain · Reflect · Audit</text><path d="M140 511 L100 511 L100 232 L140 232" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><text x="88" y="350" text-anchor="middle" transform="rotate(-90 88 350)" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#59636e">future context</text><path d="M480.0 534.0 L480.0 566.0" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#a)"/><text x="140.0" y="560.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.7" fill="#59636e">DURABLE FACTS</text><rect x="140.0" y="566.0" width="680.0" height="46.0" rx="7" fill="#f6f8fa" stroke="#59636e" stroke-width="1.4"/><text x="480.0" y="593.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">MatrixOne · Memoria · transcript · artifacts · checkpoints · trace · audit</text></svg>
