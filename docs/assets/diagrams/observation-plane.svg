<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 210" width="700" height="210" role="img" aria-labelledby="t d"><title id="t">Observation plane</title><desc id="d">Runtime facts flow into Trace, then Introspect, which projects into Explain and Reflect. Trace and policy decisions both feed Audit.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker></defs><rect width="700" height="210" fill="none"/><rect x="20.0" y="40.0" width="140.0" height="44.0" rx="7" fill="#f6f8fa" stroke="#59636e" stroke-width="1.4"/><text x="90.0" y="66.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Runtime facts</text><path d="M160.0 62.0 L200.0 62.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="200.0" y="40.0" width="110.0" height="44.0" rx="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/><text x="255.0" y="66.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Trace</text><path d="M310.0 62.0 L350.0 62.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="350.0" y="40.0" width="130.0" height="44.0" rx="7" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/><text x="415.0" y="66.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Introspect</text><path d="M480 55 C505 55, 505 34, 530 34" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="530.0" y="14.0" width="130.0" height="40.0" rx="7" fill="#d