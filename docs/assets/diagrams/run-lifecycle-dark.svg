<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" role="img" aria-labelledby="t d"><title id="t">Run lifecycle states</title><desc id="d">A run moves from queued to running to completed. From running it can enter waiting, paused or blocked and return to running, or move to cancelling and then cancelled, or to failed.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/></marker></defs><rect width="860" height="320" fill="none"/><rect x="30.0" y="160.0" width="110.0" height="42.0" rx="7" fill="#161b22" stroke="#9198a1" stroke-width="1.4"/><text x="85.0" y="185.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">queued</text><path d="M140.0 181.0 L180.0 181.0" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/><rect x="180.0" y="160.0" width="120.0" height="42.0" rx="7" fill="#121d2f" stroke="#4493f8" stroke-width="1.4"/><text x="240.0" y="185.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">running</text><path d="M300.0 181.0 L680.0 181.0" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/><rect x="680.0" y="160.0" width="140.0" height="42.0" rx="7" fill="#12261e" stroke="#3fb950" stroke-width="1.4"/><text x="750.0" y="185.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">completed</text><path d="M350.0 43.0 L350.0 279.0" fill="none" stroke="#6e7681" stroke-width="1.4"/><circle cx="350" cy="181" r="3.2" fill="#6e7681"/><path d="M350.0 43.0 L400.0 43.0" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)" marker-start="url(#b)"/><rect x="400.0" y="24.0" width="150.0" height="38.0" rx="7" fill="#2a2213" stroke="#d29922" stroke-width="1.4"/><text x="475.0" y="47.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">waiting</text><path d="M350.0 89.0 L400.0 89.0" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)" marker-start="url(#b)"/><rect x="400.0" y="70.0" width="150.0" height="38.0" rx="7" fill="#2a2213" stroke="#d29922" stroke-width="1.4"/><text x="475.0" y="93.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">paused</text><path d="M350.0 135.0 L400.0 135.0" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)" marker-start="url(#b)"/><rect x="400.0" y="116.0" width="150.0" height="38.0" rx="7" fill="#2a2213" stroke="#d29922" stroke-width="1.4"/><text x="475.0" y="139.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">blocked</text><path d="M350.0 233.0 L400.0 233.0" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/><rect x="400.0" y="214.0" width="150.0" height="38.0" rx="7" fill="#2b1416" stroke="#f85149" stroke-width="1.4"/><text x="475.0" y="237.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">cancelling</text><path d="M350.0 279.0 L400.0 279.0" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/><rect x="400.0" y="260.0" width="150.0" height="38.0" rx="7" fill="#2b1416" stroke="#f85149" stroke-width="1.4"/><text x="475.0" y="283.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">failed</text><path d="M550.0 233.0 L610.0 233.0" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/><rect x="610.0" y="214.0" width="140.0" height="38.0" rx="7" fill="#2b1416" stroke="#f85149" stroke-width="1.4"/><text x="680.0" y="237.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">cancelled</text></svg>
