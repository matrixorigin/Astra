<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" width="660" height="380" role="img" aria-labelledby="t d"><title id="t">Runner execution boundary</title><desc id="d">A user or app submits durable Work to the Astra Server, which owns durable Work, identity, context, policy and the provider decision. An admitted tool call goes to a User Runner inside the user or enterprise trust boundary, which reaches private enterprise IT: file, shell, Git, builds, private network and local MCP. A typed result with execution identity and evidence returns to the backbone.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/></marker></defs><rect width="660" height="380" fill="none"/><rect x="110.0" y="18.0" width="420.0" height="40.0" rx="7" fill="#161b22" stroke="#9198a1" stroke-width="1.4"/><text x="320.0" y="42.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">User / app</text><path d="M320.0 58.0 L320.0 100.0" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/><text x="332" y="83" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1">submit durable Work</text><rect x="110.0" y="100.0" width="420.0" height="58.0" rx="7" fill="#1d1b2e" stroke="#a371f7" stroke-width="1.4"/><text x="320.0" y="124.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Astra Server</text><text x="320.0" y="140.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1">durable Work · identity · context · policy · provider decision</text><path d="M320.0 158.0 L320.0 200.0" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/><text x="332" y="183" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1">admitted tool call</text><rect x="110.0" y="200.0" width="420.0" height="58.0" rx="7" fill="#12261e" stroke="#3fb950" stroke-width="1.4"/><text x="320.0" y="224.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">User Runner</text><text x="320.0" y="240.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1">inside the user or enterprise trust boundary</text><path d="M320.0 258.0 L320.0 292.0" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/><rect x="110.0" y="292.0" width="420.0" height="58.0" rx="7" fill="#12261e" stroke="#3fb950" stroke-width="1.4"/><text x="320.0" y="316.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Private enterprise IT</text><text x="320.0" y="332.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1">file · shell · Git · builds · private network · local MCP</text><path d="M530 321 L600 321 L600 129 L530 129" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/><text x="622" y="225" text-anchor="middle" transform="rotate(-90 622 225)" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1">typed result + execution identity + evidence</text></svg>
