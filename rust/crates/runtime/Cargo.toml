[package]
name = "astra-runtime"
version.workspace = true
edition.workspace = true

[features]
default = ["harness"]
# Full `/chat/turn` ledger inject tests (see `tests/chat_turn_bridge_ledger_inject_e2e.rs`).
bridge-e2e-hooks = []
# Enables OTLP trace export via `astra-logging` (build with `--features otel`).
otel = ["astra-logging/otel"]
# Observation + verification harness (zero cost when disabled).
harness = ["dep:astra-harness"]

[[test]]
name = "chat_turn_bridge_ledger_inject_e2e"
path = "tests/chat_turn_bridge_ledger_inject_e2e.rs"
required-features = ["bridge-e2e-hooks"]

[[test]]
name = "edge_cloud_round_trip_e2e"
path = "tests/edge_cloud_round_trip_e2e.rs"
required-features = ["bridge-e2e-hooks"]

[[test]]
name = "system_matrix_http_e2e"
path = "tests/system_matrix_http_e2e/main.rs"
required-features = ["bridge-e2e-hooks"]

[[bin]]
name = "astra-server"
path = "src/main.rs"

[dependencies]
crc32fast = "1.4"
dirs = "6.0.0"
fastrand = "2"
percent-encoding = "2.3"
astra-logging.workspace = true
astra-config.workspace = true
astra-evolution.workspace = true
astra-core.workspace = true
astra-learning.workspace = true
astra-messaging.workspace = true
astra-text-utils.workspace = true
astra-pipeline.workspace = true
astra-plan.workspace = true
astra-prompts.workspace = true
astra-sandbox.workspace = true
astra-server-types = { workspace = true, features = ["server"] }
astra-skills.workspace = true
astra-sync-adapters.workspace = true
astra-turn-core = { workspace = true, features = ["db-store"] }
astra-turn-types.workspace = true
astra-services.workspace = true
astra-tools.workspace = true
astra-thin-client.workspace = true
async-stream.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
dotenvy.workspace = true
flate2.workspace = true
futures-util.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
tar.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
http-body-util.workspace = true
uuid.workspace = true
thiserror.workspace = true
astra-harness = { workspace = true, optional = true }
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
dashmap = "6.1.0"
toml = { version = "1.1.2", features = ["preserve_order"] }

[dev-dependencies]
astra-core = { workspace = true, features = ["dev-defaults"] }
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
futures-util.workspace = true
serial_test = "3"
sqlx.workspace = true
tempfile = "3"
# `test-util` enables `#[tokio::test(start_paused = true)]` and `tokio::time::pause`
# so timeout-enforcement tests can use virtual time.
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tower.workspace = true
proptest = "1"

[[bench]]
name = "hot_paths"
harness = false

[[bench]]
name = "harness_overhead"
harness = false
required-features = ["harness"]

[[bench]]
name = "messaging"
harness = false
