[package]
name = "astra-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "astra"
path = "src/main.rs"

[dependencies]
astra-core.workspace = true
astra-logging.workspace = true
astra-prompts.workspace = true
astra-services.workspace = true
astra-runtime.workspace = true
astra-pipeline.workspace = true
astra-messaging.workspace = true
astra-skills.workspace = true
astra-evolution.workspace = true
astra-learning.workspace = true
astra-config.workspace = true
astra-turn-core.workspace = true
astra-turn-types.workspace = true
astra-text-utils.workspace = true
astra-tools.workspace = true
astra-thin-client.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
clap = { version = "4.5.38", features = ["derive"] }
crossterm = { version = "0.28", features = ["bracketed-paste", "event-stream"] }
derive_more = { version = "1", features = ["is_variant"] }
dirs = "6.0.0"
dotenvy.workspace = true
futures-util.workspace = true
regex.workspace = true
reqwest.workspace = true
rpassword = "7.4"
rustyline = { version = "14", features = ["with-file-history"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
base64.workspace = true
sqlx.workspace = true
supports-color = "3"
textwrap = "0.16"
termimad = "0.23"
unicode-segmentation = "1.12"
unicode-width = "0.1"
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util.workspace = true
uuid.workspace = true
url = "2.5"
gix = { version = "0.81.0", features = ["status", "blame", "mailmap", "revision"] }
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
# MCP client for external tool integration
rmcp = { version = "1.3", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-async-rw"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
nix.workspace = true
pulldown-cmark = "0.12"
ratatui = { version = "0.29", features = ["scrolling-regions", "unstable-backend-writer", "unstable-rendered-line-info", "unstable-widget-ref"] }
syntect = "5"
two-face = { version = "0.5", default-features = false, features = ["syntect-default-onig"] }
clap_complete = "4.6.0"
inquire = "0.7"
urlencoding = "2.1.3"

[dev-dependencies]
itertools = "0.13"
http = "1"
pretty_assertions = "1"
serial_test = "3"
tempfile = "3"
temp-env = "0.3"
wiremock = "0.6"
