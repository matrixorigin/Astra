[package]
name = "mo-agent-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mo-agent"
path = "src/main.rs"

[dependencies]
mo-agent-core.workspace = true
mo-agent-services.workspace = true
mo-agent-runtime.workspace = true
mo-thin-client.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
clap = { version = "4.5.38", features = ["derive"] }
crossterm = "0.27"
dirs = "6.0.0"
dotenvy.workspace = true
futures-util.workspace = true
regex.workspace = true
reqwest.workspace = true
rpassword = "7.4"
rustyline = { version = "14", features = ["with-file-history"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9.34"
sha2.workspace = true
base64.workspace = true
sqlx.workspace = true
termimad = "0.23"
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "signal"] }
tokio-util.workspace = true
uuid.workspace = true
url = "2.5"
gix = { version = "0.81.0", features = ["status", "blame", "mailmap", "revision"] }
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
# MCP client for external tool integration
rmcp = { version = "1.3", default-features = false, features = ["client", "transport-child-process"] }

[dev-dependencies]
serial_test = "3"
tempfile = "3"
wiremock = "0.6"
