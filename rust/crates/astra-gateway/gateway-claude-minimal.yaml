# Gateway — minimal Claude-only deployment
#
# Features:
#   - No DB required (storage: none)
#   - Claude CLI as the only backend
#   - stream-json output for real-time token/tool progress
#   - Claude Code hooks (PostToolUse + Stop) for fine-grained events
#
# Start:
#   cargo run -p astra-gateway --release -- --config rust/crates/astra-gateway/gateway-claude-minimal.yaml
#
# Required env:
#   WEIXIN_TOKEN      — from: make gateway-login-weixin
#   WEIXIN_ACCOUNT_ID — from: make gateway-login-weixin
#   ANTHROPIC_API_KEY — Claude API key (read by claude CLI)

storage:
  backend: none

cli:
  type: claude
  bin: claude               # assumes `claude` is on PATH; or set full path
  model: claude-sonnet-4-6  # override per-session with /model
  stream_json: true         # enables --output-format stream-json + --include-partial-messages + --include-hook-events
  # Extra args injected before the prompt — loads the gateway hook definitions.
  # Hooks POST PostToolUse and Stop events to 127.0.0.1:7701/hook/* for the gateway to process.
  extra_args:
    - "--settings"
    - "rust/crates/astra-gateway/claude-gateway-hooks.json"

max_concurrent_runs: 2

action_policy:
  allow_slash_mutations: true
  allow_model_generated_mutations: false  # safer default without DB audit log
  workspace_roots: []

platforms:
  weixin:
    enabled: true
    token: ""       # set here or via WEIXIN_TOKEN env var
    account_id: ""  # set here or via WEIXIN_ACCOUNT_ID env var
