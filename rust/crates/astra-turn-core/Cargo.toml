[package]
name = "astra-turn-core"
version.workspace = true
edition.workspace = true

[features]
# Enables the database-backed CslStore (`DbCslStore`) and its sqlx dependency.
# Consumers that only need the in-process / file-backed stores (CLI, unit tests)
# should NOT enable this feature so they don't pay the sqlx compile cost.
db-store = ["dep:sqlx"]

[dependencies]
astra-core.workspace = true
astra-messaging.workspace = true
astra-pipeline.workspace = true
astra-sandbox.workspace = true
astra-services.workspace = true
astra-text-utils.workspace = true
astra-thin-client.workspace = true
astra-tools = { path = "../astra-tools" }
astra-turn-types.workspace = true
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
dashmap = "6.1.0"
dirs = "6.0.0"
fastrand = "2"
futures-util = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml_ng.workspace = true
sqlx = { workspace = true, features = ["chrono"], optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
proptest = "1"
