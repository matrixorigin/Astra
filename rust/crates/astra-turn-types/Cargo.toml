[package]
name = "astra-turn-types"
version = "0.1.0"
edition = "2024"
description = "Core turn types for astra runtime"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }

[dev-dependencies]
# Only used to assert our mirrored abstract-length constants stay in
# sync with the canonical definitions in astra_prompts::memory_proto.
astra-prompts = { path = "../astra-prompts" }
