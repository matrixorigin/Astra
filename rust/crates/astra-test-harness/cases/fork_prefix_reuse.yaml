name: fork_prefix_reuse
description: |
  Regression guard for the fork-prefix cache inheritance pipeline.
  When the parent spawns a child with `inherit_prefix: {}`, the
  runtime captures the parent's canonical messages, stores them in
  the fork-prefix store, and the child reconstructs them at turn 0.
  This case asserts the end-to-end wiring by checking the
  `[fork-cache]` observability line in stderr.
prompt: |
  You have a `spawn_agent` tool. Spawn a sub-agent and pass
  `inherit_prefix: {}` in the call so the child inherits your
  conversation prefix. Ask the child to reply with exactly
  "inherited-ok". Surface the child's reply verbatim.
debug_log: true
timeout_seconds: 240
extra_cli_args:
  - --debug-log-tools
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: spawn_agent
  - type: stderr_matches
    pattern: '\[fork-cache\]'
  - type: judger
    question: |
      Did the parent agent spawn the child WITH inherit_prefix set,
      and did the child's reply appear verbatim in the final answer?
    threshold: 0.7
