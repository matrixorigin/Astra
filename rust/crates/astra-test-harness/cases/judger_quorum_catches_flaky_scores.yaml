name: judger_quorum_catches_flaky_scores
description: |
  **What**: Ask a borderline subjective question and verify the quorum judger smooths out scoring variance across multiple evaluations.
  **Tests**: QuorumJudger reliability — a single judger call may score inconsistently; quorum (--judger-n 3) should stabilize the result.
  **Why**: Meta-regression for the judger infrastructure itself; if quorum fails to dampen variance, all judger-gated cases become flaky.
  **Pass means**: The quorum-averaged score is stable across runs, proving the multi-call judger correctly smooths outliers.
  **Fail means**: Judger quorum logic is broken (scores not averaged), or the borderline threshold needs recalibration.
prompt: |
  Explain TCP in exactly one short sentence that mentions at least
  three concepts: "reliability", "ordering", and "connection". Do
  not use tools.
timeout_seconds: 60
criteria:
  - type: exit_code
    code: 0
  - type: text_contains
    needle: "reliab"
  - type: text_contains
    needle: "order"
  - type: text_contains
    needle: "connect"
  - type: judger
    question: |
      Is the explanation a single sentence, factually correct about
      TCP, and does it mention reliability, ordering, and
      connections naturally (not as a list)? A score of 0.7-1.0
      means all three concepts are present in a coherent sentence.
      Below 0.7 means something is missing or the sentence reads
      unnaturally.
    threshold: 0.7
