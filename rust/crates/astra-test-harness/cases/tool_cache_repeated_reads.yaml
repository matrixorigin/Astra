name: tool_cache_repeated_reads
description: |
  **What**: Read the same file twice and verify the second call hits the tool idempotency cache with a cache rate above 30%.
  **Tests**: Tool call idempotency cache — repeated identical read_file calls must be served from cache, not re-executed.
  **Why**: Without caching, redundant tool calls waste tokens and latency; this guards against cache bypass regressions in the runtime.
  **Pass means**: Two read_file calls were made and the cache_rate_above criterion passed, proving the idempotency cache is functioning.
  **Fail means**: Cache miss on identical calls (cache disabled or broken), or the agent ignored the instruction to read twice.
prompt: |
  Read the file Makefile using read_file. Then read the exact same
  file again (Makefile, same path). Tell me how many lines it has.
  You MUST call read_file twice — once to read it, once to verify.
capability: efficiency
difficulty: 2
weight: 1.5
timeout_seconds: 120
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: read_file
  - type: tools_count_between
    min: 2
    max: 6
  - type: cache_rate_above
    threshold: 0.3
    min_calls: 2
