name: spawn_agent_hello
description: |
  **What**: Spawn a sub-agent, have it reply with a known phrase, and verify the parent surfaces the reply verbatim.
  **Tests**: Basic orchestration via spawn_agent — tool discovery, delegation dispatch, and result surfacing.
  **Why**: Canonical orchestration smoke test; if this fails, all multi-agent workflows (delegation, fork-prefix, matrix runs) are broken.
  **Pass means**: The model discovered spawn_agent, delegated successfully, and surfaced the child's reply prefixed with "CHILD:".
  **Fail means**: spawn_agent tool not discovered (selector issue), delegation dispatch failed (runtime bug), or result not surfaced (model instruction-following issue).
prompt: |
  You have a `spawn_agent` tool and a `get_agent_result` tool.

  Step 1: Call spawn_agent with:
    agent_id: "child-hello"
    task: "Reply with exactly: hello from child"
    background: true

  Step 2: Call get_agent_result with agent_id from step 1 to retrieve
  the child's reply once it completes.

  Report "CHILD:" followed by the child's reply in your final answer.
timeout_seconds: 180
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: spawn_agent
  - type: tools_count_between
    min: 1
    max: 10
  - type: text_contains
    needle: "CHILD:"
  - type: judger
    question: |
      Did the agent correctly delegate via spawn_agent and surface
      the child's reply in its final answer? A correct response
      spawns a child, receives its reply, and includes that reply
      (prefixed "CHILD:") in the final text. Partial credit if it
      spawned but didn't surface the reply.
    threshold: 0.7
