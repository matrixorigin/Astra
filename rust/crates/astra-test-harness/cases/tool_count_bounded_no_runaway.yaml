name: tool_count_bounded_no_runaway
description: |
  Catches runaway tool-loop regressions. A well-behaved agent given
  a trivial task should make ≤ 4 tool calls. If a compaction bug or
  circuit-breaker regression makes the agent loop, this case FAILs
  loudly with `tool_calls_count` out of range — much faster than
  noticing via production session metrics.
prompt: |
  List the current directory using one tool call. Your final answer
  should be a one-sentence summary of what you found.
timeout_seconds: 120
criteria:
  - type: exit_code
    code: 0
  - type: tools_count_between
    min: 1
    max: 4
