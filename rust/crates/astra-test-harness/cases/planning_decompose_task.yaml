name: planning_decompose_task
description: |
  **What**: Give a multi-step file task (check, create, read, delete) and verify the agent decomposes it into sequential tool calls.
  **Tests**: Task decomposition and planning — the agent must break a compound task into ordered steps rather than attempting one monolithic action.
  **Why**: Complex real-world tasks require step-by-step execution; an agent that tries to do everything in one shot will fail on interdependent steps.
  **Pass means**: The agent used 3+ tool calls in a logical sequence, proving it decomposed the task and executed steps in order.
  **Fail means**: Agent attempted a single-shot execution (no decomposition), or steps were misordered causing downstream failures.
prompt: |
  I need you to: 1) check if /tmp exists, 2) create a file
  /tmp/astra_plan_test.txt with content "step1 done", 3) read it back
  to confirm, 4) delete it. Do all steps and report each result.
capability: planning
difficulty: 2
weight: 1.5
timeout_seconds: 180
teardown_cmd: "rm -f /tmp/astra_plan_test.txt"
criteria:
  - type: exit_code
    code: 0
  - type: tools_count_between
    min: 1
    max: 15
  - type: turn_rounds_between
    min: 1
    max: 8
  - type: judger
    question: |
      Evaluate based on the tool calls and text output only.
      Do NOT try to read or verify files yourself.
      The agent was asked to: check /tmp exists, create a file,
      read it back, then delete it. Score based on OUTCOMES reported
      in the text, not on how many individual tool calls were used.
      Bundling steps into a single bash call is valid if all 4 steps
      completed. Score 1.0 if all 4 steps reported as done, 0.5 if
      partially, 0.0 if fabricated.
    threshold: 0.6
