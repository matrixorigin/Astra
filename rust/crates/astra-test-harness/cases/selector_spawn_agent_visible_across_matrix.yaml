name: selector_spawn_agent_visible_across_matrix
description: |
  **What**: Run spawn_agent across three different model families (Alibaba, Anthropic, MiniMax) and verify all can discover and use it.
  **Tests**: Cross-model tool selector visibility — spawn_agent must be surfaced by the tfidf selector regardless of model family.
  **Why**: G3 regression for a bug where spawn_agent had no TOOL_CATALOG entry, making it invisible to some models; the fix must work across all families.
  **Pass means**: All three model families discovered spawn_agent and used it, proving the selector fix is universal.
  **Fail means**: Tool selector regression — spawn_agent is hidden from one or more model families (TOOL_CATALOG or selector bug).
prompt: |
  You have a `spawn_agent` tool. Call it with:
    agent_id: "child-G3"
    task: "Reply with exactly: G3-matrix-ok"
    background: false

  IMPORTANT: You MUST set background: false so you receive the child's
  reply synchronously in the tool result.

  Surface the child's reply in your final answer.
models:
  - qwen-flash
  - us.anthropic.claude-sonnet-4-6
  - MiniMax-M2.7
timeout_seconds: 180
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: spawn_agent
  - type: tools_count_between
    min: 1
    max: 4
  - type: text_contains
    needle: "G3-matrix-ok"
