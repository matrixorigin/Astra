name: fork_prefix_thinking_budget_conflict
description: |
  **What**: Spawn a child with a tiny max_output_tokens to force a thinking budget clamp, verifying the resolver handles the cache key divergence.
  **Tests**: ForkValidationError::ThinkingBudgetConflict — when the child's clamped budget diverges from the parent's, the resolver must soft-fall back.
  **Why**: Anthropic's KV cache key includes thinking.budget_tokens; a mismatch means prefix reuse is meaningless and would waste tokens or produce errors.
  **Pass means**: The resolver detected the budget conflict and either soft-fell back (no prefix) or the clamp happened not to diverge (legitimate hit).
  **Fail means**: Corrupt prefix sent despite budget mismatch (silent cache key collision), or the resolver crashed instead of falling back gracefully.
prompt: |
  You have a `spawn_agent` tool.

  Call it with:
    agent_id: "child-thinking-clamp"
    task: "Say the exact text: thinking-clamp-ok. Do not use any tools, just reply with that text."
    max_output_tokens: 256
    inherit_prefix: {}

  The child runs synchronously — you will receive its reply directly
  in the tool result.

  Surface the child's reply in the final answer. If the spawn
  soft-falls back without the prefix, acknowledge that in the text.
models:
  - us.anthropic.claude-sonnet-4-6
debug_log: true
timeout_seconds: 240
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: spawn_agent
  # Note: ThinkingBudgetConflict takes a non-deterministic path. If the
  # clamp actually triggers the resolver short-circuits via
  # `PrefixResolveOutcome::Failed` and NO `[fork-cache]` event is
  # emitted. If the provider happens to round the same way the clamp
  # is moot and we see a `hit`. We can't pin either branch at
  # case-load time, so no `fork_cache_outcome` criterion here —
  # that would FAIL the clamp-triggered branch exactly when the
  # resolver did the right thing. The judger below discriminates
  # both branches by reading stderr + the agent's transcript.
  - type: judger
    question: |
      The child was spawned with max_output_tokens=256 and
      inherit_prefix, which may trigger a ThinkingBudgetConflict.
      The runtime handles this by soft-falling back (spawning
      without prefix). A [fork-cache] stderr event is ONLY emitted
      when inheritance succeeds; absence of the event is EXPECTED
      on the fallback path.
      Focus on the OUTCOME: did the parent invoke spawn_agent and
      did the child produce a reply (e.g. containing
      "thinking-clamp-ok")? The child may also fail if the model
      cannot fit output in 256 tokens — that is acceptable.
      Score 1.0 if spawn_agent was called AND either a child reply
      or a transparent fallback/error message appears in the text.
      Score 0.5 if spawn_agent was called but the outcome is unclear.
      Score 0.0 if no spawn happened or the agent fabricated results.
    threshold: 0.5
