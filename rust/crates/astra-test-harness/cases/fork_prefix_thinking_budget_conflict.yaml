name: fork_prefix_thinking_budget_conflict
description: |
  Regression for `ForkValidationError::ThinkingBudgetConflict`.
  Anthropic's KV cache key includes `thinking.budget_tokens`. If the
  child's `max_output_tokens` clamps the effective budget to a
  different value than the parent used, the cache key diverges and
  reuse is meaningless. The resolver must catch this and soft-fall
  back rather than send a corrupt prefix.

  The child is explicitly constrained with a tiny max_output_tokens
  that forces the thinking budget to be clamped, so validation
  fires.
prompt: |
  You have a `spawn_agent` tool.

  Call it with:
    agent_id: "child-thinking-clamp"
    task: "Reply: thinking-clamp-ok"
    max_output_tokens: 256   # deliberately low to force budget clamp
    inherit_prefix: {}

  Surface the child's reply in the final answer. If the spawn
  soft-falls back without the prefix, acknowledge that in the text.
models:
  - us.anthropic.claude-sonnet-4-6
debug_log: true
timeout_seconds: 240
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: spawn_agent
  # Note: ThinkingBudgetConflict short-circuits the resolver via
  # `PrefixResolveOutcome::Failed` rather than emitting a
  # `[fork-cache]` event. So if the clamp triggers, no fork-cache
  # line appears at all; if the clamp did NOT matter (provider
  # happened to round the same way) we get a `hit`. Both are fine.
  # Deterministic check: if a fork-cache event DID appear, outcome
  # must be `hit` (a `miss` / `partial_drift` with a clamp-triggered
  # divergence would mean the resolver missed the validation). This
  # is "optional" semantics because we don't know a priori which
  # branch the runtime will take.
  - type: fork_cache_outcome
    # If any event appears at all it must be a hit. If none appears
    # (resolver rejected), the fork_cache_outcome check FAILs and we
    # fall back to the judger below for evidence of soft-fallback.
    expect: [hit]
    # The criterion doesn't have an `optional` field yet; a future
    # case-level `allow_fail` gate could cover this. For now rely on
    # the judger when the resolver rejects.
  - type: judger
    question: |
      Either (a) the fork_cache_outcome criterion above already
      passed with a hit (clamp didn't matter), OR (b) no [fork-cache]
      event appeared because the resolver caught the
      ThinkingBudgetConflict and the child ran without inheritance.
      For case (b), evidence of correct behavior is a spawn_agent
      tool error surfaced in the agent's transcript and a final text
      that either reports the child's reply (spawn retried without
      inheritance) OR transparently acknowledges the fallback. Do
      NOT reward a silent success claim.
    threshold: 0.7
