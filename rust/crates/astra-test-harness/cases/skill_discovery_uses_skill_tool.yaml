name: skill_discovery_uses_skill_tool
description: |
  **What**: Ask the agent to actually execute a skill-backed workflow so it must invoke the `skill` tool to load the phased instructions.
  **Tests**: Skill tool is present in `tools[]` and the runtime accepts a `skill` invocation end-to-end. A wire-level regression that disconnects the `skill` tool (schema drift, registry drop, routing bug) would make the invocation fail.
  **Why**: Naming a skill is not proof the tool works — the `<available_skills>` listing already reveals skill names in the prompt, so the model can always guess. The only behavior that actually exercises the `skill` tool is requesting *execution*, which forces the model to invoke `skill` to get the phased instructions (returned as `<skill-loaded name="..."/>` + body).
  **Pass means**: The agent invoked `skill` with a relevant skill name, and the tool returned the skill body without error.
  **Fail means**: The agent responded without invoking `skill` (prompt-only answer), or the invocation errored (broken tool wiring).
prompt: |
  Load the analyze-session skill via the skill tool so I can read
  its phase 1 instructions. Do NOT start executing the skill or
  running any other tools — I only want you to load the skill, then
  paste the phase 1 instructions back to me verbatim and stop.
timeout_seconds: 120
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: skill
  - type: judger
    question: |
      Did the agent invoke the `skill` tool (check tools_used) with a
      skill name (ideally `analyze-session` or `analyze_session`)?
      Score 1.0 if `skill` appears in tools_used. Score 0.0 otherwise.
      The final text answer does not matter — only the tool_use.
    threshold: 0.9
