name: skill_discovery_uses_skill_tool
description: |
  **What**: Ask for a skill-relevant task and verify the agent uses the skill/discover_skills tool rather than improvising.
  **Tests**: Dynamic skill tool injection — the runtime's lifecycle preamble must inject skill tools when a resolver is present.
  **Why**: A regression in the injection path or selector surfacing would make skills silently uncallable, degrading the agent to brute-force approaches.
  **Pass means**: The agent invoked skill or discover_skills and named a specific relevant skill, proving the injection and selector paths work.
  **Fail means**: Skill tools were not injected (lifecycle preamble bug), not surfaced by the selector, or the agent guessed a skill name without using the discovery tool.
prompt: |
  I want to analyze a past astra session to find token waste. There's
  likely a skill for this. Use whichever tool discovers available
  skills and tell me the name of the most relevant one. Do not try
  to perform the analysis — I only want the skill's name.
timeout_seconds: 120
criteria:
  - type: exit_code
    code: 0
  - type: judger
    question: |
      Did the agent invoke a tool named `skill` or `discover_skills`
      (check tools_used list), and did its final answer name a
      specific skill (e.g. "analyze_session" or "analyze-session")?
      Score 1.0 for both. Score 0.4 for naming a skill but without
      using the discovery tool (could be guessing). Score 0.0 if no
      specific skill is named.
    threshold: 0.6
