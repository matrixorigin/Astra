name: text_contains_simple_answer
description: |
  Factual-answer smoke test. Verifies the model can answer a simple
  knowledge question and produce the correct text output. The answer
  must appear in the final text regardless of whether the model chose
  to verify via tools.
prompt: |
  What year did Rust 1.0 ship? Reply with just the year as a 4-digit
  number. No extra prose.
timeout_seconds: 120
criteria:
  - type: exit_code
    code: 0
  - type: text_contains
    needle: "2015"
