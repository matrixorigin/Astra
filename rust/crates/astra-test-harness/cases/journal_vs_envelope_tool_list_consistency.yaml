name: journal_vs_envelope_tool_list_consistency
description: |
  Cross-validation: the CLI JSON envelope's `tools_used` should
  match the journal's ToolCallCompleted events. A disagreement means
  the envelope is missing tools emitted inside sub-agent runs — a
  known class of bug that the harness can now catch automatically
  since it loads both data sources.

  We exercise a prompt that triggers at least one tool call. The
  `tool_called` criterion reads from the envelope; `journal_tool_called`
  reads from the journal. Both must agree on the same tool name.
prompt: |
  Use the list_dir tool to list the current directory. Then briefly
  describe what you saw in one sentence.
debug_log: true
timeout_seconds: 120
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: list_dir
  - type: journal_tool_called
    name: list_dir
  - type: session_event_count
    event_type: ToolCallCompleted
    min: 1
