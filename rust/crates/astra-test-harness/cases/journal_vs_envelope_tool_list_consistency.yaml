name: journal_vs_envelope_tool_list_consistency
description: |
  Cross-validation: the CLI JSON envelope's `tools_used` should match
  the tool names nested in the journal's `llm_round.tool_calls`
  array. A disagreement means the envelope is missing tools emitted
  inside sub-agent runs — a known class of bug that the harness now
  catches automatically since it loads both data sources.

  We exercise a prompt that triggers at least one tool call. The
  `tool_called` criterion reads from the envelope;
  `journal_tool_called` walks the journal (which supports legacy
  `llm_round.tool_calls[]` as well as step-events
  `ToolCallCompleted`). Both must agree on the same tool name.
prompt: |
  Use the list_dir tool to list the current directory. Then briefly
  describe what you saw in one sentence.
debug_log: true
timeout_seconds: 120
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: list_dir
  - type: journal_tool_called
    name: list_dir
  # `llm_round` is universal in the legacy jsonl; `ToolCallCompleted`
  # only appears when the step-events layout is enabled. Assert on
  # the universal event type so this case runs cleanly against any
  # session.
  - type: session_event_count
    event_type: llm_round
    min: 1
