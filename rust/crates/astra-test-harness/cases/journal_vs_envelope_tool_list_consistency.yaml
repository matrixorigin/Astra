name: journal_vs_envelope_tool_list_consistency
description: |
  **What**: Trigger a tool call and verify the CLI JSON envelope's tools_used matches the journal's tool_calls records.
  **Tests**: Cross-source consistency — envelope and journal must agree on which tools were called, including sub-agent runs.
  **Why**: Guards against a known bug class where the envelope omits tools emitted inside sub-agent runs, breaking post-hoc analysis and billing.
  **Pass means**: Both the envelope (tool_called) and journal (journal_tool_called / StepCompleted) report the same tool, proving data-source parity.
  **Fail means**: Envelope-journal desync — the envelope is missing tool calls (likely sub-agent emission bug) or the journal loader dropped events.
prompt: |
  Use ONLY the `list_dir` tool (not `bash`, not any other tool) to
  list the current directory. After you see the output, briefly
  describe what you saw in one sentence.

  Constraint: you must call `list_dir` exactly once. Do not use bash,
  read_file, grep, or any other tool for this task.
debug_log: true
timeout_seconds: 120
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: list_dir
  # Layout note: real `astra chat --json` runs on this deployment
  # write ONLY the step-events layout (`<id>/step_events.jsonl`).
  # The legacy layout (`<id>.jsonl` with `llm_round`) is gated
  # behind `full_llm_capture` / `astra session trace on` and is
  # NOT produced by a plain chat invocation. `StepCompleted` is
  # the step-events analogue: exactly one per completed turn.
  - type: session_event_count
    event_type: StepCompleted
    min: 1
