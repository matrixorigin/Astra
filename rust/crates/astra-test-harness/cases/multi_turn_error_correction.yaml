name: multi_turn_error_correction
description: |
  **What**: Give a simple question in turn 1, then correct/refine it in turn 2, verifying the agent adapts.
  **Tests**: Multi-turn error correction — the agent must incorporate user corrections from subsequent turns using session context.
  **Why**: Real users frequently refine or correct their requests; if the agent ignores follow-up corrections, iterative workflows fail.
  **Pass means**: The agent correctly answers the refined question (13+14+15=42) in turn 2, proving it reads and applies user corrections.
  **Fail means**: Session context lost (agent cannot see turn 1), or the agent ignores the correction and repeats the old answer.
prompt: "What is 13+14? Answer with just the number."
capability: instruction_following
difficulty: 1
weight: 1.0
timeout_seconds: 120
steps:
  - prompt: "Actually, I meant what is 13+14+15? Give me just the number."
    criteria:
      - type: text_contains
        needle: "42"
criteria:
  - type: exit_code
    code: 0
  - type: turn_rounds_between
    min: 1
    max: 4
