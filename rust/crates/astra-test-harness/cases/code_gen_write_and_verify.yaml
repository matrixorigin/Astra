name: code_gen_write_and_verify
description: |
  **What**: Ask the agent to write a Python fibonacci function to a file, then run and verify correctness.
  **Tests**: End-to-end code generation — file writing, code correctness, and self-verification via tool use.
  **Why**: Validates the full dev-loop workflow (write, execute, confirm) that production agents rely on daily.
  **Pass means**: The agent can generate correct code, persist it to disk, and verify it by execution.
  **Fail means**: Code generation bug (wrong logic), file-write tool failure, or inability to chain write-then-execute steps.
  **Note**: Uses workspace-relative path so write_file/str_replace work within sandbox.
prompt: |
  Write a Python script at .harness_fib.py that defines a function
  fibonacci(n) returning the nth Fibonacci number (0-indexed, so
  fibonacci(0)=0, fibonacci(1)=1, fibonacci(10)=55). Then run it with
  python3 -c "import sys; sys.path.insert(0,'.'); from harness_fib import fibonacci; print(fibonacci(10))"
  and confirm the output is 55.
capability: code_generation
difficulty: 3
weight: 2.0
timeout_seconds: 180
teardown_cmd: "rm -f .harness_fib.py"
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: bash
  - type: text_contains
    needle: "55"
  - type: turn_rounds_between
    min: 1
    max: 12
  - type: tokens_between
    min: 1
    max: 150000
  - type: judger
    question: |
      Evaluate ONLY based on the tool calls and final text provided.
      Do NOT attempt to read or execute files yourself.
      The agent was asked to write a fibonacci function and verify
      fibonacci(10)=55. Check: (1) did the tool calls include writing
      a file and running bash? (2) does the final text confirm the
      output was 55? Score 1.0 if both are true, 0.5 if partially,
      0.0 if the agent claimed success without evidence.
    threshold: 0.7
