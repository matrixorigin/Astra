name: efficiency_bounds_basic
description: |
  **What**: Send a trivial prompt and validate that efficiency criteria (tokens, duration, turn rounds) evaluate without errors.
  **Tests**: Harness criteria plumbing — tokens_between, duration_between, and turn_rounds_between all fire correctly on a minimal case.
  **Why**: Ensures new criteria types work end-to-end; if the harness can't evaluate these on a trivial prompt, all efficiency-gated cases are broken.
  **Pass means**: The harness criteria engine correctly extracts and evaluates token counts, wall-clock duration, and turn rounds.
  **Fail means**: Criteria extraction bug in the harness itself (not a model issue) — e.g., missing fields in the JSON envelope.
prompt: "Say exactly: ok"
timeout_seconds: 60
capability: efficiency
difficulty: 1
weight: 0.5
criteria:
  - type: exit_code
    code: 0
  - type: tokens_between
    min: 1
    max: 100000
  - type: duration_between
    min_ms: 0
    max_ms: 120000
  - type: turn_rounds_between
    min: 0
    max: 50
