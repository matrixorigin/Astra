name: compaction_preserves_recent_reads
description: |
  **What**: Read a file, then reference its contents later without re-reading, verifying context survives compaction.
  **Tests**: Compaction resilience — recent_file_reads state must be re-injected after context compaction.
  **Why**: Regression guard for a known bug class where compaction drops file-read state, causing the agent to "forget" files it already read in long sessions.
  **Pass means**: The agent retains specific file content (target names, variables) after compaction pressure, proving state re-injection works.
  **Fail means**: Compaction dropped recent_file_reads — the agent either re-read the file (wasted a tool call) or fabricated generic content.
prompt: |
  First, use read_file to look at ./Makefile (top 30 lines is fine).
  Then in your final answer, do two things:
    1. Describe what's in the Makefile based on what you just read.
    2. Reference a SPECIFIC target or variable name from the file.

  Do not re-read the file. Use only one tool call.
timeout_seconds: 120
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: read_file
  - type: tools_count_between
    min: 1
    max: 2
  - type: judger
    question: |
      Does the final answer quote a specific Makefile target or
      variable (like `test`, `build`, `dev-start`, `CC`, `RUSTFLAGS`,
      etc.) that would only be known by having actually read the
      file? Generic answers that could apply to any Makefile
      ("has some rules", "defines targets") score 0.3. Concrete
      citations score 1.0. Clear fabrication scores 0.0.
    threshold: 0.7
