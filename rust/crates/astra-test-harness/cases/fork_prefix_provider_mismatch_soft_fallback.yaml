name: fork_prefix_provider_mismatch_soft_fallback
description: |
  **What**: Spawn a child on a different provider than the parent and verify the fork-prefix resolver soft-falls back gracefully.
  **Tests**: ForkValidationError::ProviderMismatch — cross-provider prefix inheritance must fail safely, not crash or corrupt.
  **Why**: Guards against a P0 bug where a mismatched provider prefix is sent to the wrong backend, causing silent corruption or a panic.
  **Pass means**: The resolver detected the provider mismatch, rejected the prefix, and the child ran without inheritance (or the error was reported transparently).
  **Fail means**: Runtime crash (panic on mismatch), silent corruption (wrong prefix sent to wrong provider), or the resolver failed to detect the mismatch.
prompt: |
  You have a `spawn_agent` tool.

  Step 1 — call spawn_agent with:
    agent_id: "child-cross-provider"
    task: "Say the exact text: cross-provider-fallback-ok. Do not use any tools, just reply with that text."
    model: "qwen-flash"
    inherit_prefix: {}

  The child runs synchronously — you will receive its reply directly
  in the tool result.

  Step 2 — surface the child's reply in your final answer. If the
  spawn fails, still report what you saw.

  Note: parent MUST be on claude-sonnet-4-6 for this case to exercise
  the mismatch — drive this case with --models us.anthropic.claude-sonnet-4-6.
models:
  - us.anthropic.claude-sonnet-4-6
debug_log: true
timeout_seconds: 240
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: spawn_agent
  # Note on observability: the current runtime signals validation
  # failures via `PrefixResolveOutcome::Failed` (spawner returns a
  # SpawnError), NOT via a `[fork-cache]` stderr event. So this case
  # does NOT assert a fork-cache line — instead we verify:
  #   (a) the agent still invoked spawn_agent (fork_cache didn't
  #       silently short-circuit the call),
  #   (b) the whole run still terminated cleanly (exit_code 0 — the
  #       parent caught the tool error and surfaced it in text).
  # A future `[fork-resolve]` stderr sink would let us pin this
  # deterministically; see docs/scope-cut in PR #288.
  - type: judger
    question: |
      The child was spawned on 'qwen-flash' (different provider than
      the anthropic parent) with inherit_prefix. The runtime
      soft-falls back (spawning without prefix) on ProviderMismatch.
      Focus on the OUTCOME: did the parent invoke spawn_agent and
      did the child produce a reply (e.g. containing
      "cross-provider-fallback-ok") or did the parent report the
      error/fallback transparently?
      The child may exhaust its turn budget if the task is classified
      as trivial by the turn-budget heuristic — that is a runtime
      infrastructure issue, not a model failure. If the child replied
      "Turn budget exhausted", the spawn DID execute.
      Score 1.0 if spawn_agent was called AND either a child reply
      or an error/fallback message appears in the text.
      Score 0.5 if spawn_agent was called but outcome is unclear.
      Score 0.0 if no spawn or the agent fabricated results.
    threshold: 0.7
