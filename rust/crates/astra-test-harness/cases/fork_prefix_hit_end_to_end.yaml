name: fork_prefix_hit_end_to_end
description: |
  End-to-end regression for the fork-prefix cache inheritance pipeline.
  When the parent spawns a child with `inherit_prefix: {}`, the child
  should inherit the parent's cached prefix and produce a reply.

  NOTE: stderr-based fork-cache event assertions (stderr_matches,
  fork_cache_outcome) are currently disabled because the SSE loop
  (`astra chat`) does not yet wire StderrForkCacheSink into the
  spawn/delegate executor. Those criteria will be restored once the
  sink plumbing lands. See agent_runtime.rs for the wired path.
prompt: |
  You have a `spawn_agent` tool.

  Step 1 — call it ONCE with this structure:
    tool_call: spawn_agent
    args:
      agent_id: "child-G1"
      task: "Reply with exactly: inherited-ok"
      inherit_prefix: {}

  Step 2 — include the child's exact reply in your final answer,
  prefixed with `CHILD:`.

  Do not re-spawn. Do not use other tools.
debug_log: true
timeout_seconds: 240
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: spawn_agent
  - type: tools_count_between
    min: 1
    max: 6
  - type: text_contains
    needle: "CHILD:"
  # TODO: restore when SSE loop wires StderrForkCacheSink:
  #  - type: stderr_matches
  #    pattern: '\[fork-cache\]'
  #  - type: fork_cache_outcome
  #    expect: [hit]
  - type: judger
    question: |
      Did the child agent's reply appear verbatim in the final answer
      (prefixed with "CHILD:")? Score 1.0 if the child replied and the
      text surfaces it. Score 0.4 if spawn succeeded but reply is
      garbled. Score 0.0 if no spawn happened.
    threshold: 0.7
