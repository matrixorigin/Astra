name: fork_prefix_hit_end_to_end
description: |
  **What**: Spawn a child agent with inherit_prefix and verify it inherits the parent's cached prefix and replies.
  **Tests**: Fork-prefix cache inheritance — the capture-resolve-probe pipeline for parent-to-child prefix reuse.
  **Why**: End-to-end regression for the cache inheritance pipeline; a break here means child agents pay full cold-start cost on every spawn.
  **Pass means**: The child agent successfully inherited the parent's prefix, produced a reply, and the parent surfaced it.
  **Fail means**: Prefix capture failed (parent side), prefix resolution failed (child side), or spawn_agent tool dispatch is broken.
prompt: |
  You have a `spawn_agent` tool. Call it ONCE with:
    agent_id: "child-G1"
    task: "Say the exact text: inherited-ok. Do not use any tools, just reply with that text."
    inherit_prefix: {}

  Include the child's exact reply in your final answer, prefixed
  with `CHILD:`.

  Do not re-spawn. Do not use other tools.
debug_log: true
timeout_seconds: 240
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: spawn_agent
  - type: tools_count_between
    min: 1
    max: 6
  - type: text_contains
    needle: "CHILD:"
  - type: judger
    question: |
      Did the child agent's reply appear verbatim in the final answer
      (prefixed with "CHILD:")? Score 1.0 if the child replied and the
      text surfaces it. Score 0.4 if spawn succeeded but reply is
      garbled. Score 0.0 if no spawn happened.
    threshold: 0.7
