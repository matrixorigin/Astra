name: multi_turn_instruction_refinement
description: |
  **What**: Ask for a Rust function signature in turn 1, refine it in turn 2, then store the
  coding convention as a persistent memory in turn 3.
  **Tests**: Multi-turn instruction refinement + memory persistence — the agent builds on prior
  output AND can persist learned conventions to durable memory when instructed.
  **Why**: Iterative code refinement is a core agent workflow. Additionally, conventions that emerge
  during refinement (e.g., "always add doc comments") should be persistable for future sessions.
  **Pass means**: Turn 2 refines correctly, turn 3 calls memory_store to persist the convention.
  **Fail means**: Context lost (turn 1→2), refinement ignored, or memory_store not called (turn 3).
prompt: |
  Write me a short Rust function signature (just the signature, no body)
  called 'greet' that takes a &str parameter called 'name' and prints
  a greeting. Show it in a code block. Don't create any files.
capability: instruction_following
difficulty: 3
weight: 2.0
timeout_seconds: 180
steps:
  - prompt: "Now change it to return a String instead of printing, and add a /// doc comment above it. Show the updated version in a code block. Don't create any files."
    criteria:
      - type: text_contains
        needle: "///"
      - type: text_contains
        needle: "String"
  - prompt: "I always want /// doc comments on every public function in this project. Please remember this convention for our future conversations using memory_store."
    criteria:
      - type: tool_called
        name: memory_store
teardown_cmd: |
  curl -sf -X POST "${MEMORIA_BASE_URL:-http://127.0.0.1:8100}/v1/memories/purge" \
    -H "Authorization: Bearer ${MEMORIA_MASTER_KEY}" \
    -H "Content-Type: application/json" \
    -d '{"topic":"doc comments","reason":"harness teardown"}' 2>/dev/null || true
criteria:
  - type: exit_code
    code: 0
  - type: text_contains
    needle: "greet"
  - type: tokens_between
    min: 1
    max: 90000
  - type: turn_rounds_between
    min: 1
    max: 15
