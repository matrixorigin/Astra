name: fork_prefix_delegate_inherits
description: |
  Regression: the spawn_agent path with inherit_prefix exercises the
  fork-prefix pipeline's capture-resolve-probe cycle. The parent
  captures its prefix on turn_completed, the child resolves it via
  InMemoryPrefixStore, and the probe emits a classifiable event.

  Note: the original case used a `delegate` tool which is only
  available in the server-side DelegationEngine, not in `astra chat`.
  Rewritten to use spawn_agent with inherit_prefix — which is the
  actual CLI-exercisable path for fork-prefix inheritance.
prompt: |
  You have a `spawn_agent` tool.

  Spawn a sub-agent with inherit_prefix enabled:
    tool_call: spawn_agent
    args:
      agent_id: "child-delegate-G2"
      task: "Reply with exactly: delegate-G2-ok"
      inherit_prefix: {}

  Surface the child's exact reply in your final answer.
  Do not use other tools.
debug_log: true
timeout_seconds: 300
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: spawn_agent
  - type: tools_count_between
    min: 1
    max: 6
  - type: judger
    question: |
      Did the child agent reply with "delegate-G2-ok" (or close to it)?
      Score 1.0 if the child's reply appeared in the final answer.
      Score 0.4 if the spawn succeeded but the reply was garbled.
      Score 0.0 if no spawn happened or the agent fabricated a result.
    threshold: 0.7
