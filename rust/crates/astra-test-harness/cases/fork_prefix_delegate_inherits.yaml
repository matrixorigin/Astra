name: fork_prefix_delegate_inherits
description: |
  G2 regression: the delegate path (not spawn_agent) goes through
  the server-side DelegationEngine. Before G2 the engine could
  populate `SubRunConfig.inherited_prefix` but no parent capture
  ever landed in the store because the server loop host had no
  on_turn_completed hook. This case forces the delegate path and
  verifies a [fork-cache] event appears — which can only happen if
  both the capture (G2) and the resolve (pre-G2 plumbing) are wired.
prompt: |
  You have a `delegate` tool available (a specialized sub-agent
  coordinator different from `spawn_agent`).

  Delegate a task to a coder sub-agent asking it to reply with
  exactly "delegate-G2-ok". Wait for the result. Surface the
  coder's reply verbatim in your final answer.

  Do not use spawn_agent — this case specifically exercises the
  delegate path.
debug_log: true
timeout_seconds: 300
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: delegate
  - type: stderr_matches
    pattern: '\[fork-cache\]'
  # G2 correctness: delegate path must produce a classifiable event
  # — hit when inheritance works, or a soft-fallback class if not.
  - type: fork_cache_class
    expect: [hit, partial_drift, validation_failed, fallback]
  - type: judger
    question: |
      Look at the stderr data fence. Does the [fork-cache] event
      reference the delegated child's run (run_id or agent_type
      matching the delegation payload), AND did the final answer
      contain the child's reply? Score 1.0 for both. Score 0.4 for
      either only. Score 0.0 for neither.
    threshold: 0.7
