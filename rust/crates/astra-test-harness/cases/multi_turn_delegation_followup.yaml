name: multi_turn_delegation_followup
description: |
  **What**: Spawn a sub-agent in turn 1, then ask about its result in turn 2 to verify delegation results persist.
  **Tests**: Multi-turn delegation persistence — sub-agent results must survive in session context across turns.
  **Why**: In production multi-agent workflows, a coordinator often delegates in one turn and reasons about results in the next; losing delegation results breaks orchestration.
  **Pass means**: The sub-agent's computed result (391) is correctly recalled in turn 2, proving delegation output persists in session state.
  **Fail means**: Delegation results were dropped between turns (session state bug) or the sub-agent failed to compute correctly.
prompt: |
  Spawn a sub-agent with task "Calculate 17*23 and report the answer".
  Tell me what it says.
capability: delegation
difficulty: 3
weight: 2.0
timeout_seconds: 240
steps:
  - prompt: "What was the numerical result the sub-agent gave you?"
    criteria:
      - type: text_contains
        needle: "391"
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: spawn_agent
  - type: turn_rounds_between
    min: 1
    max: 8
