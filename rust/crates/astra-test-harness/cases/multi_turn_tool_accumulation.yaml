name: multi_turn_tool_accumulation
description: |
  **What**: Read a file in turn 1, append to it in turn 2, then store a project fact about the
  file in memory in turn 3.
  **Tests**: Multi-turn tool accumulation + memory persistence — tool outputs from earlier turns
  inform later actions, and discovered facts can be persisted for future sessions.
  **Why**: Real agent workflows chain tool calls across turns; if tool results are lost, the agent
  operates blind. Additionally, facts discovered during exploration should be persistable.
  **Pass means**: Turn 1 reads successfully, turn 2 appends, turn 3 stores the fact.
  **Fail means**: Tool results dropped, append failed, or memory_store not called.
  **Note**: setup_cmd force-creates the file fresh before each run.
prompt: |
  Read the file /tmp/astra_harness_mt_test.txt and tell me what's in it.
  Include the file contents in your answer.
capability: tool_use
difficulty: 2
weight: 2.0
timeout_seconds: 180
setup_cmd: "printf 'hello world 42\\n' > /tmp/astra_harness_mt_test.txt"
teardown_cmd: |
  rm -f /tmp/astra_harness_mt_test.txt
  curl -sf -X POST "${MEMORIA_BASE_URL:-http://127.0.0.1:8100}/v1/memories/purge" \
    -H "Authorization: Bearer ${MEMORIA_MASTER_KEY}" \
    -H "Content-Type: application/json" \
    -d '{"topic":"astra_harness_mt_test","reason":"harness teardown"}' 2>/dev/null || true
steps:
  - prompt: "Now append the line 'second line' to that same file and confirm it was done."
    criteria:
      - type: tools_count_between
        min: 1
        max: 8
  - prompt: "Please remember that /tmp/astra_harness_mt_test.txt is our scratch file for integration testing. Store this in your memory."
    criteria:
      - type: tool_called
        name: memory_store
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: read_file
  - type: text_contains
    needle: "hello world 42"
  - type: judger
    question: |
      Evaluate based on the tool calls and text output only.
      Do NOT try to read files yourself.
      Turn 1: did the agent read the file and show "hello world 42"?
      Turn 2: did the agent append "second line" using any tool?
      Turn 3: did the agent store a fact about the file using memory_store?
      Score 1.0 if all three turns worked, 0.5 if partial, 0.0 if fabricated.
    threshold: 0.6
