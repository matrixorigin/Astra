/* ================================================================
   Manual Run + Cancel (sidebar)
   ================================================================ */
$('runBtn').addEventListener('click', startManualRun);
$('cancelBtn').addEventListener('click', cancelRun);

function startManualRun() {
  if (S.selectedModels.size === 0) {
    toast('Select at least one model', 'error');
    return;
  }
  if (S.selectedCases.size === 0 && S.allCases.length > 0) {
    toast('Select at least one case', 'error');
    return;
  }

  $('runBtn').disabled = true;
  $('runBtn').textContent = 'Starting...';
  S.cancelled = false;

  const models = [...S.selectedModels];
  const cases = S.selectedCases.size < S.allCases.length && S.selectedCases.size > 0
    ? [...S.selectedCases] : undefined;

  // Add a system message in the conversation
  addMessage('system', 'Manual run: ' + models.length + ' model' + (models.length > 1 ? 's' : '') + ' × ' + (cases ? cases.length : S.allCases.length) + ' cases');

  const body = {
    models,
    parallel: S.parallel,
    no_judger: S.noJudger,
  };
  if (cases) body.cases = cases;

  const jm = $('judgerModelIn').value.trim();
  if (jm && jm !== S.config.judger_model) body.judger_model = jm;

  fetch('/api/run', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  })
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        toast(data.error, 'error');
        resetRunBtn();
      }
    })
    .catch(e => {
      toast('Run request failed: ' + e.message, 'error');
      resetRunBtn();
    });
}

function cancelRun() {
  S.cancelled = true;
  fetch('/api/cancel', { method: 'POST' })
    .then(r => r.json())
    .then(data => {
      if (data.status === 'cancelled') toast('Run cancelled', 'info');
      else if (data.error) toast(data.error, 'error');
    })
    .catch(e => toast('Cancel failed: ' + e.message, 'error'));
}

function resetRunBtn() {
  $('runBtn').disabled = false;
  $('runBtn').textContent = 'Run Manual';
  $('cancelBtn').classList.remove('visible');
}

/* ================================================================
   Chat Input
   ================================================================ */
const inputText = $('inputText');
const inputSend = $('inputSend');

// Mode toggle
document.querySelectorAll('.input-mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    S.chatMode = btn.dataset.mode;
    document.querySelectorAll('.input-mode-btn').forEach(b => b.classList.toggle('active', b === btn));
    inputText.placeholder = S.chatMode === 'run'
      ? 'Describe the test workflow to execute...'
      : 'Ask anything or describe a test to run... (auto-detects intent)';
  });
});

inputSend.addEventListener('click', sendInput);

// Command history (↑/↓ arrows)
const cmdHistory = [];
let cmdHistoryIdx = -1;
let cmdDraft = '';

inputText.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const msg = inputText.value.trim();
    if (msg) {
      cmdHistory.push(msg);
      cmdHistoryIdx = cmdHistory.length;
      // Persist to sessionStorage
      try { sessionStorage.setItem('astra_cmd_history', JSON.stringify(cmdHistory)); } catch {}
    }
    sendInput();
  } else if (e.key === 'ArrowUp') {
    if (cmdHistoryIdx > 0) {
      if (cmdHistoryIdx === cmdHistory.length) cmdDraft = inputText.value;
      cmdHistoryIdx--;
      inputText.value = cmdHistory[cmdHistoryIdx];
      e.preventDefault();
    }
  } else if (e.key === 'ArrowDown') {
    if (cmdHistoryIdx < cmdHistory.length) {
      cmdHistoryIdx++;
      inputText.value = cmdHistoryIdx === cmdHistory.length ? cmdDraft : cmdHistory[cmdHistoryIdx];
      e.preventDefault();
    }
  }
});

// Restore history from sessionStorage
try {
  const saved = JSON.parse(sessionStorage.getItem('astra_cmd_history') || '[]');
  if (Array.isArray(saved)) { cmdHistory.push(...saved); cmdHistoryIdx = cmdHistory.length; }
} catch {}

// Welcome suggestion buttons
document.querySelectorAll('.suggestion-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const msg = btn.dataset.msg;
    if (!msg) return;
    inputText.value = msg;
    // Switch to Run mode for suggestions since they describe test runs
    S.chatMode = 'run';
    document.querySelectorAll('.input-mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === 'run'));
    sendInput();
  });
});

function looksLikeRunIntent(msg) {
  const lower = msg.toLowerCase();
  const runPatterns = [
    /\b(run|execute|test|比较|对比|跑|测试|验证|benchmark)\b/,
    /\b(compare|compare.*model|vs|versus)\b/,
    /\b(all cases|selected cases|delegation cases|tool.use cases)\b/,
    /\b(sonnet.*minimax|minimax.*sonnet|qwen.*claude)\b/,
    /\b(跑一下|跑.*case|测一下|试一下|生成.*工作流|编排)\b/,
  ];
  return runPatterns.some(re => re.test(lower));
}

function sendInput() {
  const msg = inputText.value.trim();
  if (!msg) return;

  inputText.value = '';
  inputSend.disabled = true;

  const model = $('inputModel').value || undefined;
  addMessage('user', msg);
  showTyping();

  // Smart routing: auto-detect intent.
  // 'run' mode: always orchestrate. 'chat' (auto): detect from message.
  if (S.chatMode === 'run' || (S.chatMode === 'chat' && looksLikeRunIntent(msg))) {
    sendOrchestrate(msg, model);
  } else {
    sendChat(msg, model);
  }
}

function sendChat(msg, model) {
  const body = { message: msg };
  if (model) body.model = model;
  if (S.chatSessionId) body.session_id = S.chatSessionId;

  fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  })
    .then(r => r.json())
    .then(data => {
      hideTyping();
      if (data.error) {
        addMessage('system', 'Error: ' + data.error);
      } else {
        const text = data.text || JSON.stringify(data);
        addMessage('assistant', text);
        if (data.session_id) S.chatSessionId = data.session_id;
      }
    })
    .catch(e => { hideTyping(); addMessage('system', 'Request failed: ' + e.message); })
    .finally(() => { inputSend.disabled = false; });
}

function sendOrchestrate(instruction, model) {
  addMessage('assistant', 'Planning your test run...');

  const body = { instruction };
  if (model) body.model = model;

  fetch('/api/orchestrate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  })
    .then(r => r.json())
    .then(data => {
      hideTyping();
      if (data.error) {
        addMessage('system', data.error);
      } else if (data.plan) {
        renderPlanCard(data.plan);
      } else if (data.chat_fallback) {
        // Model gave a text answer instead of a plan — show it as chat
        addMessage('assistant', data.chat_fallback);
      }
    })
    .catch(e => { hideTyping(); addMessage('system', 'Orchestrate failed: ' + e.message); })
    .finally(() => { inputSend.disabled = false; });
}

/* Populate chat model selector */
function updateInputModelSelector() {
  const sel = $('inputModel');
  const current = sel.value;
  sel.innerHTML = '<option value="">auto</option>';
  for (const m of S.allModels) {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = normModel(m);
    sel.appendChild(opt);
  }
  if (current && S.allModels.includes(current)) sel.value = current;
}

/* ================================================================
   Init: Load Config + Cases
   ================================================================ */
function loadModels() {
  fetch('/api/models')
    .then(r => r.json())
    .then(data => {
      S.modelRegistry = data.models || [];
      buildModelList();
      renderModelList();
      renderModelTags();
      updateInputModelSelector();
    })
    .catch(() => {});
}

function loadConfig() {
  const modelsPromise = fetch('/api/models')
    .then(r => r.json())
    .then(data => { S.modelRegistry = data.models || []; })
    .catch(() => { S.modelRegistry = []; });

  const configPromise = fetch('/api/config')
    .then(r => r.json())
    .then(data => {
      S.config = data;
      S.judgerModel = data.judger_model || '';
      $('judgerModelIn').value = S.judgerModel;
    })
    .catch(e => toast('Failed to load config: ' + e.message));

  Promise.all([modelsPromise, configPromise]).then(() => {
    buildModelList();
    (S.config.available_models || []).forEach(m => S.selectedModels.add(m));
    renderModelList();
    renderModelTags();
    updateModelOverrideNote();
    updateInputModelSelector();
  });

  fetch('/api/cases')
    .then(r => r.json())
    .then(data => {
      S.allCases = data.cases || [];
      S.allCases.forEach(c => S.selectedCases.add(c.name));
      renderCapPills();
      renderCaseList();
    })
    .catch(e => toast('Failed to load cases: ' + e.message));
}

/* ================================================================
   WebSocket
   ================================================================ */
function connect() {
  if (S.reconnectTimer) { clearTimeout(S.reconnectTimer); S.reconnectTimer = null; }

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(proto + '//' + location.host + '/ws');
  S.ws = ws;

  ws.onopen = () => {
    S.connected = true;
    $('connDot').className = 'conn-dot connected';
    loadConfig();
  };
  ws.onclose = () => {
    S.connected = false;
    $('connDot').className = 'conn-dot disconnected';
    S.reconnectTimer = setTimeout(connect, 2000);
  };
  ws.onerror = () => {
    S.connected = false;
    $('connDot').className = 'conn-dot disconnected';
  };
  ws.onmessage = e => {
    let ev;
    try { ev = JSON.parse(e.data); } catch { return; }
    console.log('[ws]', ev.type, ev.type === 'case_completed' ? ev.report?.case_name : '');
    handleEvent(ev);
  };
}

function handleEvent(ev) {
  switch (ev.type) {

    case 'run_reset': {
      clearTimelineRail();
      // Remove old timeline card and report card from DOM
      const oldTimeline = document.getElementById('timelineRow');
      if (oldTimeline) oldTimeline.remove();
      const oldReport = document.getElementById('reportRow');
      if (oldReport) oldReport.remove();
      S.runs = [];
      S.completed = 0;
      S.passed = 0;
      S.failed = 0;
      S.runningSet.clear();
      S.suiteReport = null;
      S.total = 0;
      S.startTime = null;
      S.cancelled = false;
      S.running = false;
      S.timelineCardEl = null;
      break;
    }

    case 'suite_started': {
      S.total = ev.total_cases || 0;
      S.completed = 0;
      S.passed = 0;
      S.failed = 0;
      S.runs = [];
      S.runningSet.clear();
      S.startTime = Date.now();
      S.suiteReport = null;
      S.cancelled = false;
      S.running = true;

      $('runBtn').disabled = true;
      $('runBtn').textContent = 'Running...';
      $('cancelBtn').classList.add('visible');

      // Create timeline card in conversation and show rail
      showTimelineRail();
      addRailDot('plan', 'Run started', null);
      createTimelineCard();
      break;
    }

    case 'case_started': {
      const key = ev.case_name + '/' + ev.model + '/' + (ev.run_index || 0);
      S.runningSet.set(key, { case_name: ev.case_name, model: ev.model });
      addTimelineRunningRow(ev.case_name, ev.model, ev.run_index);
      updateTimelineCard();
      break;
    }

    case 'case_completed': {
      const r = ev.report;
      S.completed++;
      S.runs.push(r);
      if (r.passed) S.passed++; else S.failed++;
      const key = r.case_name + '/' + r.model + '/' + (r.run_index || 0);
      S.runningSet.delete(key);

      addTimelineRow(r);
      updateTimelineCard();
      // Add dot to the rail
      const rowEl = document.getElementById('tlr_' + r.case_name + '_' + r.model + '_' + (r.run_index || 0));
      const shortName = r.case_name.replace(/_/g, ' ');
      addRailDot(r.passed ? 'pass' : 'fail', shortName + ' × ' + normModel(r.model), rowEl);
      break;
    }

    case 'suite_completed': {
      S.suiteReport = ev.report || {};
      S.runningSet.clear();
      S.running = false;

      setTimeout(() => {
        finalizeTimeline();
        addReportCard();
        resetRunBtn();
        addRailDot('report', 'Report — ' + S.passed + '/' + S.completed + ' passed', null);
      }, 300);
      break;
    }

    case 'lagged': {
      toast('Missed ' + (ev.missed || '?') + ' events (stream lag)', 'error');
      break;
    }
  }
}

/* ================================================================
   Boot
   ================================================================ */
connect();
</script>
</body>
