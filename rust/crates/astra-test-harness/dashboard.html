<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>astra-test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ================================================================
   Reset & Custom Properties
   ================================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #06080f;
  --bg-raised: #0b0f1a;
  --bg-surface: rgba(15, 23, 42, 0.7);
  --bg-surface-hover: rgba(20, 30, 55, 0.85);
  --bg-inset: rgba(0, 0, 0, 0.3);
  --border: rgba(100, 150, 255, 0.08);
  --border-focus: rgba(100, 150, 255, 0.25);
  --border-subtle: rgba(255, 255, 255, 0.04);
  --accent: #3b82f6;
  --accent2: #8b5cf6;
  --green: #22c55e;
  --green-dim: rgba(34, 197, 94, 0.12);
  --red: #ef4444;
  --red-dim: rgba(239, 68, 68, 0.12);
  --yellow: #eab308;
  --yellow-dim: rgba(234, 179, 8, 0.12);
  --blue-dim: rgba(59, 130, 246, 0.10);
  --text: #e2e8f0;
  --text-secondary: #94a3b8;
  --muted: #64748b;
  --dim: #475569;
  --font: 'Inter', system-ui, -apple-system, sans-serif;
  --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, monospace;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --gradient: linear-gradient(135deg, var(--accent), var(--accent2));
  --sidebar-w: 320px;
  --topbar-h: 48px;
}

html { font-variant-numeric: tabular-nums; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  overflow: hidden;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ================================================================
   Animated Background
   ================================================================ */
.bg-canvas {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none; overflow: hidden;
}
.bg-orb {
  position: absolute; border-radius: 50%;
  filter: blur(140px); will-change: transform;
}
.bg-orb-1 {
  width: 700px; height: 700px; background: var(--accent);
  opacity: 0.05; top: -250px; left: -150px;
  animation: orbDrift1 28s ease-in-out infinite alternate;
}
.bg-orb-2 {
  width: 600px; height: 600px; background: var(--accent2);
  opacity: 0.04; bottom: -250px; right: -150px;
  animation: orbDrift2 24s ease-in-out infinite alternate;
}
.bg-orb-3 {
  width: 450px; height: 450px;
  background: linear-gradient(135deg, #06b6d4, #8b5cf6);
  opacity: 0.035; top: 40%; left: 45%;
  animation: orbDrift3 20s ease-in-out infinite;
}
@keyframes orbDrift1 {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(80px, 40px) scale(1.1); }
  100% { transform: translate(-40px, 80px) scale(0.95); }
}
@keyframes orbDrift2 {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(-60px, -50px) scale(1.08); }
  100% { transform: translate(50px, -40px) scale(0.96); }
}
@keyframes orbDrift3 {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.035; }
  50%      { transform: translate(-50%, -50%) scale(1.2); opacity: 0.055; }
}

/* ================================================================
   Layout: TopBar + Main (conversation) + Sidebar
   ================================================================ */
.app-layout {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  height: 100vh;
}

/* ---- Top Bar ---- */
.topbar {
  height: var(--topbar-h);
  flex-shrink: 0;
  display: flex; align-items: center;
  padding: 0 20px;
  background: rgba(11, 15, 26, 0.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  z-index: 30;
}
.topbar-logo {
  display: flex; align-items: center; gap: 9px;
}
.topbar-logo .logo-icon {
  width: 26px; height: 26px;
  background: var(--gradient);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 900; color: #fff;
}
.topbar-logo .logo-text {
  font-size: 16px; font-weight: 800;
  letter-spacing: -0.5px;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.topbar-right {
  margin-left: auto;
  display: flex; align-items: center; gap: 12px;
}
.conn-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}
.conn-dot.connected { background: var(--green); box-shadow: 0 0 6px var(--green); }
.conn-dot.connecting { background: var(--yellow); animation: pulse 1.5s infinite; }
.conn-dot.disconnected { background: var(--red); }

.topbar-btn {
  padding: 5px 12px;
  border-radius: var(--radius-xs);
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: var(--font);
  transition: all 0.15s;
  display: flex; align-items: center; gap: 5px;
}
.topbar-btn:hover { background: var(--blue-dim); color: var(--accent); border-color: rgba(59,130,246,0.3); }
.topbar-btn.active { background: var(--blue-dim); color: var(--accent); border-color: rgba(59,130,246,0.25); }
.topbar-btn svg { width: 14px; height: 14px; }

/* ---- Content area: conversation + sidebar ---- */
.content-area {
  flex: 1;
  display: flex;
  min-height: 0;
}

/* ================================================================
   Conversation (Main)
   ================================================================ */
.conversation {
  flex: 1;
  display: flex; flex-direction: column;
  min-width: 0;
  position: relative;
}

.messages-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 24px 0;
}
.messages-container {
  max-width: 860px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  gap: 0;
}

/* ---- Timeline Rail (left side) ---- */
.timeline-rail {
  width: 40px;
  flex-shrink: 0;
  position: relative;
  display: none; /* shown when a run starts */
}
.timeline-rail.visible { display: block; }
.timeline-rail::before {
  content: '';
  position: absolute;
  left: 18px;
  top: 0; bottom: 0;
  width: 2px;
  background: linear-gradient(180deg, var(--accent) 0%, var(--accent2) 50%, var(--dim) 100%);
  opacity: 0.3;
}
.tl-dot {
  position: absolute;
  left: 12px;
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid var(--bg);
  z-index: 2;
  cursor: pointer;
  transition: all 0.3s var(--spring);
  animation: dotAppear 0.4s var(--spring) both;
}
.tl-dot:hover { transform: scale(1.4); }
.tl-dot.pass { background: var(--green); box-shadow: 0 0 8px rgba(34,197,94,0.4); }
.tl-dot.fail { background: var(--red); box-shadow: 0 0 8px rgba(239,68,68,0.4); }
.tl-dot.running { background: var(--accent); box-shadow: 0 0 8px rgba(59,130,246,0.4); animation: dotAppear 0.4s var(--spring) both, pulse 1.5s infinite; }
.tl-dot.plan { background: var(--accent2); box-shadow: 0 0 8px rgba(139,92,246,0.4); }
.tl-dot.report { background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 0 10px rgba(59,130,246,0.4); width: 18px; height: 18px; left: 10px; }
.tl-dot .tl-dot-tooltip {
  position: absolute; left: 22px; top: 50%; transform: translateY(-50%);
  background: var(--bg-raised); border: 1px solid var(--border-focus);
  padding: 4px 8px; border-radius: 4px;
  font-size: 11px; color: var(--text-secondary);
  white-space: nowrap; pointer-events: none;
  opacity: 0; transition: opacity 0.15s;
}
.tl-dot:hover .tl-dot-tooltip { opacity: 1; }
@keyframes dotAppear {
  from { transform: scale(0); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* ---- Messages column ---- */
.messages-inner {
  flex: 1;
  min-width: 0;
  display: flex; flex-direction: column;
  gap: 6px;
}

/* ---- Welcome State ---- */
.welcome {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 60vh; text-align: center;
  padding: 40px 20px;
  animation: fadeIn 0.5s ease both;
}
.welcome .w-emoji {
  font-size: 48px; margin-bottom: 16px;
  filter: grayscale(0.3);
}
.welcome .w-title {
  font-size: 28px; font-weight: 800;
  letter-spacing: -0.8px;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.welcome .w-subtitle {
  font-size: 15px; color: var(--muted);
  max-width: 440px; line-height: 1.65;
  margin-bottom: 36px;
}
.welcome-suggestions {
  display: flex; flex-direction: column; gap: 8px;
  width: 100%; max-width: 480px;
}
.suggestion-btn {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-secondary);
  font-size: 14px;
  font-family: var(--font);
  cursor: pointer;
  text-align: left;
  transition: all 0.2s var(--ease);
  backdrop-filter: blur(8px);
  line-height: 1.4;
}
.suggestion-btn:hover {
  background: var(--bg-surface-hover);
  border-color: var(--border-focus);
  color: var(--text);
  transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
.suggestion-btn .sug-icon {
  font-size: 18px; flex-shrink: 0; opacity: 0.7;
  width: 24px; text-align: center;
}
.welcome-footer {
  margin-top: 28px;
  font-size: 12px; color: var(--dim);
}

/* ---- Messages ---- */
.msg-row {
  display: flex;
  animation: msgSlideUp 0.25s var(--ease) both;
}
.msg-row.user { justify-content: flex-end; }
.msg-row.assistant { justify-content: flex-start; }
.msg-row.system { justify-content: center; }

@keyframes msgSlideUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg-bubble {
  max-width: 680px;
  border-radius: var(--radius);
  font-size: 14px;
  line-height: 1.65;
  position: relative;
}
.msg-row.user .msg-bubble {
  padding: 10px 16px;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.msg-row.assistant .msg-bubble {
  padding: 14px 18px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  border-bottom-left-radius: 4px;
  backdrop-filter: blur(12px);
}
.msg-row.system .msg-bubble {
  padding: 6px 14px;
  background: rgba(139, 92, 246, 0.08);
  border: 1px solid rgba(139, 92, 246, 0.12);
  color: var(--muted);
  font-size: 12px;
  border-radius: 20px;
}

/* Markdown in assistant */
.msg-bubble h3 { font-size: 15px; font-weight: 700; color: var(--text); margin: 10px 0 4px; }
.msg-bubble h4 { font-size: 14px; font-weight: 600; color: var(--text); margin: 8px 0 3px; }
.msg-bubble strong { color: var(--text); font-weight: 600; }
.msg-bubble code {
  font-family: var(--mono); font-size: 12.5px;
  background: rgba(0,0,0,0.35); padding: 2px 6px;
  border-radius: 4px; color: #e0b0ff;
}
.msg-bubble pre {
  background: #0d1117;
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  padding: 12px 14px; margin: 8px 0;
  overflow-x: auto;
}
.msg-bubble pre code {
  background: none; padding: 0;
  font-size: 12px; color: var(--text-secondary);
  white-space: pre;
}
.msg-bubble ul, .msg-bubble ol { margin: 6px 0; padding-left: 20px; }
.msg-bubble li { margin: 3px 0; }
.msg-bubble p { margin: 4px 0; }
.msg-bubble p:first-child { margin-top: 0; }
.msg-bubble p:last-child { margin-bottom: 0; }

/* ---- Plan Card ---- */
.plan-card {
  background: linear-gradient(135deg, rgba(59,130,246,0.06), rgba(139,92,246,0.06));
  border: 1px solid rgba(100, 150, 255, 0.12);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin: 4px 0;
  backdrop-filter: blur(12px);
}
.plan-card-header {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 700; color: var(--accent);
  margin-bottom: 14px;
  text-transform: uppercase; letter-spacing: 0.6px;
}
.plan-card-header svg { width: 16px; height: 16px; }
.plan-row {
  display: flex; gap: 8px; margin-bottom: 8px;
  font-size: 13px; line-height: 1.5;
}
.plan-label {
  color: var(--muted); min-width: 72px; flex-shrink: 0; font-weight: 600;
}
.plan-value { color: var(--text-secondary); }
.plan-value .plan-case-tag {
  display: inline-block;
  padding: 1px 7px; margin: 1px 3px 1px 0;
  border-radius: 4px;
  font-size: 11px;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  color: var(--text-secondary);
}
.plan-explanation {
  font-size: 12px; color: var(--muted);
  margin-top: 8px; padding-top: 10px;
  border-top: 1px solid var(--border-subtle);
  font-style: italic; line-height: 1.5;
}
.plan-actions {
  display: flex; gap: 8px; margin-top: 14px;
}
.plan-execute-btn {
  padding: 9px 20px;
  background: var(--gradient);
  border: none; border-radius: var(--radius-xs);
  color: #fff; font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: var(--font);
  transition: all 0.2s var(--spring);
  display: flex; align-items: center; gap: 6px;
}
.plan-execute-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(59,130,246,0.3); }
.plan-execute-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
.plan-edit-btn {
  padding: 9px 16px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  color: var(--text-secondary); font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: var(--font);
  transition: all 0.15s;
}
.plan-edit-btn:hover { background: rgba(255,255,255,0.04); border-color: var(--border-focus); }

/* ---- Timeline Card (in conversation) ---- */
.timeline-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin: 4px 0;
  backdrop-filter: blur(12px);
}
.tl-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.tl-header-left {
  display: flex; align-items: center; gap: 8px;
}
.tl-status-icon {
  font-size: 16px;
}
.tl-title {
  font-size: 14px; font-weight: 700;
}
.tl-counter {
  font-size: 12px; color: var(--muted); font-weight: 500;
}
.tl-progress-bar {
  height: 4px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 14px;
}
.tl-progress-fill {
  height: 100%;
  background: var(--gradient);
  border-radius: 2px;
  transition: width 0.4s var(--ease);
  position: relative;
}
.tl-progress-fill::after {
  content: '';
  position: absolute; right: 0; top: -1px; bottom: -1px;
  width: 12px;
  background: rgba(255,255,255,0.3);
  border-radius: 2px;
  filter: blur(4px);
}
.tl-rows {
  display: flex; flex-direction: column; gap: 3px;
  max-height: 360px;
  overflow-y: auto;
}
.tl-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  border-radius: var(--radius-xs);
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s;
}
.tl-row:hover { background: rgba(255,255,255,0.03); }
.tl-row-icon {
  width: 18px; text-align: center; flex-shrink: 0; font-size: 13px;
}
.tl-row-name {
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--text-secondary); font-weight: 500;
}
.tl-row-model {
  font-size: 11px; color: var(--dim); font-family: var(--mono);
  flex-shrink: 0;
}
.tl-row-metrics {
  display: flex; gap: 10px; flex-shrink: 0;
  font-size: 11px; color: var(--muted);
}
.tl-row.pass .tl-row-icon { color: var(--green); }
.tl-row.fail .tl-row-icon { color: var(--red); }
.tl-row.running .tl-row-icon { color: var(--accent); }
.tl-row.queued .tl-row-icon { color: var(--dim); }

.tl-cancel-btn {
  display: flex; align-items: center; gap: 6px;
  margin-top: 12px;
  padding: 7px 14px;
  border: 1px solid rgba(239,68,68,0.25);
  border-radius: var(--radius-xs);
  background: var(--red-dim);
  color: var(--red); font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: var(--font);
  transition: all 0.15s;
}
.tl-cancel-btn:hover { background: rgba(239,68,68,0.18); border-color: rgba(239,68,68,0.4); }

/* ---- Case detail (inline expand) ---- */
.case-detail-expand {
  display: none;
  padding: 14px 16px;
  margin-top: 4px;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  animation: expandIn 0.2s var(--ease) both;
}
.case-detail-expand.open { display: block; }
@keyframes expandIn {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.cd-stats {
  display: flex; gap: 16px; flex-wrap: wrap;
  margin-bottom: 12px;
}
.cd-stat {
  text-align: center;
}
.cd-stat .cd-val { font-size: 15px; font-weight: 700; }
.cd-stat .cd-lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

.cd-section { margin-bottom: 10px; }
.cd-label {
  font-size: 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 5px; font-weight: 700;
}
.criteria-list { display: flex; flex-direction: column; gap: 4px; }
.crit-row { display: flex; align-items: flex-start; gap: 7px; padding: 2px 0; }
.crit-icon { flex-shrink: 0; font-size: 12px; margin-top: 2px; }
.crit-icon.pass { color: var(--green); }
.crit-icon.fail { color: var(--red); }
.crit-text { color: var(--text-secondary); font-size: 12px; line-height: 1.4; }

.score-bar-wrap { margin-top: 4px; }
.score-bar-lbl { font-size: 10px; color: var(--muted); margin-bottom: 2px; }
.score-bar-outer {
  height: 5px; background: rgba(0,0,0,0.3);
  border-radius: 3px; overflow: hidden;
}
.score-bar-fill {
  height: 100%; border-radius: 3px;
  transition: width 0.4s ease;
}

.copyable-row {
  display: flex; align-items: center; gap: 6px; margin-top: 4px;
}
.copyable-text {
  font-family: var(--mono); font-size: 11px;
  background: var(--bg-inset); padding: 5px 10px;
  border-radius: var(--radius-xs);
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}
.copy-btn {
  padding: 5px 10px; border-radius: var(--radius-xs);
  background: var(--blue-dim);
  border: 1px solid rgba(59,130,246,0.15);
  color: var(--accent); font-size: 10px; font-weight: 600;
  cursor: pointer; font-family: var(--font);
  transition: all 0.15s; white-space: nowrap;
}
.copy-btn:hover { background: rgba(59,130,246,0.2); }

.cd-code-block {
  position: relative;
  background: #0d1117;
  padding: 10px 14px; border-radius: var(--radius-xs);
  overflow-x: auto; font-family: var(--mono); font-size: 11px;
  white-space: pre-wrap; word-break: break-all;
  color: var(--text-secondary);
  max-height: 200px; overflow-y: auto;
  margin-top: 4px;
  border: 1px solid var(--border);
}
.cd-code-block .code-copy {
  position: absolute; top: 6px; right: 6px;
  padding: 3px 8px; border-radius: 4px;
  background: var(--bg-inset); border: 1px solid var(--border);
  color: var(--muted); font-size: 10px; cursor: pointer;
  font-family: var(--font); transition: all 0.15s;
  opacity: 0;
}
.cd-code-block:hover .code-copy { opacity: 1; }
.cd-code-block .code-copy:hover { color: var(--text); border-color: var(--border-focus); }

/* Step cards inside case detail */
.step-card {
  background: rgba(0,0,0,0.15);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  padding: 10px 12px; margin-top: 6px;
}
.step-hdr {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 3px;
}
.step-idx { font-size: 11px; font-weight: 700; color: var(--text-secondary); }
.step-dur { font-size: 10px; color: var(--muted); }
.step-prompt { font-size: 11px; color: var(--muted); font-style: italic; margin-bottom: 3px; }
.step-outcome-text { font-size: 11px; color: var(--text-secondary); margin-bottom: 3px; }

/* Collapse toggle */
.collapse-toggle {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; color: var(--text-secondary);
  cursor: pointer; user-select: none;
  border: none; background: none;
  padding: 3px 0; font-family: var(--font);
  transition: color 0.15s;
}
.collapse-toggle:hover { color: var(--text); }
.collapse-toggle .caret {
  font-size: 8px; transition: transform 0.15s; display: inline-block;
}
.collapse-toggle .caret.open { transform: rotate(90deg); }
.collapse-body { display: none; margin-top: 4px; }
.collapse-body.open { display: block; }

/* ---- Report Card ---- */
.report-card {
  background: linear-gradient(135deg, rgba(59,130,246,0.06), rgba(139,92,246,0.06));
  border: 1px solid rgba(139,92,246,0.15);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin: 4px 0;
  backdrop-filter: blur(12px);
}
.report-analysis {
  margin-top: 16px; padding-top: 16px;
  border-top: 1px solid var(--border);
}
.analysis-loading {
  color: var(--muted); font-size: 13px;
  animation: pulse 1.5s infinite;
}
.analysis-error {
  color: var(--red); font-size: 13px; opacity: 0.8;
}
.analysis-content {
  font-size: 13px; line-height: 1.7; color: var(--text-secondary);
}
.analysis-content h3 {
  font-size: 14px; font-weight: 700; color: var(--text);
  margin: 16px 0 8px; padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.analysis-content h4 {
  font-size: 13px; font-weight: 600; color: var(--text);
  margin: 12px 0 6px;
}
.analysis-content ul { padding-left: 20px; margin: 6px 0; }
.analysis-content li { margin: 4px 0; }
.analysis-content code {
  background: var(--bg-inset); padding: 1px 5px;
  border-radius: 3px; font-family: var(--mono); font-size: 12px;
}
.analysis-content pre {
  background: var(--bg-inset); padding: 10px 14px;
  border-radius: var(--radius-xs); overflow-x: auto;
  font-family: var(--mono); font-size: 12px;
  margin: 8px 0;
}
.analysis-content strong { color: var(--text); }
.report-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px;
}
.report-header-left {
  display: flex; align-items: center; gap: 8px;
}
.report-title {
  font-size: 15px; font-weight: 700;
}
.report-rate {
  font-size: 28px; font-weight: 900;
  line-height: 1;
}
.report-summary-row {
  display: flex; gap: 24px; flex-wrap: wrap;
  margin-bottom: 18px;
}
.report-stat { text-align: center; }
.report-stat .rs-val { font-size: 22px; font-weight: 800; line-height: 1; }
.report-stat .rs-lbl {
  font-size: 9px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.8px; margin-top: 3px;
}

.report-table {
  width: 100%;
  border-collapse: separate; border-spacing: 0;
  background: rgba(0,0,0,0.15);
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--border);
  font-size: 13px;
}
.report-table th {
  padding: 8px 12px; text-align: left;
  font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.8px; color: var(--muted);
  background: rgba(0,0,0,0.2); font-weight: 700;
}
.report-table td {
  padding: 8px 12px;
  border-top: 1px solid var(--border-subtle);
}
.rate-pill {
  display: inline-block; padding: 2px 8px;
  border-radius: 4px; font-weight: 700;
  font-size: 12px; color: #fff;
}

.report-failures { margin-top: 14px; }
.report-fail-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 0;
  font-size: 13px;
  cursor: pointer;
  transition: color 0.15s;
}
.report-fail-row:hover { color: var(--text); }
.report-fail-row .rf-icon { color: var(--red); font-size: 12px; }
.report-fail-row .rf-case { font-weight: 500; color: var(--text-secondary); }
.report-fail-row .rf-model { font-size: 11px; color: var(--dim); font-family: var(--mono); }
.report-fail-row .rf-class { font-size: 11px; color: var(--red); opacity: 0.8; margin-left: auto; }

/* ---- Typing Indicator ---- */
.typing-indicator {
  display: none;
  padding: 14px 18px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  border-bottom-left-radius: 4px;
  backdrop-filter: blur(12px);
  max-width: 80px;
}
.typing-indicator.visible { display: flex; }
.typing-dots { display: flex; gap: 4px; align-items: center; }
.typing-dots span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--muted);
  animation: typingBounce 1.4s ease-in-out infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.16s; }
.typing-dots span:nth-child(3) { animation-delay: 0.32s; }
@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-4px); opacity: 1; }
}

/* ---- Input Bar ---- */
.input-bar {
  flex-shrink: 0;
  padding: 12px 24px 16px;
  max-width: 828px;
  width: 100%;
  margin: 0 auto;
}
.input-bar-inner {
  display: flex; align-items: flex-end; gap: 8px;
  padding: 8px 8px 8px 16px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  backdrop-filter: blur(12px);
  transition: border-color 0.2s;
}
.input-bar-inner:focus-within {
  border-color: rgba(59,130,246,0.3);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.06);
}
.input-model-select {
  padding: 6px 8px;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  color: var(--text-secondary);
  font-size: 11px; font-family: var(--font);
  outline: none; cursor: pointer;
  flex-shrink: 0;
  max-width: 130px;
}
.input-model-select option { background: var(--bg-raised); }
.input-text {
  flex: 1; min-width: 0;
  padding: 8px 4px;
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 14px; font-family: var(--font);
  outline: none;
  resize: none;
  line-height: 1.5;
  max-height: 120px;
}
.input-text::placeholder { color: var(--dim); }
.input-mode-toggle {
  display: flex; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--border); flex-shrink: 0;
}
.input-mode-btn {
  padding: 6px 11px; font-size: 11px; font-weight: 600;
  background: transparent; color: var(--muted); border: none;
  cursor: pointer; font-family: var(--font); transition: all 0.15s;
}
.input-mode-btn.active { background: var(--accent); color: #fff; }
.input-mode-btn:not(.active):hover { color: var(--text-secondary); }
.input-send-btn {
  padding: 8px 14px;
  background: var(--gradient);
  border: none; border-radius: 10px;
  color: #fff; font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: var(--font);
  transition: all 0.2s;
  display: flex; align-items: center; gap: 5px;
  flex-shrink: 0;
}
.input-send-btn:hover { box-shadow: 0 2px 16px rgba(59,130,246,0.3); }
.input-send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.input-send-btn svg { width: 14px; height: 14px; }

/* ================================================================
   Sidebar (RIGHT side, collapsible)
   ================================================================ */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--bg-raised);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  height: 100%;
  overflow: hidden;
  transform: translateX(0);
  transition: width 0.3s var(--ease), opacity 0.3s;
}
body.sidebar-closed .sidebar {
  width: 0;
  opacity: 0;
  pointer-events: none;
  border-left: none;
}
.sidebar-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 18px 16px 14px;
}
.sidebar-bottom {
  padding: 10px 16px 14px;
  border-top: 1px solid var(--border);
  background: var(--bg-raised);
  display: flex; flex-direction: column;
  gap: 6px;
}

/* Sidebar sections */
.sb-section { margin-bottom: 14px; }
.sb-section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 7px;
}
.sb-section-title {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: 1.5px; color: var(--muted);
  font-weight: 700;
  display: flex; align-items: center; gap: 5px;
}
.sb-section-actions { display: flex; gap: 3px; }
.sb-section-actions button {
  font-size: 10px; color: var(--accent);
  background: none; border: none; cursor: pointer;
  font-family: var(--font); padding: 2px 5px;
  border-radius: 3px; transition: background 0.15s;
}
.sb-section-actions button:hover { background: var(--blue-dim); }

.sb-divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
  margin: 12px 0;
}

/* Checkbox list */
.sb-check-list {
  display: flex; flex-direction: column; gap: 1px;
  max-height: 180px; overflow-y: auto; overflow-x: hidden;
}
.sb-check-item {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px;
  border-radius: var(--radius-xs);
  cursor: pointer;
  transition: background 0.15s;
  font-size: 12px;
  user-select: none;
  color: var(--text-secondary);
}
.sb-check-item:hover { background: rgba(255,255,255,0.04); }
.sb-check-item.checked { color: var(--text); }
.sb-check-item .ck {
  width: 15px; height: 15px;
  border-radius: 4px;
  border: 1.5px solid var(--dim);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s var(--spring);
  font-size: 9px; color: #fff;
}
.sb-check-item.checked .ck {
  background: var(--accent); border-color: var(--accent);
  box-shadow: 0 0 6px rgba(59,130,246,0.2);
}
.sb-check-item .ck svg {
  width: 10px; height: 10px;
  opacity: 0; transition: opacity 0.15s;
}
.sb-check-item.checked .ck svg { opacity: 1; }
.sb-check-item .item-label {
  flex: 1; min-width: 0;
  word-break: break-all; line-height: 1.3;
  font-size: 12px;
}
.sb-check-item .item-label .short-name { font-weight: 500; }
.sb-check-item .item-meta {
  display: flex; gap: 4px; align-items: center; flex-shrink: 0;
}

/* Provider group label */
.model-provider-label {
  font-size: 9px; text-transform: uppercase;
  letter-spacing: 1px; color: var(--dim);
  font-weight: 700; padding: 6px 8px 2px;
}

/* Selected model tags */
.selected-tags {
  display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px;
}
.sel-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 7px;
  border-radius: 10px; font-size: 10px; font-weight: 500;
  background: var(--blue-dim);
  border: 1px solid rgba(59,130,246,0.2);
  color: var(--accent);
  animation: tagIn 0.2s var(--spring) both;
}
.sel-tag .tag-x {
  cursor: pointer; opacity: 0.5;
  font-size: 12px; line-height: 1;
  transition: opacity 0.15s;
}
.sel-tag .tag-x:hover { opacity: 1; }
@keyframes tagIn { from { opacity: 0; transform: scale(0.85); } }

.model-override-note {
  display: none;
  margin-top: 5px; padding: 4px 8px;
  border-radius: var(--radius-xs);
  background: rgba(234,179,8,0.07);
  border: 1px solid rgba(234,179,8,0.12);
  font-size: 10px; color: var(--yellow); line-height: 1.4;
}
.model-override-note.visible { display: block; }

/* Custom model input */
.custom-model-row {
  display: flex; gap: 5px; margin-top: 6px;
}
.custom-model-row input {
  flex: 1; min-width: 0;
  padding: 5px 8px;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  color: var(--text);
  font-size: 11px; font-family: var(--mono);
  outline: none; transition: border-color 0.15s;
}
.custom-model-row input:focus { border-color: var(--accent); }
.custom-model-row input::placeholder { color: var(--dim); }
.custom-model-row button {
  padding: 5px 10px;
  background: var(--blue-dim);
  border: 1px solid rgba(59,130,246,0.2);
  border-radius: var(--radius-xs);
  color: var(--accent);
  font-size: 10px; font-weight: 600;
  cursor: pointer; font-family: var(--font);
  transition: all 0.15s;
  white-space: nowrap;
}
.custom-model-row button:hover { background: rgba(59,130,246,0.2); }

/* Search + filter pills */
.sb-search {
  width: 100%; padding: 5px 8px;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  color: var(--text);
  font-size: 11px; font-family: var(--font);
  outline: none; transition: border-color 0.15s;
  margin-bottom: 5px;
}
.sb-search:focus { border-color: var(--accent); }
.sb-search::placeholder { color: var(--dim); }
.cap-pills {
  display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 5px;
}
.cap-pill {
  padding: 2px 7px; border-radius: 10px;
  font-size: 10px; font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  transition: all 0.15s;
  font-family: var(--font);
}
.cap-pill:hover { border-color: var(--border-focus); color: var(--text-secondary); }
.cap-pill.active {
  background: var(--blue-dim);
  border-color: var(--accent); color: var(--accent);
}

/* Case meta badges */
.case-cap-badge {
  padding: 1px 5px; border-radius: 3px;
  font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.3px;
}
.case-cap-badge.reasoning { background: rgba(139,92,246,0.15); color: #a78bfa; }
.case-cap-badge.tool_use { background: rgba(59,130,246,0.15); color: #60a5fa; }
.case-cap-badge.delegation { background: rgba(6,182,212,0.15); color: #22d3ee; }
.case-cap-badge.coding { background: rgba(34,197,94,0.15); color: #4ade80; }
.case-cap-badge.default { background: rgba(148,163,184,0.12); color: #94a3b8; }
.case-diff-dots { display: flex; gap: 2px; align-items: center; }
.case-diff-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--dim);
}
.case-diff-dot.filled { background: var(--yellow); }

/* Settings */
.sb-settings-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 4px 12px;
}
.sb-setting {
  display: flex; align-items: center; justify-content: space-between;
  padding: 5px 0;
}
.sb-setting label { font-size: 12px; color: var(--text-secondary); }
.sb-setting .setting-val { display: flex; align-items: center; gap: 6px; }
.sb-setting .val-num { font-size: 13px; font-weight: 700; min-width: 16px; text-align: center; }

/* Range slider */
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 90px; height: 3px;
  background: var(--border); border-radius: 2px; outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); cursor: pointer;
  transition: transform 0.2s var(--spring);
}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); cursor: pointer; border: none;
}

/* Toggle */
.toggle {
  width: 34px; height: 18px; border-radius: 9px;
  position: relative; cursor: pointer;
  border: 1px solid var(--border);
  background: var(--bg-inset);
  transition: all 0.2s; flex-shrink: 0;
}
.toggle.on { background: rgba(59,130,246,0.25); border-color: var(--accent); }
.toggle::after {
  content: ''; position: absolute;
  top: 2px; left: 2px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--dim); transition: all 0.2s var(--spring);
}
.toggle.on::after { left: 17px; background: var(--accent); }

/* Run button */
.run-btn {
  width: 100%; padding: 11px;
  border: none; border-radius: var(--radius-sm);
  background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #6366f1 100%);
  background-size: 200% 200%;
  color: #fff; font-size: 13px; font-weight: 700;
  font-family: var(--font); cursor: pointer;
  transition: all 0.25s var(--spring);
  position: relative; overflow: hidden;
  letter-spacing: 0.5px; text-transform: uppercase;
}
.run-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.1) 50%, transparent 70%);
  background-size: 200% 200%;
  animation: shimmer 3s ease-in-out infinite;
}
.run-btn:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(59,130,246,0.3);
}
.run-btn:disabled { opacity: 0.4; cursor: not-allowed; }
@keyframes shimmer {
  0% { background-position: 200% 200%; }
  100% { background-position: -200% -200%; }
}
.cancel-btn {
  width: 100%; padding: 9px;
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: var(--radius-sm);
  background: rgba(239,68,68,0.08);
  color: var(--red); font-size: 12px; font-weight: 600;
  font-family: var(--font); cursor: pointer;
  transition: all 0.15s;
  display: none;
}
.cancel-btn:hover { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.5); }
.cancel-btn.visible { display: block; }

/* ================================================================
   Login Modal
   ================================================================ */
.modal-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(6px);
  align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--bg-raised);
  border: 1px solid var(--border-focus);
  border-radius: var(--radius);
  padding: 28px 24px;
  width: 360px; max-width: 90vw;
  box-shadow: 0 16px 64px rgba(0,0,0,0.5);
  animation: modalIn 0.25s var(--spring) both;
}
@keyframes modalIn { from { opacity: 0; transform: scale(0.92) translateY(12px); } }
.modal-title {
  font-size: 18px; font-weight: 700;
  margin-bottom: 20px;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.modal-field { margin-bottom: 14px; }
.modal-field label {
  display: block;
  font-size: 11px; font-weight: 600;
  color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.8px;
  margin-bottom: 6px;
}
.modal-field input {
  width: 100%; padding: 10px 12px;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  color: var(--text);
  font-size: 13px; font-family: var(--font);
  outline: none; transition: border-color 0.15s;
}
.modal-field input:focus { border-color: var(--accent); }
.modal-error {
  display: none;
  padding: 8px 10px;
  border-radius: var(--radius-xs);
  background: var(--red-dim);
  border: 1px solid rgba(239,68,68,0.2);
  color: var(--red); font-size: 12px;
  margin-bottom: 12px;
}
.modal-error.visible { display: block; }
.modal-actions {
  display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;
}
.modal-cancel-btn {
  padding: 8px 16px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  color: var(--text-secondary);
  font-size: 13px; font-weight: 500;
  cursor: pointer; font-family: var(--font);
  transition: all 0.15s;
}
.modal-cancel-btn:hover { background: rgba(255,255,255,0.04); }
.modal-submit-btn {
  padding: 8px 20px;
  background: var(--gradient);
  border: none; border-radius: var(--radius-xs);
  color: #fff; font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: var(--font);
  transition: all 0.15s;
}
.modal-submit-btn:hover { box-shadow: 0 2px 12px rgba(59,130,246,0.3); }
.modal-submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ================================================================
   Toasts
   ================================================================ */
.toast-container {
  position: fixed; top: 14px; right: 14px;
  z-index: 200;
  display: flex; flex-direction: column; gap: 6px;
}
.toast {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 12px; color: var(--text);
  backdrop-filter: blur(16px);
  box-shadow: 0 4px 24px rgba(0,0,0,0.35);
  max-width: 360px;
  animation: toastIn 0.25s var(--spring) both;
  display: flex; align-items: center; gap: 7px;
}
.toast.error { border-color: rgba(239,68,68,0.35); }
.toast.error::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
.toast.info::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.toast.success { border-color: rgba(34,197,94,0.35); }

/* ================================================================
   DOM Helpers
   ================================================================ */
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
const trunc = (s, n) => s && s.length > n ? s.slice(0, n) + '...' : (s || '');

function formatDur(ms) {
  if (ms == null) return '--';
  if (ms < 1000) return ms + 'ms';
  if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
  const m = Math.floor(ms / 60000);
  const sec = Math.floor((ms % 60000) / 1000);
  return m + 'm' + sec + 's';
}
function formatTok(n) {
  if (n == null) return '--';
  if (n < 1000) return String(n);
  if (n < 1e6) return (n / 1000).toFixed(1) + 'k';
  return (n / 1e6).toFixed(1) + 'M';
}
function normModel(m) {
  for (const p of ['us.anthropic.', 'eu.anthropic.', 'ap.anthropic.', 'us.amazon.', 'eu.amazon.']) {
    if (m.startsWith(p)) return m.slice(p.length);
  }
  return m;
}
function rateColor(rate) {
  if (rate >= 80) return 'rgba(34,197,94,0.8)';
  if (rate >= 50) return 'rgba(234,179,8,0.8)';
  return 'rgba(239,68,68,0.8)';
}
function rateFg(rate) {
  if (rate >= 80) return 'var(--green)';
  if (rate >= 50) return 'var(--yellow)';
  return 'var(--red)';
}
function capBadgeClass(cap) {
  if (!cap) return 'default';
  const lc = String(cap).toLowerCase().replace(/\s+/g, '_');
  return ['reasoning', 'tool_use', 'delegation', 'coding'].includes(lc) ? lc : 'default';
}

const CHECK_SVG = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6l2.5 2.5 4.5-5"/></svg>';

/* ================================================================
   Toast
   ================================================================ */
function toast(msg, type) {
  type = type || 'error';
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => {
    el.classList.add('removing');
    setTimeout(() => el.remove(), 250);
  }, 4000);
}

/* ================================================================
   Markdown
   ================================================================ */
function renderMarkdown(text) {
  let html = esc(text);
  html = html.replace(/```([^`]*?)```/gs, (_, code) => '<pre><code>' + code.trim() + '</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^# (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/((?:<li>.*?<\/li>\n?)+)/g, '<ul>$1</ul>');
  html = html.replace(/\n/g, '<br>');
  html = html.replace(/<\/(pre|h3|h4|ul|li)><br>/g, '</$1>');
  html = html.replace(/<br><(pre|h3|h4|ul)/g, '<$1');
  return html;
}

/* ================================================================
   Sidebar
   ================================================================ */
function toggleSidebar() {
  S.sidebarOpen = !S.sidebarOpen;
  document.body.classList.toggle('sidebar-closed', !S.sidebarOpen);
  $('sidebarToggleBtn').classList.toggle('active', S.sidebarOpen);
}

$('sidebarToggleBtn').addEventListener('click', toggleSidebar);
$('sidebarOverlay').addEventListener('click', () => {
  S.sidebarOpen = false;
  document.body.classList.add('sidebar-closed');
  $('sidebarToggleBtn').classList.remove('active');
});

/* ================================================================
   Login
   ================================================================ */
$('loginBtn').addEventListener('click', () => {
  $('loginModal').classList.add('open');
  $('loginUsername').focus();
  $('loginError').classList.remove('visible');
});
$('loginCancelBtn').addEventListener('click', () => $('loginModal').classList.remove('open'));
$('loginModal').addEventListener('click', e => {
  if (e.target === $('loginModal')) $('loginModal').classList.remove('open');
});
$('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('loginSubmitBtn').addEventListener('click', doLogin);

function doLogin() {
  const username = $('loginUsername').value.trim();
  const password = $('loginPassword').value;
  if (!username || !password) {
    $('loginError').textContent = 'Please fill in both fields';
    $('loginError').classList.add('visible');
    return;
  }
  $('loginSubmitBtn').disabled = true;
  $('loginSubmitBtn').textContent = 'Logging in...';
  $('loginError').classList.remove('visible');

  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password }),
  })
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        $('loginError').textContent = data.error;
        $('loginError').classList.add('visible');
      } else {
        $('loginModal').classList.remove('open');
        $('loginUsername').value = '';
        $('loginPassword').value = '';
        const uname = data.username || 'user';
        toast('Logged in as ' + uname, 'success');
        $('loginBtn').textContent = uname;
        // Refresh models list (auth was expired before)
        loadModels();
      }
    })
    .catch(e => {
      $('loginError').textContent = 'Request failed: ' + e.message;
      $('loginError').classList.add('visible');
    })
    .finally(() => {
      $('loginSubmitBtn').disabled = false;
      $('loginSubmitBtn').textContent = 'Login';
    });
}

/* ================================================================
   Conversation: Message Management
   ================================================================ */
const messagesScroll = $('messagesScroll');
const messagesInner = $('messagesInner');
const typingIndicator = $('typingIndicator');
const welcomeView = $('welcomeView');

function hideWelcome() {
  if (welcomeView) welcomeView.style.display = 'none';
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    messagesScroll.scrollTop = messagesScroll.scrollHeight;
  });
}

function showTyping() {
  typingIndicator.classList.add('visible');
  scrollToBottom();
}
function hideTyping() {
  typingIndicator.classList.remove('visible');
}

function addMessage(role, content, opts) {
  hideWelcome();
  opts = opts || {};

  const row = document.createElement('div');
  row.className = 'msg-row ' + role;
  if (opts.id) row.id = opts.id;

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  if (role === 'assistant') {
    bubble.innerHTML = renderMarkdown(content);
  } else {
    bubble.textContent = content;
  }

  row.appendChild(bubble);

  // Insert before the typing indicator row
  const typingRow = typingIndicator.closest('.msg-row');
  messagesInner.insertBefore(row, typingRow);
  scrollToBottom();

  return row;
}

function addRichCard(html, opts) {
  hideWelcome();
  opts = opts || {};

  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  if (opts.id) row.id = opts.id;

  const wrapper = document.createElement('div');
  wrapper.style.maxWidth = '680px';
  wrapper.innerHTML = html;

  row.appendChild(wrapper);

  const typingRow = typingIndicator.closest('.msg-row');
  messagesInner.insertBefore(row, typingRow);
  scrollToBottom();

  return row;
}

/* ================================================================
   Plan Card
   ================================================================ */
function renderPlanCard(plan) {
  const models = (plan.models || []).map(m => esc(normModel(m))).join(', ');
  const cases = plan.cases || [];
  const caseTags = cases.slice(0, 8).map(c =>
    '<span class="plan-case-tag">' + esc(c.replace(/_/g, ' ')) + '</span>'
  ).join('');
  const more = cases.length > 8 ? ' <span style="color:var(--muted);font-size:11px">+' + (cases.length - 8) + ' more</span>' : '';

  let html = '<div class="plan-card">';
  html += '<div class="plan-card-header"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg> Test Plan</div>';
  html += '<div class="plan-row"><span class="plan-label">Models</span><span class="plan-value">' + models + '</span></div>';
  html += '<div class="plan-row"><span class="plan-label">Cases</span><span class="plan-value">' + cases.length + ' selected</span></div>';
  html += '<div class="plan-row"><span class="plan-label"></span><span class="plan-value">' + caseTags + more + '</span></div>';
  html += '<div class="plan-row"><span class="plan-label">Parallel</span><span class="plan-value">' + (plan.parallel || 2) + '</span></div>';
  if (plan.explanation) {
    html += '<div class="plan-explanation">' + esc(plan.explanation) + '</div>';
  }
  html += '<div class="plan-actions">';
  html += '<button class="plan-execute-btn" data-plan-exec type="button">&#9654; Execute Plan</button>';
  html += '<button class="plan-edit-btn" data-plan-edit type="button">&#9998; Edit in Sidebar</button>';
  html += '</div>';
  html += '</div>';

  const row = addRichCard(html);

  // Bind execute
  const execBtn = row.querySelector('[data-plan-exec]');
  const editBtn = row.querySelector('[data-plan-edit]');

  execBtn.addEventListener('click', () => {
    execBtn.disabled = true;
    execBtn.textContent = 'Starting...';

    const runBody = {
      models: plan.models || [],
      cases: plan.cases || [],
      parallel: plan.parallel || 2,
      no_judger: S.noJudger || false,
    };
    const jm = $('judgerModelIn').value.trim();
    if (jm && jm !== S.config.judger_model) runBody.judger_model = jm;

    fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(runBody),
    }).then(r => r.json()).then(d => {
      if (d.error) {
        toast(d.error, 'error');
        execBtn.disabled = false;
        execBtn.innerHTML = '&#9654; Execute Plan';
      }
    }).catch(e => {
      toast('Run failed: ' + e.message, 'error');
      execBtn.disabled = false;
      execBtn.innerHTML = '&#9654; Execute Plan';
    });
  });

  editBtn.addEventListener('click', () => {
    S.selectedModels = new Set(plan.models || []);
    S.selectedCases = new Set(plan.cases || []);
    if (plan.parallel) {
      S.parallel = plan.parallel;
      $('parallelSlider').value = plan.parallel;
      $('parallelVal').textContent = plan.parallel;
    }
    buildModelList();
    renderModelList();
    renderModelTags();
    renderCaseList();
    updateModelOverrideNote();

    if (!S.sidebarOpen) toggleSidebar();
    toast('Plan loaded into sidebar', 'info');
  });
}

/* ================================================================

// ── Timeline Rail (left side visual dots) ──
let railDotY = 20;

function showTimelineRail() {
  $('timelineRail').classList.add('visible');
  railDotY = 20;
}

function clearTimelineRail() {
  const rail = $('timelineRail');
  rail.innerHTML = '';
  rail.classList.remove('visible');
  railDotY = 20;
}

function addRailDot(type, label, targetEl) {
  const rail = $('timelineRail');
  if (!rail) return;
  const dot = document.createElement('div');
  dot.className = 'tl-dot ' + type;
  dot.style.top = railDotY + 'px';
  dot.innerHTML = `<span class="tl-dot-tooltip">${esc(label)}</span>`;
  dot.addEventListener('click', () => {
    if (targetEl) targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  rail.appendChild(dot);
  railDotY += 28;
  return dot;
}

function createTimelineCard() {
  const html = `<div class="timeline-card" id="activeTimeline">
    <div class="tl-header">
      <div class="tl-header-left">
        <span class="tl-status-icon">&#128260;</span>
        <span class="tl-title">Running</span>
        <span class="tl-counter" id="tlCounter">(0/${S.total})</span>
      </div>
    </div>
    <div class="tl-progress-bar"><div class="tl-progress-fill" id="tlProgressFill" style="width:0%"></div></div>
    <div class="tl-rows" id="tlRows"></div>
    <button class="tl-cancel-btn" id="tlCancelBtn" type="button">&#10007; Cancel</button>
  </div>`;

  const row = addRichCard(html, { id: 'timelineRow' });
  S.timelineCardEl = row;

  $('tlCancelBtn').addEventListener('click', cancelRun);
}

function updateTimelineCard() {
  const counter = $('tlCounter');
  const fill = $('tlProgressFill');
  const header = S.timelineCardEl && S.timelineCardEl.querySelector('.tl-title');

  if (!counter || !fill) return;

  const pct = S.total > 0 ? Math.round((S.completed / S.total) * 100) : 0;
  counter.textContent = '(' + S.completed + '/' + S.total + ')';
  fill.style.width = pct + '%';
  if (header) header.textContent = 'Running';
}

function addTimelineRow(report) {
  const rows = $('tlRows');
  if (!rows) return;

  const status = report.passed ? 'pass' : 'fail';
  const tok = (report.outcome.prompt_tokens || 0) + (report.outcome.completion_tokens || 0);
  const key = 'tlr_' + report.case_name + '_' + report.model + '_' + (report.run_index || 0);

  // Remove the running placeholder if it exists
  const existing = document.getElementById(key);
  if (existing) existing.remove();

  const el = document.createElement('div');
  el.className = 'tl-row ' + status;
  el.id = key;
  el.innerHTML = `
    <span class="tl-row-icon">${report.passed ? '&#10004;' : '&#10008;'}</span>
    <span class="tl-row-name">${esc(report.case_name.replace(/_/g, ' '))}</span>
    <span class="tl-row-model">${esc(normModel(report.model))}</span>
    <span class="tl-row-metrics">
      <span>${formatDur(report.outcome.duration_ms || 0)}</span>
      <span>${formatTok(tok)} tok</span>
    </span>`;

  // Make clickable to expand detail
  el.addEventListener('click', () => toggleCaseDetail(el, report));
  rows.appendChild(el);
  rows.scrollTop = rows.scrollHeight;
}

function addTimelineRunningRow(caseName, model, runIndex) {
  const rows = $('tlRows');
  if (!rows) return;

  const key = 'tlr_' + caseName + '_' + model + '_' + (runIndex || 0);
  if (document.getElementById(key)) return;

  const el = document.createElement('div');
  el.className = 'tl-row running';
  el.id = key;
  el.innerHTML = `
    <span class="tl-row-icon"><span class="spin-icon"></span></span>
    <span class="tl-row-name">${esc(caseName.replace(/_/g, ' '))}</span>
    <span class="tl-row-model">${esc(normModel(model))}</span>
    <span class="tl-row-metrics" style="color:var(--accent)">running...</span>`;
  rows.appendChild(el);
  rows.scrollTop = rows.scrollHeight;
}

/* ================================================================
   Case Detail (inline expand below row)
   ================================================================ */
function toggleCaseDetail(rowEl, report) {
  const existing = rowEl.nextElementSibling;
  if (existing && existing.classList.contains('case-detail-expand')) {
    existing.remove();
    return;
  }

  // Close any other open details
  const rows = rowEl.closest('.tl-rows') || rowEl.closest('.report-card');
  if (rows) {
    rows.querySelectorAll('.case-detail-expand').forEach(el => el.remove());
  }

  const detail = document.createElement('div');
  detail.className = 'case-detail-expand open';
  detail.innerHTML = buildCaseDetailHTML(report);
  rowEl.after(detail);
  bindCopyButtons(detail);
  bindCollapseToggles(detail);
}

function buildCaseDetailHTML(report) {
  const status = report.passed ? 'pass' : 'fail';
  const tok = (report.outcome.prompt_tokens || 0) + (report.outcome.completion_tokens || 0);

  let html = '';

  // Status + stats
  html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
    <span style="font-weight:700;font-size:13px;color:${report.passed ? 'var(--green)' : 'var(--red)'}">${report.passed ? 'PASS' : 'FAIL'}</span>
    <span style="font-size:12px;color:var(--muted)">${esc(report.case_name)}</span>
    <span style="font-size:11px;color:var(--dim);font-family:var(--mono)">${esc(normModel(report.model))}</span>
  </div>`;

  html += `<div class="cd-stats">
    <div class="cd-stat"><div class="cd-val">${formatDur(report.outcome.duration_ms || 0)}</div><div class="cd-lbl">Duration</div></div>
    <div class="cd-stat"><div class="cd-val">${formatTok(tok)}</div><div class="cd-lbl">Tokens</div></div>
    <div class="cd-stat"><div class="cd-val">${report.outcome.turn_rounds || 0}</div><div class="cd-lbl">Turns</div></div>
    <div class="cd-stat"><div class="cd-val">${report.outcome.tool_calls_count || 0}</div><div class="cd-lbl">Tools</div></div>
  </div>`;

  // Criteria
  if (report.criteria && report.criteria.length > 0) {
    html += '<div class="cd-section"><div class="cd-label">Criteria</div><div class="criteria-list">';
    for (const c of report.criteria) {
      html += `<div class="crit-row"><span class="crit-icon ${c.passed ? 'pass' : 'fail'}">${c.passed ? '&#10004;' : '&#10008;'}</span><div class="crit-text">${esc(c.detail)}`;
      if (c.score != null) {
        const pct = Math.round(c.score * 100);
        const col = c.score >= 0.7 ? 'var(--green)' : c.score >= 0.4 ? 'var(--yellow)' : 'var(--red)';
        html += `<div class="score-bar-wrap"><div class="score-bar-lbl">Score: ${c.score.toFixed(2)}</div><div class="score-bar-outer"><div class="score-bar-fill" style="width:${pct}%;background:${col}"></div></div></div>`;
      }
      html += '</div></div>';
    }
    html += '</div></div>';
  }

  // Session ID
  const sid = report.outcome.session_id;
  if (sid) {
    html += `<div class="cd-section"><div class="cd-label">Session ID</div>
      <div class="copyable-row">
        <div class="copyable-text">${esc(sid)}</div>
        <button class="copy-btn" type="button" data-copy="${esc(sid)}">&#128203; Copy</button>
      </div></div>`;
  }

  // Reproducer
  if (report.reproducer) {
    html += `<div class="cd-section"><div class="cd-label">Reproducer</div>
      <div class="cd-code-block"><button class="code-copy" type="button" data-copy="${esc(report.reproducer)}">Copy</button>${esc(report.reproducer)}</div></div>`;
  }

  // Failure class
  if (report.failure_class) {
    const fcText = typeof report.failure_class === 'string' ? report.failure_class : JSON.stringify(report.failure_class);
    html += `<div class="cd-section"><div class="cd-label" style="color:var(--red)">Failure Class</div>
      <div style="font-size:12px;color:var(--red)">${esc(fcText)}</div></div>`;
  }

  // Steps
  if (report.steps && report.steps.length > 0) {
    html += '<div class="cd-section"><div class="cd-label">Steps (' + report.steps.length + ')</div>';
    for (const step of report.steps) {
      const sBadge = step.passed !== false ? 'pass' : 'fail';
      html += `<div class="step-card">
        <div class="step-hdr">
          <span class="step-idx">Step ${step.step_index} <span style="color:${step.passed !== false ? 'var(--green)' : 'var(--red)'};font-size:10px;font-weight:700">${step.passed !== false ? 'PASS' : 'FAIL'}</span></span>
          <span class="step-dur">${formatDur(step.duration_ms)}</span>
        </div>`;
      if (step.prompt) html += `<div class="step-prompt">${esc(trunc(step.prompt, 150))}</div>`;
      if (step.outcome && step.outcome.text) html += `<div class="step-outcome-text">${esc(trunc(step.outcome.text, 200))}</div>`;
      if (step.criteria && step.criteria.length > 0) {
        html += '<div class="criteria-list" style="margin-top:4px">';
        for (const c of step.criteria) {
          html += `<div class="crit-row"><span class="crit-icon ${c.passed ? 'pass' : 'fail'}" style="font-size:10px">${c.passed ? '&#10004;' : '&#10008;'}</span><div class="crit-text">${esc(c.detail)}</div></div>`;
        }
        html += '</div>';
      }
      html += '</div>';
    }
    html += '</div>';
  }

  // Output
  const outText = report.outcome.text;
  if (outText) {
    const uid = 'cd_out_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    html += `<div class="cd-section">
      <button class="collapse-toggle" type="button" data-tgt="${uid}">
        <span class="caret">&#9654;</span> Output (${outText.length} chars)
      </button>
      <div class="collapse-body" id="${uid}">
        <div class="cd-code-block"><button class="code-copy" type="button" data-copy="${esc(outText)}">Copy</button>${esc(trunc(outText, 3000))}</div>
      </div>
    </div>`;
  }

  return html;
}

function bindCopyButtons(container) {
  container.querySelectorAll('.copy-btn, .code-copy').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const text = btn.dataset.copy || '';
      navigator.clipboard.writeText(text).then(
        () => { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 1500); },
        () => {}
      );
    });
  });
}

function bindCollapseToggles(container) {
  container.querySelectorAll('.collapse-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const tgt = document.getElementById(btn.dataset.tgt);
      if (!tgt) return;
      const open = tgt.classList.toggle('open');
      btn.querySelector('.caret').classList.toggle('open', open);
    });
  });
}

/* ================================================================
   Report Card
   ================================================================ */
function addReportCard() {
  const stats = modelStats();
  const entries = Object.entries(stats).sort((a, b) =>
    (b[1].pass / Math.max(b[1].total, 1)) - (a[1].pass / Math.max(a[1].total, 1))
  );

  const rate = S.completed > 0 ? Math.round(S.passed / S.completed * 100) : 0;
  const wallMs = S.suiteReport ? S.suiteReport.wall_time_ms : (S.startTime ? Date.now() - S.startTime : 0);
  const statusText = S.cancelled ? 'Cancelled' : 'Complete';

  let html = '<div class="report-card">';
  html += '<div class="report-header">';
  html += '<div class="report-header-left"><span style="font-size:18px">&#128202;</span>';
  html += '<span class="report-title">Results: ' + S.passed + '/' + S.completed + ' passed (' + rate + '%)</span></div>';
  html += '<span class="report-rate" style="color:' + rateFg(rate) + '">' + rate + '%</span>';
  html += '</div>';

  // Summary stats
  html += '<div class="report-summary-row">';
  html += '<div class="report-stat"><div class="rs-val" style="color:var(--green)">' + S.passed + '</div><div class="rs-lbl">Passed</div></div>';
  html += '<div class="report-stat"><div class="rs-val" style="color:var(--red)">' + S.failed + '</div><div class="rs-lbl">Failed</div></div>';
  html += '<div class="report-stat"><div class="rs-val">' + formatDur(wallMs) + '</div><div class="rs-lbl">Wall Time</div></div>';
  html += '</div>';

  // Model comparison table
  if (entries.length > 0) {
    html += '<table class="report-table"><thead><tr>';
    html += '<th>Model</th><th>Pass</th><th>Tok/Pass</th><th>Dur/Pass</th>';
    html += '</tr></thead><tbody>';
    for (const [name, s] of entries) {
      const r = Math.round(s.pass / Math.max(s.total, 1) * 100);
      const p = Math.max(s.pass, 1);
      html += '<tr>';
      html += '<td style="font-weight:600">' + esc(name) + '</td>';
      html += '<td><span class="rate-pill" style="background:' + rateColor(r) + '">' + r + '%</span> <span style="color:var(--muted);font-size:11px">' + s.pass + '/' + s.total + '</span></td>';
      html += '<td>' + formatTok(Math.round(s.passTok / p)) + '</td>';
      html += '<td>' + formatDur(Math.round(s.passDur / p)) + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table>';
  }

  // Failed cases
  const failedRuns = S.runs.filter(r => !r.passed);
  if (failedRuns.length > 0) {
    html += '<div class="report-failures"><div class="cd-label" style="margin-bottom:6px">Failed cases</div>';
    for (const r of failedRuns) {
      const fc = r.failure_class ? (typeof r.failure_class === 'string' ? r.failure_class : JSON.stringify(r.failure_class)) : '';
      html += '<div class="report-fail-row" data-fail-idx="' + S.runs.indexOf(r) + '">';
      html += '<span class="rf-icon">&#10008;</span>';
      html += '<span class="rf-case">' + esc(r.case_name) + '</span>';
      html += '<span class="rf-model">' + esc(normModel(r.model)) + '</span>';
      if (fc) html += '<span class="rf-class">' + esc(trunc(fc, 30)) + '</span>';
      html += '</div>';
    }
    html += '</div>';
  }

  html += '</div>';

  const row = addRichCard(html, { id: 'reportRow' });

  // Bind failed case clicks
  row.querySelectorAll('.report-fail-row').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.failIdx);
      const report = S.runs[idx];
      if (report) toggleCaseDetail(el, report);
    });
  });

  // Auto-trigger LLM analysis
  const analysisDiv = document.createElement('div');
  analysisDiv.className = 'report-analysis';
  analysisDiv.innerHTML = '<div class="analysis-loading">Generating diagnostic analysis...</div>';
  row.querySelector('.report-card').appendChild(analysisDiv);

  fetch('/api/analyze', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: $('inputModel').value || undefined }),
  })
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        analysisDiv.innerHTML = '<div class="analysis-error">Analysis unavailable: ' + esc(data.error) + '</div>';
      } else if (data.analysis) {
        analysisDiv.innerHTML = '<div class="analysis-content">' + renderMarkdown(data.analysis) + '</div>';
      }
    })
    .catch(() => {
      analysisDiv.innerHTML = '<div class="analysis-error">Analysis request failed</div>';
    });
}

function modelStats() {
  const out = {};
  for (const r of S.runs) {
    const m = normModel(r.model);
    if (!out[m]) out[m] = { pass: 0, total: 0, passTok: 0, passDur: 0, passTurns: 0 };
    const s = out[m];
    s.total++;
    const tok = (r.outcome.prompt_tokens || 0) + (r.outcome.completion_tokens || 0);
    if (r.passed) {
      s.pass++;
      s.passTok += tok;
      s.passDur += r.outcome.duration_ms || 0;
      s.passTurns += r.outcome.turn_rounds || 0;
    }
  }
  return out;
}

/* ================================================================
   Finalize Timeline
   ================================================================ */
function finalizeTimeline() {
  // Update timeline header
  const card = document.getElementById('activeTimeline');
  if (!card) return;

  const title = card.querySelector('.tl-title');
  const icon = card.querySelector('.tl-status-icon');
  const cancelBtn = $('tlCancelBtn');
  const fill = $('tlProgressFill');
  const counter = $('tlCounter');

  if (title) title.textContent = S.cancelled ? 'Cancelled' : 'Complete';
  if (icon) icon.textContent = S.cancelled ? '⚠' : '✅';
  if (cancelBtn) cancelBtn.style.display = 'none';
  if (fill) fill.style.width = '100%';
  if (counter) counter.textContent = '(' + S.completed + '/' + S.total + ')';
}

/* ================================================================
   Models: Build & Render
   ================================================================ */
function buildModelList() {
  const set = new Set();
  (S.config.available_models || []).forEach(m => set.add(m));
  (S.modelRegistry || []).forEach(rm => set.add(rm.name));
  S.allModels = [...set];
}

function renderModelList() {
  const container = $('modelList');
  container.innerHTML = '';

  const registry = S.modelRegistry || [];
  const registryByName = {};
  for (const rm of registry) registryByName[rm.name] = rm;

  const groups = {};
  for (const m of S.allModels) {
    const rm = registryByName[m];
    const provider = (rm && rm.provider) ? rm.provider : 'Other';
    if (!groups[provider]) groups[provider] = [];
    groups[provider].push(m);
  }

  const providerKeys = Object.keys(groups).sort((a, b) => {
    if (a === 'Other') return 1;
    if (b === 'Other') return -1;
    return a.localeCompare(b);
  });

  for (const provider of providerKeys) {
    if (providerKeys.length > 1 || provider !== 'Other') {
      const label = document.createElement('div');
      label.className = 'model-provider-label';
      label.textContent = provider;
      container.appendChild(label);
    }
    for (const m of groups[provider]) {
      const checked = S.selectedModels.has(m);
      const rm = registryByName[m];
      const item = document.createElement('div');
      item.className = 'sb-check-item' + (checked ? ' checked' : '');
      let titleText = m;
      if (rm && rm.description) titleText += ' — ' + rm.description;
      if (rm && rm.context_window) titleText += ' (' + formatTok(rm.context_window) + ' ctx)';
      const shortName = normModel(m);
      item.innerHTML = `<span class="ck">${CHECK_SVG}</span><span class="item-label" title="${esc(titleText)}"><span class="short-name">${esc(shortName)}</span></span>`;
      item.addEventListener('click', () => {
        if (S.selectedModels.has(m)) S.selectedModels.delete(m);
        else S.selectedModels.add(m);
        renderModelList();
        renderModelTags();
        updateModelOverrideNote();
      });
      container.appendChild(item);
    }
  }
}

function updateModelOverrideNote() {
  const note = $('modelOverrideNote');
  if (note) note.classList.toggle('visible', S.selectedModels.size > 0);
}

function renderModelTags() {
  const container = $('modelTags');
  container.innerHTML = '';
  for (const m of S.selectedModels) {
    const tag = document.createElement('span');
    tag.className = 'sel-tag';
    tag.title = m;
    tag.innerHTML = esc(normModel(m)) + '<span class="tag-x">&times;</span>';
    tag.querySelector('.tag-x').addEventListener('click', e => {
      e.stopPropagation();
      S.selectedModels.delete(m);
      renderModelList();
      renderModelTags();
      updateModelOverrideNote();
    });
    container.appendChild(tag);
  }
}

$('modelSelectAll').addEventListener('click', () => {
  S.allModels.forEach(m => S.selectedModels.add(m));
  renderModelList(); renderModelTags(); updateModelOverrideNote();
});
$('modelSelectNone').addEventListener('click', () => {
  S.selectedModels.clear();
  renderModelList(); renderModelTags(); updateModelOverrideNote();
});
$('addModelBtn').addEventListener('click', addCustomModel);
$('customModelIn').addEventListener('keydown', e => { if (e.key === 'Enter') addCustomModel(); });

function addCustomModel() {
  const v = $('customModelIn').value.trim();
  if (!v) return;
  if (!S.allModels.includes(v)) S.allModels.push(v);
  S.selectedModels.add(v);
  renderModelList(); renderModelTags(); updateModelOverrideNote();
  $('customModelIn').value = '';
}

/* ================================================================
   Cases: Build & Render
   ================================================================ */
function getCapabilities() {
  const caps = new Set();
  S.allCases.forEach(c => { if (c.capability) caps.add(c.capability); });
  return [...caps].sort();
}

function renderCapPills() {
  const container = $('capPills');
  container.innerHTML = '';
  const caps = getCapabilities();
  const allPill = document.createElement('button');
  allPill.className = 'cap-pill' + (!S.capFilter ? ' active' : '');
  allPill.textContent = 'All';
  allPill.type = 'button';
  allPill.addEventListener('click', () => { S.capFilter = ''; renderCapPills(); renderCaseList(); });
  container.appendChild(allPill);

  for (const cap of caps) {
    const pill = document.createElement('button');
    pill.className = 'cap-pill' + (S.capFilter === cap ? ' active' : '');
    pill.textContent = cap;
    pill.type = 'button';
    pill.addEventListener('click', () => {
      S.capFilter = S.capFilter === cap ? '' : cap;
      renderCapPills(); renderCaseList();
    });
    container.appendChild(pill);
  }
}

function filteredCases() {
  let list = S.allCases;
  if (S.capFilter) list = list.filter(c => c.capability === S.capFilter);
  if (S.caseSearch) {
    const q = S.caseSearch.toLowerCase();
    list = list.filter(c => c.name.toLowerCase().includes(q) || (c.description || '').toLowerCase().includes(q));
  }
  return list;
}

function renderCaseList() {
  const container = $('caseList');
  container.innerHTML = '';
  const cases = filteredCases();
  const selCount = [...S.selectedCases].filter(n => S.allCases.some(c => c.name === n)).length;
  $('casesCount').textContent = '(' + selCount + '/' + S.allCases.length + ')';

  for (const c of cases) {
    const checked = S.selectedCases.has(c.name);
    const item = document.createElement('div');
    item.className = 'sb-check-item' + (checked ? ' checked' : '');

    let metaHtml = '';
    if (c.capability) {
      metaHtml += '<span class="case-cap-badge ' + capBadgeClass(c.capability) + '">' + esc(c.capability) + '</span>';
    }
    if (c.difficulty) {
      let dots = '';
      for (let i = 1; i <= 5; i++) dots += '<span class="case-diff-dot' + (i <= c.difficulty ? ' filled' : '') + '"></span>';
      metaHtml += '<span class="case-diff-dots">' + dots + '</span>';
    }

    const displayName = c.name.replace(/_/g, ' ');
    item.innerHTML = '<span class="ck">' + CHECK_SVG + '</span><span class="item-label" title="' + esc(c.description || c.name) + '">' + esc(displayName) + '</span><span class="item-meta">' + metaHtml + '</span>';
    item.addEventListener('click', () => {
      if (S.selectedCases.has(c.name)) S.selectedCases.delete(c.name);
      else S.selectedCases.add(c.name);
      renderCaseList();
    });
    container.appendChild(item);
  }
}

$('caseSelectAll').addEventListener('click', () => {
  filteredCases().forEach(c => S.selectedCases.add(c.name));
  renderCaseList();
});
$('caseSelectNone').addEventListener('click', () => {
  filteredCases().forEach(c => S.selectedCases.delete(c.name));
  renderCaseList();
});
$('caseSearch').addEventListener('input', () => {
  S.caseSearch = $('caseSearch').value.trim();
  renderCaseList();
});

$('judgerToggle').addEventListener('click', () => {
