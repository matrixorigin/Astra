[workspace]
members = [
    "crates/core",
    "crates/astra-logging",
    "crates/services",
    "crates/runtime",
    "crates/astra-tools",
    "crates/astra-cli",
    "crates/astra-admin",
    "crates/astra-thin-client",
    "crates/astra-edge",
    "crates/astra-pipeline",
    "crates/astra-plan",
    "crates/astra-prompts",
    "crates/astra-turn-types",
    "crates/astra-skills",
    "crates/astra-sandbox",
    "crates/astra-server-types",
    "crates/astra-turn-core",
    "crates/astra-messaging",
    "crates/astra-text-utils",
    "crates/astra-config",
    "crates/astra-evolution",
    "crates/astra-learning",
    "crates/astra-sync-adapters",
    "crates/astra-test-harness",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
astra-core = { path = "crates/core" }
astra-logging = { path = "crates/astra-logging" }
astra-config = { path = "crates/astra-config" }
astra-evolution = { path = "crates/astra-evolution" }
astra-learning = { path = "crates/astra-learning" }
astra-sync-adapters = { path = "crates/astra-sync-adapters" }
astra-messaging = { path = "crates/astra-messaging" }
astra-text-utils = { path = "crates/astra-text-utils" }
astra-pipeline = { path = "crates/astra-pipeline" }
astra-plan = { path = "crates/astra-plan" }
astra-prompts = { path = "crates/astra-prompts" }
astra-sandbox = { path = "crates/astra-sandbox" }
astra-server-types = { path = "crates/astra-server-types" }
astra-turn-core = { path = "crates/astra-turn-core" }
astra-turn-types = { path = "crates/astra-turn-types" }
astra-skills = { path = "crates/astra-skills" }
astra-tools = { path = "crates/astra-tools" }
astra-services = { path = "crates/services" }
astra-runtime = { path = "crates/runtime" }
astra-thin-client = { path = "crates/astra-thin-client" }
async-stream = "0.3.6"
async-trait = "0.1.89"
axum = { version = "0.8.6", features = ["ws"] }
base64 = "0.22.1"
bcrypt = "0.17.1"
chrono = { version = "0.4.42", features = ["clock"] }
dotenvy = "0.15.7"
fernet = "0.2.2"
flate2 = "1.1.2"
tar = "0.4"
futures-util = "0.3.31"
jsonwebtoken = "9.3.1"
nix = { version = "0.31.2", features = ["fs", "signal"] }
regex = "1.12.2"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream", "socks"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["mysql", "runtime-tokio-rustls"] }
tokio = { version = "1.47.1", features = ["macros", "net", "process", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1.18.1", features = ["v4", "v7"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "ansi",
    "env-filter",
    "fmt",
    "json",
    "registry",
    "std",
    "time",
] }
# Must match `tracing-opentelemetry` (0.27.x pulls opentelemetry 0.26 — keep a single OTel line).
opentelemetry = { version = "0.26.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.26.0", default-features = false, features = [
    "rt-tokio",
    "trace",
] }
opentelemetry-otlp = { version = "0.26.0", default-features = false, features = [
    "grpc-tonic",
    "tls-roots",
    "trace",
] }
tracing-opentelemetry = { version = "0.27.0" }
tracing-appender = { version = "0.2", default-features = false }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
clap = { version = "4", features = ["derive", "env"] }
hostname = "0.4"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1
