[workspace]
members = ["crates/core", "crates/services", "crates/runtime", "crates/mo-agent", "crates/mo-admin"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
mo-agent-core = { path = "crates/core" }
mo-agent-services = { path = "crates/services" }
mo-agent-runtime = { path = "crates/runtime" }
async-stream = "0.3.6"
async-trait = "0.1.89"
axum = { version = "0.8.6", features = ["ws"] }
base64 = "0.22.1"
bcrypt = "0.17.1"
chrono = { version = "0.4.42", features = ["clock"] }
dotenvy = "0.15.7"
fernet = "0.2.2"
flate2 = "1.1.2"
futures-util = "0.3.31"
jsonwebtoken = "9.3.1"
regex = "1.12.2"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["mysql", "runtime-tokio-rustls"] }
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5.2", features = ["util"] }
uuid = { version = "1.18.1", features = ["v4", "v7"] }
thiserror = "1.0"
