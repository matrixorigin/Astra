# cargo-audit configuration (https://github.com/rustsec/rustsec/tree/main/cargo-audit)
#
# RUSTSEC-2023-0071 (rsa / Marvin timing): pulled in by sqlx-mysql → rsa. There is no patched rsa
# release in the ecosystem path we use; MatrixOne access is over TLS and we do not use rsa for
# application-side private-key operations. Revisit when sqlx or mysql driver drops rsa.
#
# REVIEW_BY: 2026-10-18 — calendar re-check: run `cargo audit`, confirm whether rsa/sqlx resolved;
# remove this ignore if a fixed dependency graph is available.

# RUSTSEC-2026-0204 (crossbeam-epoch): crossbeam-epoch 0.9.18 has an invalid-pointer
# dereference bug in fmt::Pointer for Atomic/Shared. There is currently no patched
# crossbeam-epoch release listed by RustSec. Our remaining production path is
# astra-cli → termimad → crossbeam; termimad 0.34.1 still depends on crossbeam, so
# a termimad version bump does not remove the vulnerable crate. We do not format
# crossbeam epoch pointers in the CLI markdown rendering path. Revisit by either
# removing/replacing termimad or dropping this ignore when crossbeam publishes a
# fixed release.
# REVIEW_BY: 2026-10-07
[advisories]
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0204",
]
