# mo-agent-engine Docker Compose Configuration
# Minimal setup for local development: MatrixOne (standalone) + Redis

services:
  # MatrixOne Database (Standalone Mode)
  # Reference: https://docs.matrixorigin.io/
  matrixone:
    image: ${MATRIXONE_IMAGE:-matrixorigin/matrixone:latest}
    container_name: mo-agent-engine-db
    hostname: matrixone
    profiles:
      - dev
    command: ["/mo-service", "-launch", "/etc/quickstart/launch.toml"]
    ports:
      - "${MATRIXONE_PORT:-6001}:6001"  # MySQL protocol port
    volumes:
      - mo-data:/mo-data
    environment:
      - TZ=Asia/Shanghai
    networks:
      - mo-dev-net
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P6001 -uroot -p111 -e 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Redis (for future caching/queue)
  redis:
    image: redis:7.2
    container_name: mo-agent-engine-redis
    hostname: redis
    profiles:
      - dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - mo-dev-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  mo-data:
    name: mo-agent-engine-data
  mo-logs:
    name: mo-agent-engine-logs
  redis-data:
    name: mo-agent-engine-redis

networks:
  mo-dev-net:
    name: mo-agent-engine-network
    driver: bridge
