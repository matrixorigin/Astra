[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
exclude = ^(?!cli/|core/|sdk/|api/|infra/)
pretty = True
show_error_codes = True
no_implicit_optional = True
check_untyped_defs = False

[mypy-pymysql.*]
ignore_missing_imports = True

[mypy-openai.*]
ignore_missing_imports = True

[mypy-groq.*]
ignore_missing_imports = True

[mypy-anthropic.*]
ignore_missing_imports = True

# 这些模块的 Skill 子类使用具体类型而不是基类类型
# 使用 # type: ignore[override] 注释来处理
[mypy-core.skills.extended]
disable_error_code = override,arg-type,attr-defined

[mypy-core.skills.builtin]
disable_error_code = override,arg-type,misc

[mypy-core.skills.delegation]
disable_error_code = override

[mypy-core.skills.selector]
disable_error_code = no-any-return

[mypy-core.skills.modern_selector]
disable_error_code = no-any-return

[mypy-core.llm.router]
disable_error_code = no-any-return

[mypy-core.context.prompts]
disable_error_code = no-any-return

[mypy-core.context.embeddings]
disable_error_code = no-any-return

[mypy-core.llm.client]
disable_error_code = no-any-return
