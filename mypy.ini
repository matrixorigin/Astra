[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
exclude = ^(?!cli/|core/|sdk/|api/|infra/)
pretty = True
show_error_codes = True
no_implicit_optional = True

[mypy-pymysql.*]
ignore_missing_imports = True

[mypy-openai.*]
ignore_missing_imports = True

[mypy-groq.*]
ignore_missing_imports = True

[mypy-anthropic.*]
ignore_missing_imports = True

# Skill 基类与子类的类型签名不兼容（使用泛型但子类仍用具体类型）
[mypy-core.skills.extended]
disable_error_code = override,arg-type,attr-defined

[mypy-core.skills.builtin]
disable_error_code = override,arg-type,misc

[mypy-core.skills.delegation]
disable_error_code = override

[mypy-core.llm.rate_limiter]
disable_error_code = annotation-unchecked

[mypy-core.agent.agent_registry]
disable_error_code = annotation-unchecked
