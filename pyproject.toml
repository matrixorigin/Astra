[tool.poetry]
name = "mo-agent-engine"
version = "0.1.0"
description = "Event-centric intelligent agent platform with conversation replay and time-point sandbox"
authors = ["MatrixOne Team"]
readme = "README.md"
packages = [{include = "core"}, {include = "api"}, {include = "config"}]

[tool.poetry.dependencies]
python = "^3.11"
pymysql = "^1.1.0"
sqlalchemy = "^2.0.0"
pydantic = {extras = ["email"], version = "^2.5.0"}
pydantic-settings = "^2.1.0"
uuid-utils = "^0.9.0"
python-dotenv = "^1.0.0"
redis = "^5.0.1"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
PyGithub = "^2.1.1"
prometheus-client = "^0.19.0"
PyJWT = "^2.8.0"
urllib3 = "<2.0.0"
click = "^8.1.0"
bcrypt = "^4.1.2"
httpx = "^0.26.0,<0.27.0"
email-validator = "^2.1.0"

[tool.poetry.scripts]
mo-agent = "cli.mo_agent:cli"
mo-admin = "cli.mo_admin:cli"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
ruff = "^0.15.0"
mypy = "^1.13.0"
types-pymysql = "^1.1.0"
freezegun = "^1.4.0"
vcrpy = "^5.1.0"
pre-commit = "^3.6.0"
responses = "^0.24.0"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # Allow assert in tests
"**/*.py" = ["RUF001", "RUF003"]  # Ignore ambiguous unicode characters in strings/comments
"api/main.py" = ["B008"]  # Allow Depends in FastAPI
"cli/mo_agent.py" = ["B023", "PTH123", "B025"]  # Allow loop variable binding and open() in CLI
"core/context/manager.py" = ["SIM108", "SIM103"]  # Allow complex ternary logic and explicit return
"core/llm/rate_limiter.py" = ["SIM102", "SIM103"]  # Allow nested if for clarity
"core/llm/providers.py" = ["SIM102"]  # Allow nested if for clarity
"core/llm/router.py" = ["RUF012"]  # Allow mutable class attributes
"cli/mo_admin.py" = ["SIM102"]  # Allow nested if for clarity
"tests/unit/test_model_config.py" = ["SIM102"]  # Allow nested if for clarity
"tests/unit/test_scope_resolver.py" = ["SIM102"]  # Allow nested if for clarity
"tests/unit/test_scope_integration.py" = ["SIM102"]  # Allow nested if for clarity
"core/skills/github_client.py" = ["SIM105"]  # Allow try-except-pass
"core/sandbox/sandbox.py" = ["SIM105"]  # Allow try-except-pass
"core/skills/extended.py" = ["SIM105"]  # Allow try-except-pass
"tests/integration/test_admin_cli.py" = ["SIM105", "E722"]  # Allow try-except-pass and bare except
"tests/integration/test_replay_e2e.py" = ["PTH123"]  # Allow open() for tests
"core/skills/registry.py" = ["B025"]  # Allow duplicate exception handling
"sdk/connection_pool.py" = ["E722"]  # Allow bare except for connection handling
"examples/**/*.py" = ["E402"]  # Allow module level imports in examples
"infra/scripts/**/*.py" = ["E402", "PTH123"]  # Allow module level imports and open() in scripts

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pymysql",
    "pymysql.cursors",
    "pymysql.connections",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests (require database setup)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
