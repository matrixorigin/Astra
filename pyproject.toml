[tool.poetry]
name = "mo-dev-agent"
version = "0.1.0"
description = "Event-centric intelligent agent platform with conversation replay and time-point sandbox"
authors = ["MatrixOne Team"]
readme = "README.md"
packages = [{include = "sdk"}, {include = "core"}, {include = "api"}]

[tool.poetry.dependencies]
python = "^3.10"
pymysql = "^1.1.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-ulid = "^2.2.0"
python-dotenv = "^1.0.0"
redis = "^5.0.1"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
ruff = "^0.1.11"
mypy = "^1.8.0"
freezegun = "^1.4.0"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
