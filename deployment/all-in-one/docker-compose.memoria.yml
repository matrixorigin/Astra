# astra-engine with Memoria backend
#
# Usage:
#   docker-compose -f docker-compose.memoria.yml up -d

services:

  # ─── Infrastructure ─────────────────────────────────────────

  matrixone:
    image: ${MATRIXONE_IMAGE:-matrixorigin/matrixone:latest}
    hostname: matrixone
    entrypoint: /entrypoint.sh
    command: []
    ports:
      - "${MATRIXONE_PORT:-6001}:6001"
    volumes:
      - ${MATRIXONE_DATA_DIR:-./data/matrixone}:/mo-data
      - ${MATRIXONE_LOG_DIR:-./data/matrixone/logs}:/mo-logs
      - ../../matrixone-entrypoint.sh:/entrypoint.sh:ro
    environment:
      - TZ=Asia/Shanghai
    user: "${UID:-1000}:${GID:-1000}"
    networks:
      - mo-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:6060/debug/vars"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ─── Memoria Service ────────────────────────────────────────

  memoria:
    image: matrixorigin/memoria:latest
    hostname: memoria
    ports:
      - "8100:8000"
    environment:
      - DATABASE_URL=mysql://root:111@matrixone:6001/memoria
      - MASTER_KEY=${MEMORIA_MASTER_KEY:-dev-master-key-change-in-production}
      - EMBEDDING_PROVIDER=${MEMORIA_EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_API_KEY=${MEMORIA_EMBEDDING_API_KEY}
      - EMBEDDING_BASE_URL=${MEMORIA_EMBEDDING_BASE_URL}
      - EMBEDDING_MODEL=${MEMORIA_EMBEDDING_MODEL:-BAAI/bge-m3}
      - EMBEDDING_DIM=${MEMORIA_EMBEDDING_DIM:-1024}
    depends_on:
      matrixone:
        condition: service_healthy
    networks:
      - mo-net
    healthcheck:
      test: ["CMD-SHELL", "grep -aq 'memoria' /proc/1/cmdline"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ─── astra-engine API ───────────────────────────────────────

  init:
    build:
      context: ../..
    command: ["astra-admin", "init"]
    environment:
      - MATRIXONE_HOST=matrixone
      - MATRIXONE_PORT=6001
      - MEMORIA_BASE_URL=http://memoria:8000
      - MEMORIA_MASTER_KEY=${MEMORIA_MASTER_KEY:-dev-master-key-change-in-production}
    env_file:
      - ../../.env
    depends_on:
      matrixone:
        condition: service_healthy
      memoria:
        condition: service_healthy
    networks:
      - mo-net
    restart: "no"

  api:
    build:
      context: ../..
    hostname: api
    command: ["astra-server"]
    ports:
      - "${ASTRA_API_PORT:-8000}:8000"
    environment:
      - ASTRA_API_HOST=0.0.0.0
      - ASTRA_API_PORT=8000
      - MATRIXONE_HOST=matrixone
      - MATRIXONE_PORT=6001
      - MATRIXONE_PASSWORD=${MATRIXONE_PASSWORD}
      - ASTRA_DATABASE=${ASTRA_DATABASE:-astra_runtime}
      - ASTRA_DATABASE_PREFIX=${ASTRA_DATABASE_PREFIX:-}
      - ASTRA_JWT_SECRET=${ASTRA_JWT_SECRET}
      - ASTRA_TOKEN_ENCRYPTION_KEY=${ASTRA_TOKEN_ENCRYPTION_KEY}
      - ASTRA_BRIDGE_SECRET=${ASTRA_BRIDGE_SECRET}
      - MEMORIA_BASE_URL=http://memoria:8000
      - MEMORIA_MASTER_KEY=${MEMORIA_MASTER_KEY:-dev-master-key-change-in-production}
    env_file:
      - ../../.env
    depends_on:
      init:
        condition: service_completed_successfully
      memoria:
        condition: service_healthy
    networks:
      - mo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  mo-net:
    driver: bridge
