# Astra - All-in-One Docker Compose
#
# Starts MatrixOne, Memoria, and astra-server with one compose stack.
# Development deps still use docker-compose.deps.yml via `make dev-deps-*`.

x-env-files: &astra-env-files
  - path: ./.env
    required: false

services:
  matrixone-init:
    image: ${MATRIXONE_IMAGE:?Set MATRIXONE_IMAGE in deployment/all-in-one/.env}
    user: root
    environment:
      HOST_UID: ${UID:-1000}
      HOST_GID: ${GID:-1000}
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        case "$${HOST_UID}" in ''|*[!0-9]*) echo "UID must be numeric" >&2; exit 1;; esac
        case "$${HOST_GID}" in ''|*[!0-9]*) echo "GID must be numeric" >&2; exit 1;; esac
        owner="$${HOST_UID}:$${HOST_GID}"
        marker=/mo-data/.astra-owner
        if [ -L "$${marker}" ] || { [ -e "$${marker}" ] && [ ! -f "$${marker}" ]; }; then
          echo "Unsafe owner marker: $${marker} must be a regular file" >&2
          exit 1
        fi
        if ! grep -qx "$${owner}" "$${marker}" 2>/dev/null; then
          chown -R --no-dereference "$${owner}" /mo-data
          printf '%s\n' "$${owner}" > "$${marker}"
          chown "$${owner}" "$${marker}"
        fi
        mkdir -p /mo-logs
        chown "$${owner}" /mo-logs
    volumes:
      - matrixone-data:/mo-data
      - ${MATRIXONE_LOG_DIR:-./data/matrixone/logs}:/mo-logs
    networks:
      - mo-net
    restart: "no"

  matrixone:
    image: ${MATRIXONE_IMAGE:?Set MATRIXONE_IMAGE in deployment/all-in-one/.env}
    hostname: matrixone
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      matrixone-init:
        condition: service_completed_successfully
    entrypoint: /entrypoint.sh
    command: []
    ports:
      - "${ASTRA_BIND_ADDRESS:-127.0.0.1}:${MATRIXONE_PORT:-26001}:6001"
      - "${ASTRA_BIND_ADDRESS:-127.0.0.1}:${MATRIXONE_DEBUG_HTTP_PORT:-26060}:6060"
    volumes:
      - matrixone-data:/mo-data
      - ${MATRIXONE_LOG_DIR:-./data/matrixone/logs}:/mo-logs
      - ./matrixone-entrypoint.sh:/entrypoint.sh:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - mo-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:6060/debug/vars"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  memoria-init:
    image: ${MEMORIA_IMAGE:?Set MEMORIA_IMAGE in deployment/all-in-one/.env}
    user: root
    environment:
      HOST_UID: ${UID:-1000}
      HOST_GID: ${GID:-1000}
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        case "$${HOST_UID}" in ''|*[!0-9]*) echo "UID must be numeric" >&2; exit 1;; esac
        case "$${HOST_GID}" in ''|*[!0-9]*) echo "GID must be numeric" >&2; exit 1;; esac
        owner="$${HOST_UID}:$${HOST_GID}"
        mkdir -p /var/log/memoria
        marker=/var/log/memoria/.astra-owner
        log_file=/var/log/memoria/api.log
        for path in "$${marker}" "$${log_file}"; do
          if [ -L "$${path}" ] || { [ -e "$${path}" ] && [ ! -f "$${path}" ]; }; then
            echo "Unsafe log path: $${path} must be a regular file" >&2
            exit 1
          fi
        done
        if ! grep -qx "$${owner}" "$${marker}" 2>/dev/null; then
          chown -R --no-dereference "$${owner}" /var/log/memoria
          printf '%s\n' "$${owner}" > "$${marker}"
        fi
        # The marker avoids a recursive scan on every start, while these
        # inexpensive repairs handle a log file recreated by root later.
        chown "$${owner}" /var/log/memoria "$${marker}"
        if [ -e "$${log_file}" ]; then
          chown "$${owner}" "$${log_file}"
        fi
    volumes:
      - ${MEMORIA_LOG_DIR:-./data/logs/memoria}:/var/log/memoria
    network_mode: none
    restart: "no"

  memoria:
    image: ${MEMORIA_IMAGE:?Set MEMORIA_IMAGE in deployment/all-in-one/.env}
    hostname: memoria
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${ASTRA_BIND_ADDRESS:-127.0.0.1}:${MEMORIA_PORT:-8100}:8100"
    volumes:
      - ${MEMORIA_LOG_DIR:-./data/logs/memoria}:/var/log/memoria
    environment:
      RUST_LOG: ${MEMORIA_RUST_LOG:-info}
      DATABASE_URL: mysql://${MATRIXONE_USER:-root}:${MATRIXONE_PASSWORD:-111}@matrixone:6001/${MEMORIA_DB_NAME:-memoria}
      MASTER_KEY: ${MEMORIA_MASTER_KEY:?Set MEMORIA_MASTER_KEY in deployment/all-in-one/.env}
      EMBEDDING_PROVIDER: ${MEMORIA_EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${MEMORIA_EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIM: ${MEMORIA_EMBEDDING_DIM:-1024}
      EMBEDDING_API_KEY: ${MEMORIA_EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${MEMORIA_EMBEDDING_BASE_URL:-}
      EMBEDDING_ENDPOINTS: ${MEMORIA_EMBEDDING_ENDPOINTS:-}
      LLM_API_KEY: ${MEMORIA_LLM_API_KEY:-}
      LLM_BASE_URL: ${MEMORIA_LLM_BASE_URL:-}
      LLM_MODEL: ${MEMORIA_LLM_MODEL:-gpt-4o-mini}
      ENTITY_WORKER_COUNT: ${ENTITY_WORKER_COUNT:-4}
      ENTITY_POOL_SIZE: ${ENTITY_POOL_SIZE:-8}
      ENTITY_QUEUE_SIZE: ${ENTITY_QUEUE_SIZE:-512}
      MEMORIA_INSTANCE_ID: ${MEMORIA_INSTANCE_ID:-}
      MEMORIA_LOCK_TTL_SECS: ${MEMORIA_LOCK_TTL_SECS:-120}
      MEMORIA_GOVERNANCE_ENABLED: ${MEMORIA_GOVERNANCE_ENABLED:-false}
      MEMORIA_GOVERNANCE_PLUGIN_BINDING: ${MEMORIA_GOVERNANCE_PLUGIN_BINDING:-default}
      MEMORIA_GOVERNANCE_PLUGIN_SUBJECT: ${MEMORIA_GOVERNANCE_PLUGIN_SUBJECT:-system}
      MEMORIA_API_KEY_SECRET: ${MEMORIA_API_KEY_SECRET:-}
      MEMORIA_RATE_LIMIT_AUTH_KEYS: ${MEMORIA_RATE_LIMIT_AUTH_KEYS:-1000,60}
    depends_on:
      matrixone:
        condition: service_healthy
      memoria-init:
        condition: service_completed_successfully
    networks:
      - mo-net
    healthcheck:
      # The Memoria image has Bash but no curl/wget. Probe the real HTTP
      # boundary so Compose does not treat a process that has not bound its
      # listener yet as ready.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8100 && printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -n 1 <&3 | grep -qE '^HTTP/1\\.[01] 200 '",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  api:
    image: ${ASTRA_IMAGE:?Set ASTRA_IMAGE in deployment/all-in-one/.env}
    hostname: api
    command: ["astra-server"]
    env_file: *astra-env-files
    ports:
      # ASTRA_API_PORT is the host-facing port. The container listens on 17001.
      - "${ASTRA_BIND_ADDRESS:-127.0.0.1}:${ASTRA_API_PORT:-17001}:17001"
    environment:
      RUST_LOG: ${ASTRA_RUST_LOG:-info}
      ASTRA_API_HOST: 0.0.0.0
      ASTRA_API_PORT: 17001
      ASTRA_CORS_ORIGINS: ${ASTRA_CORS_ORIGINS:-}
      ASTRA_ALLOW_INSECURE_DEFAULTS: ${ASTRA_ALLOW_INSECURE_DEFAULTS:-0}
      ASTRA_AUTO_CREATE_DATABASE: ${ASTRA_AUTO_CREATE_DATABASE:-1}
      ASTRA_DATABASE_BOOTSTRAP_CATALOG: ${ASTRA_DATABASE_BOOTSTRAP_CATALOG:-mysql}
      MATRIXONE_HOST: matrixone
      MATRIXONE_PORT: 6001
      MATRIXONE_USER: ${MATRIXONE_USER:-root}
      MATRIXONE_PASSWORD: ${MATRIXONE_PASSWORD:-111}
      ASTRA_DATABASE: ${ASTRA_DATABASE:-astra_runtime}
      ASTRA_DATABASE_PREFIX: ${ASTRA_DATABASE_PREFIX:-}
      ASTRA_JWT_SECRET: ${ASTRA_JWT_SECRET:?Set ASTRA_JWT_SECRET in deployment/all-in-one/.env}
      ASTRA_JWT_ALGORITHM: ${ASTRA_JWT_ALGORITHM:-HS256}
      ASTRA_JWT_ACCESS_TTL_MINUTES: ${ASTRA_JWT_ACCESS_TTL_MINUTES:-60}
      ASTRA_JWT_REFRESH_TTL_DAYS: ${ASTRA_JWT_REFRESH_TTL_DAYS:-7}
      ASTRA_TOKEN_ENCRYPTION_KEY: ${ASTRA_TOKEN_ENCRYPTION_KEY:?Set ASTRA_TOKEN_ENCRYPTION_KEY in deployment/all-in-one/.env}
      ASTRA_RUNTIME_ROOT_SECRET: ${ASTRA_RUNTIME_ROOT_SECRET:?Set ASTRA_RUNTIME_ROOT_SECRET in deployment/all-in-one/.env}
      # Released images before the runtime-root rename still read this name.
      # Keep one operator-facing secret and translate only at the image boundary.
      ASTRA_BRIDGE_SECRET: ${ASTRA_RUNTIME_ROOT_SECRET:?Set ASTRA_RUNTIME_ROOT_SECRET in deployment/all-in-one/.env}
      MEMORIA_BASE_URL: http://memoria:8100
      MEMORIA_MASTER_KEY: ${MEMORIA_MASTER_KEY:?Set MEMORIA_MASTER_KEY in deployment/all-in-one/.env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      matrixone:
        condition: service_healthy
      memoria:
        condition: service_healthy
    networks:
      - mo-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:17001/ready",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  mo-net:
    driver: bridge

volumes:
  matrixone-data:
    name: ${MATRIXONE_DATA_VOLUME:-astra-matrixone-data}
