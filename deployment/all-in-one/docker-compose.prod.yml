# Astra single-host production profile.
#
# This profile runs only published Astra and Nginx images. MatrixOne and
# Memoria are external managed services supplied through .env.production.
#
# Usage from this directory:
#   docker compose --env-file ../../.env.production \
#     -f docker-compose.prod.yml up -d --scale api=3

services:
  api:
    image: ${ASTRA_IMAGE:?Set ASTRA_IMAGE to an immutable release tag or digest}
    command: ["astra-server"]
    environment:
      MATRIXONE_HOST: ${MATRIXONE_HOST:?Set MATRIXONE_HOST}
      MATRIXONE_PORT: ${MATRIXONE_PORT:-6001}
      MATRIXONE_USER: ${MATRIXONE_USER:?Set MATRIXONE_USER}
      MATRIXONE_PASSWORD: ${MATRIXONE_PASSWORD:?Set MATRIXONE_PASSWORD}
      ASTRA_DATABASE: ${ASTRA_DATABASE:-astra_runtime}
      ASTRA_DATABASE_PREFIX: ${ASTRA_DATABASE_PREFIX:-}
      ASTRA_JWT_SECRET: ${ASTRA_JWT_SECRET:?Set ASTRA_JWT_SECRET}
      ASTRA_JWT_ALGORITHM: ${ASTRA_JWT_ALGORITHM:-HS256}
      ASTRA_JWT_ACCESS_TTL_MINUTES: ${ASTRA_JWT_ACCESS_TTL_MINUTES:-60}
      ASTRA_JWT_REFRESH_TTL_DAYS: ${ASTRA_JWT_REFRESH_TTL_DAYS:-7}
      ASTRA_TOKEN_ENCRYPTION_KEY: ${ASTRA_TOKEN_ENCRYPTION_KEY:?Set ASTRA_TOKEN_ENCRYPTION_KEY}
      ASTRA_RUNTIME_ROOT_SECRET: ${ASTRA_RUNTIME_ROOT_SECRET:?Set ASTRA_RUNTIME_ROOT_SECRET}
      # Compatibility input for immutable releases from before the runtime-root rename.
      ASTRA_BRIDGE_SECRET: ${ASTRA_RUNTIME_ROOT_SECRET:?Set ASTRA_RUNTIME_ROOT_SECRET}
      ASTRA_CORS_ORIGINS: ${ASTRA_CORS_ORIGINS:?Set ASTRA_CORS_ORIGINS}
      ASTRA_ALLOW_INSECURE_DEFAULTS: "0"
      ASTRA_API_HOST: 0.0.0.0
      ASTRA_API_PORT: 17001
      MEMORIA_BASE_URL: ${MEMORIA_BASE_URL:?Set MEMORIA_BASE_URL}
      MEMORIA_MASTER_KEY: ${MEMORIA_MASTER_KEY:?Set MEMORIA_MASTER_KEY}
      RUST_LOG: ${RUST_LOG:-warn,astra_runtime=info}
    expose:
      - "17001"
    networks:
      - astra
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:17001/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.30.4-alpine}
    ports:
      - "${ASTRA_PUBLIC_BIND_ADDRESS:-0.0.0.0}:${ASTRA_PUBLIC_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - astra
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  astra:
    driver: bridge
