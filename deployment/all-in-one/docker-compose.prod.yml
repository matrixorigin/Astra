# astra Production Docker Compose
#
# Production-ready configuration with:
# - Resource limits
# - Health checks
# - Restart policies
# - Logging configuration
# - Multiple API replicas
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#   docker-compose -f docker-compose.prod.yml up -d --scale api=3

version: '3.8'

services:

  # ─── Database ─────────────────────────────────────────────

  matrixone:
    image: ${MATRIXONE_IMAGE:-matrixorigin/matrixone:latest}
    hostname: matrixone
    command: ["/mo-service", "-launch", "/etc/quickstart/launch.toml"]
    ports:
      - "${MATRIXONE_PORT:-6001}:6001"
    volumes:
      - mo-data:/mo-data
    environment:
      - TZ=Asia/Shanghai
    networks:
      - mo-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:6060/debug/vars"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── API Server ───────────────────────────────────────────

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: astra:latest
    environment:
      # Database
      - MATRIXONE_HOST=matrixone
      - MATRIXONE_PORT=6001
      - MATRIXONE_USER=${MATRIXONE_USER:-root}
      - MATRIXONE_PASSWORD=${MATRIXONE_PASSWORD}
      - ASTRA_DATABASE=${ASTRA_DATABASE:-astra_runtime}
      - ASTRA_DATABASE_PREFIX=${ASTRA_DATABASE_PREFIX:-}

      # Auth / security
      - ASTRA_JWT_SECRET=${ASTRA_JWT_SECRET}
      - ASTRA_JWT_ALGORITHM=${ASTRA_JWT_ALGORITHM:-HS256}
      - ASTRA_JWT_ACCESS_TTL_MINUTES=${ASTRA_JWT_ACCESS_TTL_MINUTES:-60}
      - ASTRA_JWT_REFRESH_TTL_DAYS=${ASTRA_JWT_REFRESH_TTL_DAYS:-7}
      - ASTRA_TOKEN_ENCRYPTION_KEY=${ASTRA_TOKEN_ENCRYPTION_KEY}
      - ASTRA_BRIDGE_SECRET=${ASTRA_BRIDGE_SECRET}

      # LLM models are configured server-side (infra_llm_models table) via
      # `astra-admin model add/check`; no env vars needed.

      # Memoria
      - MEMORIA_BASE_URL=${MEMORIA_BASE_URL:-http://memoria:8100}
      - MEMORIA_MASTER_KEY=${MEMORIA_MASTER_KEY}

      # API
      - ASTRA_API_HOST=0.0.0.0
      - ASTRA_API_PORT=8000
      - ASTRA_CORS_ORIGINS=${ASTRA_CORS_ORIGINS:-*}

    ports:
      - "${ASTRA_API_PORT:-8000}:8000"

    networks:
      - mo-net

    depends_on:
      matrixone:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: always

    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Nginx Load Balancer ──────────────────────────────────

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - mo-net
    depends_on:
      - api
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ─── Networks ─────────────────────────────────────────────────

networks:
  mo-net:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────

volumes:
  mo-data:
    driver: local
