apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: astra
    component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: astra
      component: api
  template:
    metadata:
      {{- if .Values.api.serverConfig.enabled }}
      annotations:
        checksum/server-config: {{ .Values.api.serverConfig.content | sha256sum }}
      {{- end }}
      labels:
        app: astra
        component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: api
        {{- if .Values.api.image.digest }}
        image: "{{ .Values.api.image.repository }}@{{ .Values.api.image.digest }}"
        {{- else }}
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
        {{- end }}
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        command: ["astra-server"]
        securityContext:
          {{- toYaml .Values.api.securityContext | nindent 10 }}
        ports:
        - containerPort: {{ .Values.api.port }}
          name: http
        env:
        - name: ASTRA_API_HOST
          value: "0.0.0.0"
        - name: ASTRA_API_PORT
          value: "{{ .Values.api.port }}"
        {{- range $key, $val := .Values.api.env }}
        - name: {{ $key }}
          value: "{{ $val }}"
        {{- end }}
        envFrom:
        - secretRef:
            name: {{ required "api.existingSecret is required" .Values.api.existingSecret }}
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /live
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
        {{- if .Values.api.serverConfig.enabled }}
        volumeMounts:
        - name: server-config
          mountPath: /etc/astra/server.toml
          subPath: server.toml
          readOnly: true
        {{- end }}
      {{- if .Values.api.serverConfig.enabled }}
      volumes:
      - name: server-config
        configMap:
          name: {{ .Release.Name }}-api-server-config
          items:
          - key: server.toml
            path: server.toml
      {{- end }}
---
{{- if .Values.api.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-api-hpa
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-api
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.api.hpa.targetCPUUtilization }}
{{- end }}
