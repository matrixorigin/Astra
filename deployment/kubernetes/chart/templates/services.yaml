apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: astra
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.api.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: astra
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: server
