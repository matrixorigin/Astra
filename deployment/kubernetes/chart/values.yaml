# Astra Server image. An empty tag uses Chart.appVersion.
api:
  replicas: 2
  image:
    repository: matrixorigin/astra
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  port: 17001

  # Name of an existing Secret whose keys are exposed to astra-server as
  # environment variables. See deployment/kubernetes/README.md for the
  # required keys. The chart deliberately does not create or store secrets.
  existingSecret: ""

  # Non-sensitive environment overrides only. Put credentials in
  # api.existingSecret instead of committing them to values files.
  env: {}

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  serverConfig:
    enabled: false
    content: ""

imagePullSecrets: []
