# TrustMem Cloud v1 — All-in-One
#
# Build context is the project root (TrustMem depends on core/ and api/ shared files).
# Both invocation styles work — context: .. is always relative to this file's location.
#
# Usage:
#   cd trustmem_cloud_v1 && docker compose up -d
#   # or: docker compose -f trustmem_cloud_v1/docker-compose.yml up -d

services:

  matrixone:
    image: ${MATRIXONE_IMAGE:-matrixorigin/matrixone:latest}
    hostname: matrixone
    ports:
      - "${MATRIXONE_PORT:-6001}:6001"
      # Debug HTTP port (pprof) — disabled by default, set MATRIXONE_DEBUG_PORT to enable
      - "${MATRIXONE_DEBUG_PORT:-}:6060"
    volumes:
      - ${MATRIXONE_DATA_DIR:-./data/matrixone}:/mo-data
    environment:
      - TZ=Asia/Shanghai
    networks:
      - trustmem-net
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'echo > /dev/tcp/127.0.0.1/6001' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: trustmem_cloud_v1/Dockerfile
      args:
        # Set INSTALL_EXTRAS=local-embedding to bundle sentence-transformers (~500MB).
        # Default is empty — use an external embedding provider via TRUSTMEM_EMBEDDING_* env vars.
        INSTALL_EXTRAS: ${INSTALL_EXTRAS:-}
    hostname: trustmem-api
    ports:
      - "${API_PORT:-8100}:8000"
    environment:
      - TRUSTMEM_DB_HOST=matrixone
      - TRUSTMEM_DB_PORT=6001
      - TRUSTMEM_DB_USER=${TRUSTMEM_DB_USER:-root}
      - TRUSTMEM_DB_PASSWORD=${TRUSTMEM_DB_PASSWORD:-111}
      - TRUSTMEM_DB_NAME=${TRUSTMEM_DB_NAME:-trustmem}
      - TRUSTMEM_MASTER_KEY=${TRUSTMEM_MASTER_KEY:?Set TRUSTMEM_MASTER_KEY in .env (min 16 chars)}
      - TRUSTMEM_EMBEDDING_PROVIDER=${TRUSTMEM_EMBEDDING_PROVIDER:-local}
      - TRUSTMEM_EMBEDDING_MODEL=${TRUSTMEM_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - TRUSTMEM_EMBEDDING_API_KEY=${TRUSTMEM_EMBEDDING_API_KEY:-}
      - TRUSTMEM_EMBEDDING_BASE_URL=${TRUSTMEM_EMBEDDING_BASE_URL:-}
      # Rate limits — override for testing: TRUSTMEM_RATE_LIMIT_AUTH_KEYS=1000,60
      - TRUSTMEM_RATE_LIMIT_AUTH_KEYS=${TRUSTMEM_RATE_LIMIT_AUTH_KEYS:-20,60}
      - TRUSTMEM_RATE_LIMIT_DEFAULT=${TRUSTMEM_RATE_LIMIT_DEFAULT:-1000,60}
    depends_on:
      matrixone:
        condition: service_healthy
    networks:
      - trustmem-net
    restart: unless-stopped

volumes: {}

networks:
  trustmem-net:
    driver: bridge
