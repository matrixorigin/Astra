# Prometheus alert rules for metrics exported by Astra's `/metrics` endpoint.

groups:
  - name: astra-runtime
    interval: 30s
    rules:
      - alert: AstraServiceDown
        expr: up{job="astra-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Astra service is down
          description: Prometheus has been unable to scrape Astra for more than one minute.

      - alert: AstraEventIngestionErrors
        expr: sum(increase(astra_event_ingestion_errors_total[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Astra event ingestion is failing
          description: "{{ $value }} event ingestion errors occurred in the last five minutes."

      - alert: AstraEventIngestionDrops
        expr: sum(increase(astra_event_ingestion_events_dropped_permanent_total[5m])) + sum(increase(astra_event_ingestion_events_dropped_before_acceptance_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: Astra is dropping durable events
          description: "{{ $value }} events were dropped in the last five minutes."

      - alert: AstraEventIngestionQueueOverflow
        expr: sum(increase(astra_event_ingestion_enqueue_overflows_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: Astra event ingestion queue overflowed
          description: "{{ $value }} enqueue attempts overflowed in the last five minutes."

      - alert: AstraEdgeDispatchFailures
        expr: sum(increase(astra_edge_dispatch_failed_total[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Astra Edge dispatch is failing
          description: "{{ $value }} Edge dispatches failed in the last five minutes."

      - alert: AstraEdgeDispatchTimeouts
        expr: sum(increase(astra_edge_dispatch_wait_result_timeouts_total[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Astra Edge dispatches are timing out
          description: "{{ $value }} Edge result waits timed out in the last five minutes."

      - alert: AstraTaskLeaseRenewalFailures
        expr: sum(increase(astra_task_lease_renewal_failure_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: Astra task lease renewal is failing
          description: "{{ $value }} task lease renewals failed in the last five minutes."

      - alert: AstraMultiAgentEventOverflow
        expr: sum(increase(astra_multi_agent_event_overflow_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: Astra multi-agent event buffer overflowed
          description: "{{ $value }} multi-agent events overflowed in the last five minutes."

      - alert: AstraRunControlPollErrors
        expr: sum(increase(astra_run_control_poll_errors_total[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Astra run-control polling is failing
          description: "{{ $value }} run-control poll errors occurred in the last five minutes."
