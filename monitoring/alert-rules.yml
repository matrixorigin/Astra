# Prometheus Alert Rules for mo-agent-engine

groups:
  - name: mo_dev_agent_alerts
    interval: 30s
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"
      
      # Slow response time
      - alert: SlowResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow response time"
          description: "P95 response time is {{ $value }}s (threshold: 2s)"
      
      # High LLM cost
      - alert: HighLLMCost
        expr: rate(llm_cost_total[1h]) * 3600 > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High LLM cost"
          description: "LLM cost is ${{ $value }}/hour (threshold: $10/hour)"
      
      # Database connection pool exhausted
      - alert: DatabasePoolExhausted
        expr: db_connections_active >= db_connections_max * 0.9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool near exhaustion"
          description: "{{ $value }} connections active (90% of max)"
      
      # Low cache hit rate
      - alert: LowCacheHitRate
        expr: rate(cache_hits_total[5m]) / (rate(cache_hits_total[5m]) + rate(cache_misses_total[5m])) < 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value | humanizePercentage }} (threshold: 50%)"
      
      # Service down
      - alert: ServiceDown
        expr: up{job="mo-agent-engine"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service is down"
          description: "mo-agent-engine service is not responding"
      
      # High memory usage
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 / 1024 > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}GB (threshold: 2GB)"
      
      # Skill execution failures
      - alert: SkillExecutionFailures
        expr: rate(skill_executions_total{status="failed"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High skill execution failure rate"
          description: "Skill failure rate is {{ $value | humanizePercentage }}"
      
      # Context assembly slow
      - alert: SlowContextAssembly
        expr: histogram_quantile(0.95, rate(context_assembly_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow context assembly"
          description: "P95 context assembly time is {{ $value }}s (threshold: 0.5s)"
      
      # Replay failures
      - alert: ReplayFailures
        expr: rate(replay_executions_total{status="failed"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Replay execution failures detected"
          description: "Replay failure rate: {{ $value }}"
