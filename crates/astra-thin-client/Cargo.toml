[package]
name = "astra-thin-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Stateless HTTP + SSE client for the Astra thin client protocol"

[dependencies]
astra-core.workspace = true
astra-runtime-env.workspace = true
astra-server-types = { workspace = true, default-features = false }
astra-sync-protocol.workspace = true
astra-turn-types.workspace = true
async-stream = { workspace = true }
base64.workspace = true
chrono.workspace = true
futures-util = { workspace = true }
hex = { workspace = true }
hmac.workspace = true
percent-encoding.workspace = true
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }
wiremock = "0.6"
