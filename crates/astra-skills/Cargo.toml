[package]
name = "astra-skills"
version = "0.1.0"
edition = "2024"
description = "Skill framework types and providers for Astra"

[dependencies]
# Core serialization
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["io-util", "fs", "time"] }
async-trait = { workspace = true }

# Logging
tracing = { workspace = true }

# Hashing
sha2 = { workspace = true }

# Filesystem
walkdir = "2.5"
dirs = "5"

# YAML for manifest parsing
serde_yaml_ng.workspace = true


# TOML for manifest parsing
toml = "1.1.2"

# Tar/gzip for packing
flate2 = { workspace = true }
tar = { workspace = true }

# HTTP types (for database provider error handling)
axum = { workspace = true }

# Service integration
astra-services = { path = "../services" }
astra-core = { path = "../core" }

# Crash recovery (optional)
astra-pipeline = { path = "../astra-pipeline", optional = true }

[features]
crash-recovery = ["astra-pipeline"]

[dev-dependencies]
astra-core = { path = "../core", features = ["dev-defaults"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"
