[package]
name = "astra-skills"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Skill framework types and providers for Astra"

[dependencies]
# Core serialization
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["io-util", "fs", "time"] }
async-trait = { workspace = true }

# Logging
tracing = { workspace = true }

# Hashing
sha2 = { workspace = true }

# Filesystem
walkdir = "2.5"
dirs = { workspace = true }

# YAML for manifest parsing
serde_yaml_ng.workspace = true


# TOML for manifest parsing
toml = { workspace = true }

# Tar/gzip for packing
flate2 = { workspace = true }
tar = { workspace = true }

# HTTP types (for database provider error handling)
axum = { workspace = true }

# Service integration
astra-services.workspace = true
astra-core.workspace = true
astra-runtime-env.workspace = true

# Crash recovery (optional)
astra-pipeline = { workspace = true, optional = true }

[features]
crash-recovery = ["astra-pipeline"]

[dev-dependencies]
astra-core = { workspace = true, features = ["dev-defaults"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile.workspace = true
