[package]
name = "astra-edge"
version.workspace = true
edition.workspace = true
description = "Lightweight remote edge agent that connects to an Astra server via WebSocket for local tool execution"

[features]
default = []
otel = ["astra-logging/otel"]

[[bin]]
name = "astra-edge"
path = "src/main.rs"

[dependencies]
astra-logging.workspace = true
clap = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "signal", "time"] }
tokio-util.workspace = true
tokio-tungstenite = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
hostname = { workspace = true }
fastrand = "2"
fs2 = "0.4"
reqwest = { workspace = true }
astra-runtime-env.workspace = true
astra-credentials.workspace = true
astra-tools = { path = "../astra-tools" }
astra-server-types.workspace = true
astra-turn-types.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
