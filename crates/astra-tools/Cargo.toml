[package]
name = "astra-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Extracted tool execution library for astra-engine. Shared by CLI and server."

[dependencies]
astra-core.workspace = true
astra-memoria.workspace = true
astra-prompts.workspace = true
astra-sandbox = { path = "../astra-sandbox" }
astra-services.workspace = true
astra-turn-types = { path = "../astra-turn-types" }
async-trait.workspace = true
chrono.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
base64.workspace = true
tokio.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
url = "2.5"
scraper = "0.27"
futures = "0.3"
fs2.workspace = true
hex.workspace = true

# Git operations (gix)
gix = { version = "0.85.0", features = ["status", "blame", "mailmap", "revision"] }

# Code intelligence (tree-sitter)
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"

# System (process control, file ops). `signal` gives us killpg(2) so we can
# SIGKILL an entire process group without fork-execing `/usr/bin/kill`.
nix.workspace = true
libc.workspace = true
dirs = "6.0.0"
tempfile = "3"
which = "7"

[dev-dependencies]
serde_json.workspace = true
serial_test = "3"
tracing-subscriber.workspace = true
wiremock = "0.6"

[features]
default = []
# Enable CLI-specific tool features (MCP dispatch, passive LSP, colored output)
cli = []
# Enable integration tests that require python3 on the system
python_tests = []
# Enable integration tests that require cgroup v2 + write access to
# /sys/fs/cgroup (usually means running as root or a systemd-delegated
# subtree). CI without this is fine — these tests are #[ignore]'d.
cgroup_tests = []
