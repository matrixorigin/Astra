[package]
name = "astra-services"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
openssl-vendored = ["dep:openssl", "openssl/vendored"]
e2e-hooks = []
# External services are not provisioned by the ordinary MatrixOne CI lanes.
external-contract-tests = []

[[test]]
name = "memoria_live_contract_it"
required-features = ["external-contract-tests"]

[[test]]
name = "byok_live_network"
required-features = ["external-contract-tests"]

[[test]]
name = "user_model_probe_db_it"
required-features = ["external-contract-tests"]

[dependencies]
astra-config.workspace = true
astra-core.workspace = true
astra-inference-adapter.workspace = true
astra-logging.workspace = true
astra-runtime-env.workspace = true
astra-turn-types.workspace = true
astra-sync-protocol.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bcrypt.workspace = true
chrono = { workspace = true, features = ["serde"] }
fernet.workspace = true
flate2.workspace = true
futures-util.workspace = true
hmac.workspace = true
jsonwebtoken.workspace = true
regex.workspace = true
reqwest.workspace = true
hickory-resolver = { version = "0.26.1", default-features = false, features = ["system-config", "tokio"] }
rustls.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["chrono"] }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
unicode-segmentation = "1.12"
dirs = "6.0.0"
fastrand = "2"
fs2 = "0.4.3"
libc.workspace = true
# `fernet` depends on `openssl` but does not expose its vendored feature.
# The release workflow enables this optional dependency for musl CLI builds.
openssl = { version = "0.10.79", optional = true }

[dev-dependencies]
rcgen = "0.13.2"
dotenvy.workspace = true
astra-core = { workspace = true, features = ["dev-defaults"] }
filetime = "0.2"
serde_json.workspace = true
serial_test = { version = "3", features = ["file_locks"] }
sqlx = { workspace = true, features = ["chrono"] }
tempfile = "3"
# `test-util` enables virtual-time `start_paused` so timeout/retry tests
# don't wait real seconds.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "test-util"] }
uuid.workspace = true
