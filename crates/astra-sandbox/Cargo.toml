[package]
name = "astra-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Security boundary enforcement for Astra agent tool execution"

[dependencies]
# Core serialization
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["process", "io-util", "time"] }
tokio-util.workspace = true

# Logging
tracing = { workspace = true }

# AST parsing for bash safety
tree-sitter = "0.24"
tree-sitter-bash = "0.25"

# UUID for isolation namespaces
uuid = { workspace = true }
libc.workspace = true

# Skill types (for TrustTier)
astra-skills = { workspace = true }

# Session ID validation — single source of truth for journal filename checks.
# Avoids the drift between `looks_like_session_journal_file` (alphanumeric
# allowlist) and the canonical `astra_core::session_id::validate`.
astra-core = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile.workspace = true
temp-env.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true
