[package]
name = "astra-turn-types"
version = "0.1.0"
edition = "2024"
description = "Core turn types for astra runtime"

[dependencies]
# Canonical source of the memory-protocol layer constants
# (ABSTRACT_MIN/MAX_CHARS, LAYER_SEP_*). Re-exported through this
# crate so callers can use either `astra_turn_types::memory_structure`
# or `astra_prompts::memory_proto` without drift.
astra-prompts = { path = "../astra-prompts" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
thiserror = { workspace = true }
