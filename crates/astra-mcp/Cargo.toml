[package]
name = "astra-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Shared MCP client library for Astra CLI and runtime"

[dependencies]
astra-core.workspace = true
astra-turn-core.workspace = true
astra-turn-types.workspace = true
rmcp = { version = "1.3", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-async-rw",
] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }
tokio-util.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures-util.workspace = true
reqwest.workspace = true
rmcp-http = { package = "reqwest", version = "0.13.2", default-features = false, features = ["json", "stream", "rustls"] }
bytes = "1"
sse-stream = "0.2.6"
tokio-tungstenite.workspace = true
sha2.workspace = true
chrono.workspace = true

[dev-dependencies]
axum.workspace = true
