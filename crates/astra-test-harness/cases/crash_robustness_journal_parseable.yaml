name: crash_robustness_journal_parseable
description: |
  **What**: Run a clean session with debug_log and verify all journal lines parse without skips or crashes.
  **Tests**: Journal robustness — the session loader must handle every line it wrote, with zero silent drops.
  **Why**: Guards against malformed journal lines that silently corrupt session replay or crash the analyzer, which would break post-hoc debugging.
  **Pass means**: Every journal line round-trips cleanly through the parser and at least one StepCompleted event is emitted.
  **Fail means**: Runtime wrote unparseable journal lines (serialization regression) or the loader silently dropped events.
prompt: |
  List the files in the current directory with list_dir. Reply with
  "scan-complete" in your final answer.
debug_log: true
timeout_seconds: 120
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: list_dir
  - type: text_contains
    needle: "scan-complete"
  # The harness's SessionCapture exposes `skipped_lines` in its
  # debug string but not as a direct criterion. We proxy by asking
  # for a strictly positive event count — if the journal were
  # unparseable we'd see 0 events.
  #
  # Layout note: real `astra chat --json` runs on this deployment
  # write ONLY the step-events layout (`<id>/step_events.jsonl`).
  # The legacy layout (`<id>.jsonl` with `llm_round`) is gated
  # behind `full_llm_capture` / `astra session trace on` and is
  # NOT produced by a plain chat invocation. Count `StepCompleted`
  # — the step-events analogue of `llm_round` that fires exactly
  # once per completed turn.
  - type: session_event_count
    event_type: StepCompleted
    min: 1
