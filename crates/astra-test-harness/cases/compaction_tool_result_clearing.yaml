name: compaction_tool_result_clearing
description: |
  **What**: Accumulate tool results over several real user turns under a bounded
  input budget, then verify the agent still recalls content from the MOST RECENT batch.
  **Tests**: Pressure-adaptive message compaction while recent tool context remains
  available across real user-turn persistence and restoration.
  **Why**: Message compaction and tool-result clearing keep long sessions under context
  limits. If either breaks tool_use/tool_result pairing or drops recent results, the
  agent loses coherence and starts re-reading files.
  **Pass means**: Agent recalls content from the final read batch after 8 tool calls
  without re-reading, and a real CompactionFired event proves clearing actually occurred.
  **Fail means**: Compaction broke message pairing (crash/error), or agent lost recent
  state and had to re-read.
prompt: |
  Call read_file exactly twice, once for each exact path below. Do not call
  any other tool and do not discover alternative paths:
  1. Cargo.toml
  2. crates/core/Cargo.toml
  After both reads, reply with exactly batch-1-done.
steps:
  - prompt: |
      Call read_file exactly twice, once for each exact path below. Do not call
      any other tool and do not discover alternative paths:
      1. crates/runtime/Cargo.toml
      2. crates/astra-cli/Cargo.toml
      After both reads, reply with exactly batch-2-done.
  - prompt: |
      Call read_file exactly twice, once for each exact path below. Do not call
      any other tool and do not discover alternative paths:
      1. crates/astra-tools/Cargo.toml
      2. crates/services/Cargo.toml
      After both reads, reply with exactly batch-3-done.
  - prompt: |
      Call read_file exactly twice, once for each exact path below. Do not call
      any other tool and do not discover alternative paths:
      1. crates/astra-turn-core/Cargo.toml
      2. Makefile
      After both reads, reply with exactly batch-4-done.
  - prompt: |
      Without calling any tool or re-reading a file, answer from the existing
      conversation: what package name is defined in
      crates/astra-turn-core/Cargo.toml?
capability: tool_use
difficulty: 3
weight: 2.0
timeout_seconds: 180
env:
  # <=32K uses the model-adaptive 70% pre-turn compaction threshold. The
  # observed scenario is ~21K tokens before clearing, so 28K supplies real
  # pressure while retaining several thousand tokens of safety headroom.
  ASTRA_MAX_TURN_INPUT_TOKENS: "28000"
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: read_file
  - type: text_contains
    needle: astra-turn-core
  # Efficiency is part of correctness here: a final correct answer after
  # path-discovery or re-read loops does not validate context retention.
  - type: all_of
    criteria:
      - type: tools_count_between
        min: 8
        max: 8
      - type: turn_rounds_between
        min: 5
        max: 15
  - type: session_event_count
    event_type: CompactionFired
    min: 1
  - type: judger
    question: |
      Across several turns the agent read 8 files and then had to recall the
      package name from crates/astra-turn-core/Cargo.toml WITHOUT re-reading.
      Did the agent correctly state "astra-turn-core" as the package name?
      Score 1.0 if correct, 0.5 if close but wrong, 0.0 if the agent
      re-read the file or didn't answer.
    threshold: 0.7
