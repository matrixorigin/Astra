name: changed_command_evidence_recovery
description: |
  A failed approach and a later successful approach serve the same read-only
  verification target. Preserve the failure, assess the later direct evidence,
  and report the requested fact without retrying the unavailable command.
prompt: |
  Tell me the exact first line of README.md in this workspace.
  First make exactly one Bash call containing only `astra_missing_reader_probe_827 README.md`;
  do not chain, mask, or follow it with another command in that call.
  If that reader is unavailable, do not install it or retry it: in a separate
  later tool call use an available file-reading method to obtain the first
  line. Report the observed line and briefly note which approach worked.
timeout_seconds: 180
debug_log: true
criteria:
  - type: exit_code
    code: 0
  - type: final_state
    expect: completed
  - type: journal_tool_outcome_count
    name: bash
    ok: false
    min: 1
    max: 1
  - type: journal_tool_json_contains
    name: bash
    document: error
    path: ""
    contains: "command not found"
  - type: turn_rounds_between
    min: 3
    max: 10
  - type: text_not_contains
    needle: unresolved_tool_outcomes
  - type: hard_judger
    threshold: 0.9
    question: |
      Does the durable tool evidence show exactly one unavailable-reader probe,
      followed by a successful file read of README.md? Does the final answer
      quote its exact observed first line and identify the approach that worked?
      A guessed line, a different file, or a generic progress message fails.
