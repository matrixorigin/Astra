name: cache_prefix_provider_stable_system
description: |
  Four turns observing provider-reported cache reads across conversation turns.
  Every warm follow-up must report a positive cache read independently; an
  aggregate hit cannot hide a later zero or missing observation. Prompt size and
  provider quantization do not define a fixed token floor.
  This live case proves observed reuse, not high hit rate or stable system-prefix
  contents. Typed context-layout tests own prefix/volatile-lane correctness.
  Exact input cache-read ratio is a separate soft diagnostic; missing provider
  buckets remain unavailable rather than being treated as zero.
prompt: |
  Reply with the single word ACK. Do not call any tools.
capability: custom:cache
required_cache_scope: conversation_turns
difficulty: 2
weight: 1.0
timeout_seconds: 60
steps:
  - prompt: 'Reply with the single word ACK. Do not call any tools.'
    criteria:
      - type: all_of
        criteria:
          - type: prompt_cache_tokens
            min_read: 1
            min_creation: 0
      - type: provider_prompt_cache_read_ratio
        min: 0.80
        warmup_turns: 0
        warmup_rounds: 0
  - prompt: 'Reply with the single word ACK. Do not call any tools.'
    criteria:
      - type: all_of
        criteria:
          - type: prompt_cache_tokens
            min_read: 1
            min_creation: 0
      - type: provider_prompt_cache_read_ratio
        min: 0.80
        warmup_turns: 0
        warmup_rounds: 0
  - prompt: 'Reply with the single word ACK. Do not call any tools.'
    criteria:
      - type: all_of
        criteria:
          - type: prompt_cache_tokens
            min_read: 1
            min_creation: 0
      - type: provider_prompt_cache_read_ratio
        min: 0.80
        warmup_turns: 0
        warmup_rounds: 0
criteria:
  - type: exit_code
    code: 0
