name: multi_turn_context_retention
description: |
  **What**: 4-turn session exercising context retention + memory persistence + implicit preference recall.
  Turn 1: establish a transient fact. Turn 2: recall it (session continuity). Turn 3: store a
  separate, explicitly non-sensitive project fact to durable memory. Turn 4: state a preference
  and verify immediate conversational understanding without consulting persistent memory.
  **Tests**: Session state (--session-id), explicit memory_store, and LLM-driven preference recognition.
  **Why**: If context is lost between turns, multi-turn workflows break. If the agent can't persist
  facts to Memoria or recognize implicit preferences, the memory system degrades.
  **Pass means**: All 4 turns succeed — establish context, recall it, store a safe project fact,
  and surface a current-turn preference.
  **Fail means**: Session state dropped, memory not called, or preference not recognized.
prompt: |
  The secret code is ALPHA-7742. Acknowledge with a short sentence.
  Do not use any tools — just reply in text.
capability: memory
difficulty: 3
weight: 2.0
timeout_seconds: 240
cleanup_memory_records: true
steps:
  - prompt: "What was the secret code I told you earlier? Reply in text only, no tools."
    criteria:
      - type: text_contains
        needle: "ALPHA-7742"
  - prompt: |
      Store this non-sensitive project fact in persistent memory using memory:
      "The Astra integration sandbox label is ORBIT-42."
      Use memory_type "semantic".
    criteria:
      - type: tool_called
        name: memory
  - prompt: |
      I always prefer small focused PRs, one logical concern per PR.
      What are my PR preferences? Answer from this conversation only; do not use tools.
    criteria:
      - type: judger
        question: |
          The user stated "I always prefer small focused PRs, one logical concern per PR"
          and immediately asked what their PR preferences are.
          Did the agent recall the specific preference (small/focused, one concern per PR)?
          Score 1.0 if accurately recalled, 0.5 if vague, 0.0 if not mentioned.
        threshold: 0.7
criteria:
  - type: exit_code
    code: 0
  - type: text_contains
    needle: "ALPHA-7742"
  - type: turn_rounds_between
    min: 1
    max: 15
