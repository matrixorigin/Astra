name: compaction_multi_turn_pressure
description: |
  **What**: Multi-turn session that accumulates context pressure across turns, then
  verifies that compaction fired and the agent retained recent state.
  **Tests**: Cross-turn compaction lifecycle — turn 1 fills context with large tool
  results, turn 2 adds more, turn 3 asks a question about recent content.
  If compaction fires correctly between turns, old results are cleared but recent
  ones survive. The stderr "♻ Compacted" line confirms it fired.
  **Why**: Production sessions hit compaction after 5-10 turns of tool use. If
  compaction breaks cross-turn state (e.g., clears ALL results instead of old ones),
  the agent becomes amnesiac.
  **Pass means**: Agent recalls turn-2 content in turn 3 after compaction fired.
  **Fail means**: Compaction was too aggressive (cleared recent results) or never fired.
prompt: |
  Read these 5 bounded source ranges using read_file, one at a time. Use the
  exact start_line/end_line ranges so this turn contains realistic large tool
  results without depending on accidental duplicate reads:
  1. crates/runtime/src/turn/bridge/inprocess.rs, lines 1-300
  2. crates/runtime/src/server/server_loop_host.rs, lines 1-300
  3. crates/services/src/storage.rs, lines 1-300
  4. crates/runtime/src/turn/agentic_loop/execution_phase.rs, lines 1-300
  5. Makefile, lines 1-300
  After reading, say "batch-1-done" and nothing else.
capability: tool_use
difficulty: 3
weight: 2.0
timeout_seconds: 300
debug_log: true
env:
  ASTRA_MAX_TURN_INPUT_TOKENS: "35000"
steps:
  - prompt: |
      Now read these 4 more files:
      1. crates/astra-turn-core/Cargo.toml
      2. crates/astra-test-harness/Cargo.toml
      3. scripts/dev/start-api.sh
      4. crates/core/Cargo.toml
      After reading all 4, say "batch-2-done" and nothing else.
    criteria:
      - type: text_contains
        needle: batch-2-done
      - type: tool_called
        name: read_file
  - prompt: |
      Without reading any more files, answer these two questions:
      1. What build tool does the start-api.sh script use? (cargo or make?)
      2. What is the package name in crates/core/Cargo.toml?
      Answer in exactly this format:
      BUILD_TOOL: <answer>
      PACKAGE: <answer>
    criteria:
      - type: text_contains
        needle: "BUILD_TOOL:"
      - type: text_contains
        needle: "BUILD_TOOL: cargo"
      - type: text_contains
        needle: "PACKAGE: astra-core"
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: read_file
  - type: text_contains
    needle: batch-1-done
  - type: tools_count_between
    min: 8
    max: 25
  - type: turn_rounds_between
    min: 3
    max: 40
  - type: session_event_count
    event_type: CompactionFired
    min: 1
