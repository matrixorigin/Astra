name: agent_tool_visible_across_matrix
description: |
  **What**: Run agent across three different model families (DeepSeek, Anthropic, MiniMax) and verify all can discover and use it.
  **Tests**: Cross-model tool surface visibility — `agent` (formerly spawn_agent) must be visible regardless of model family.
  **Why**: G3 regression for a bug where spawn_agent had no surface entry, making it invisible to some models; the fix must work across all families.
  **Pass means**: All three model families discovered the agent tool and used it, proving the surface contract is universal.
  **Fail means**: Tool surface regression — `agent` is hidden from one or more model families.
prompt: |
  You have a `spawn_agent` tool. Call it with:
    agent_id: "child-G3"
    task: "Say the exact text: G3-matrix-ok. Do not use any tools, just reply with that text."

  Surface the child's exact reply in your final answer.
models:
  - deepseek-v4-flash
  - us.anthropic.claude-sonnet-4-6
  - MiniMax-M2.7
timeout_seconds: 180
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: agent
  - type: tools_count_between
    min: 1
    max: 4
  - type: text_contains
    needle: "G3-matrix-ok"
