name: fanout_completion_truth
description: |
  **What**: Execute three independent child prompts as one fixed-size fanout and
  require synthesis only after the canonical group settles.
  **Tests**: Tool discovery, typed fanout launch, child result aggregation, and
  completion truth across a real provider. The final answer must contain evidence
  from every accepted slot and the exact 3/3 settlement ratio.
  **Why**: Individual child events are progress, not group completion. Treating
  one child result, a transient lookup miss, or an empty background-shell list as
  fanout settlement creates fabricated "all completed" answers.
  **Pass means**: `agent_fanout.start` ran once as a three-slot work unit, all
  three child outputs reached the parent, and the parent synthesized the terminal
  group. A structurally distinct `get_results` observation is allowed.
  **Fail means**: The tool was bypassed, evidence was invented or dropped, a slot
  was silently replaced, or the parent claimed completion without 3/3 evidence.
prompt: |
  Use `agent_fanout` to run exactly one fixed group with target_count 3. Give the
  group a stable ID. The three slots are independent and must not be replaced or
  retried:

  1. Ask one child to reply with exactly `FANOUT-EVIDENCE-ALPHA`.
  2. Ask one child to reply with exactly `FANOUT-EVIDENCE-BETA`.
  3. Ask one child to reply with exactly `FANOUT-EVIDENCE-GAMMA`.

  Treat child progress as non-terminal. Synthesize from the canonical group
  result only after all three slots have settled. In the final answer, state the
  settlement ratio `3/3` and include all three exact evidence tokens. Do not call
  individual `agent` spawns and do not create replacement slots.
models:
  - deepseek-v4-pro-official
capability: delegation
difficulty: 4
weight: 3.0
timeout_seconds: 300
debug_log: true
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: agent_fanout
  - type: journal_tool_call_count
    name: agent_fanout
    min: 1
    max: 1
    document: arguments
    path: /action
    equals: start
  - type: session_event_count
    event_type: agent_terminated
    min: 3
  - type: session_event_count
    event_type: turn_evaluation
    min: 1
  - type: journal_turn_evaluation_success
    equals: true
  - type: journal_tool_json
    name: agent_fanout
    document: arguments
    path: /action
    equals: start
  - type: journal_tool_json
    name: agent_fanout
    document: arguments
    path: /target_count
    equals: 3
  - type: journal_tool_json
    name: agent_fanout
    document: result
    path: /fanout/accepted
    equals: 3
  - type: journal_tool_json
    name: agent_fanout
    document: result
    path: /fanout/terminal
    equals: 3
  - type: journal_tool_json
    name: agent_fanout
    document: result
    path: /provenance/all_slots_delivered
    equals: true
  - type: journal_tool_json
    name: agent_fanout
    document: result
    path: /work_unit_observation/status
    equals: completed
  # Explicit fanout is an admitted coordinator capability.  It must not spend
  # a model boundary rediscovering its own entrypoint or silently fall back to
  # generic agent spawning; both paths waste prompt tokens and can change the
  # completion contract.
  - type: journal_tool_call_count
    name: tool_search
    min: 0
    max: 0
  - type: journal_tool_call_count
    name: agent
    min: 0
    max: 0
  # Child slots and their raw results are execution topology, not durable
  # user deliverables. Starting Work here duplicates lifecycle state around
  # the canonical fanout group and is a product-contract failure even when
  # every child result is eventually correct.
  - type: journal_tool_call_count
    name: start_work
    min: 0
    max: 0
  - type: journal_tool_json
    name: agent_fanout
    document: result
    path: /results/0/result/result
    equals: FANOUT-EVIDENCE-ALPHA
  - type: journal_tool_json
    name: agent_fanout
    document: result
    path: /results/1/result/result
    equals: FANOUT-EVIDENCE-BETA
  - type: journal_tool_json
    name: agent_fanout
    document: result
    path: /results/2/result/result
    equals: FANOUT-EVIDENCE-GAMMA
  - type: tools_count_between
    min: 1
    max: 8
  - type: turn_rounds_between
    min: 2
    max: 8
  - type: text_contains
    needle: "3/3"
  - type: text_contains
    needle: "FANOUT-EVIDENCE-ALPHA"
  - type: text_contains
    needle: "FANOUT-EVIDENCE-BETA"
  - type: text_contains
    needle: "FANOUT-EVIDENCE-GAMMA"
  # A fanout run should preserve the stable admitted prefix. Cache ratios can
  # fluctuate at provider quantization boundaries, so retain these as native
  # quality diagnostics instead of allowing them to erase functional 3/3
  # settlement evidence.
  - type: pipeline_alert_count
    rule: prompt_cache_break
    max: 0
  - type: provider_prompt_cache_read_ratio
    min: 0.95
    # This journey is one user turn. Excluding its only provider boundary
    # would make the cache assertion vacuous; measure the actual fanout
    # request instead.
    warmup_turns: 0
