name: flash_versioned_model_with_independent_parent_task
description: |
  A unique family/version reference must bind only the delegated task;
  the current agent has a separately assigned task.
prompt: |
  使用 qwen 3.7 的子代理只回答 ASTRA-CHILD-OK，当前代理只需计算 17 + 26。
  最后告诉我子代理的回答和计算结果。
debug_log: true
capability: delegation
timeout_seconds: 180
criteria:
  - type: exit_code
    code: 0
  - type: session_event_count
    event_type: agent_spawned
    min: 1
    max: 1
    json_match:
      path: /metadata/model_configuration/prepared_selection/model_name
      equals: qwen3.7-max
  - type: session_event_count
    event_type: LlmRoundCompleted
    min: 1
    json_match:
      path: /payload/model
      equals: qwen3.7-max
      same_run_as:
        event_type: agent_spawned
        run_id_path: /metadata/run_id
        related_match:
          path: /metadata/model_configuration/prepared_selection/model_name
          equals: qwen3.7-max
  - type: session_child_result_adopted
    expected_result: ASTRA-CHILD-OK
    spawn_match:
      path: /metadata/model_configuration/prepared_selection/model_name
      equals: qwen3.7-max
    allow_get_result: true
  - type: text_contains
    needle: ASTRA-CHILD-OK
  - type: journal_tool_call_count
    name: reflect
    min: 0
    max: 0
  - type: journal_tool_call_count
    name: bash
    min: 0
    max: 0
  - type: journal_tool_call_count
    name: grep
    min: 0
    max: 0
  - type: journal_tool_call_count
    name: read_file
    min: 0
    max: 0
  - type: text_contains
    needle: "43"
