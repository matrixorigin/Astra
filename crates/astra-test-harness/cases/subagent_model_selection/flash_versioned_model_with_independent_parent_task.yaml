name: flash_versioned_model_with_independent_parent_task
description: |
  A unique family/version reference must bind only the delegated task;
  the current agent has a separately assigned task.
prompt: |
  使用 qwen 3.7 的子代理只回答 ASTRA-CHILD-OK，当前代理只需计算 17 + 26。
  最后告诉我子代理的回答和计算结果。
debug_log: true
capability: delegation
timeout_seconds: 180
criteria:
  - type: exit_code
    code: 0
  - type: execution_child_results_adopted
    children:
      - expected_result: {text: ASTRA-CHILD-OK}
        model: qwen3.7-max
  - type: text_contains
    needle: ASTRA-CHILD-OK
  - type: execution_tool_count
    name: reflect
    min: 0
    max: 0
  - type: execution_tool_count
    name: bash
    min: 0
    max: 0
  - type: execution_tool_count
    name: grep
    min: 0
    max: 0
  - type: execution_tool_count
    name: read_file
    min: 0
    max: 0
  - type: text_contains
    needle: "43"
