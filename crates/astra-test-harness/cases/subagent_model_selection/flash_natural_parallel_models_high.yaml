name: flash_natural_parallel_models_high
description: |
  A user asks for two different child models and high reasoning in ordinary
  language. Fixed child markers make the oracle independent of task quality.
prompt: |
  请同时请两个子代理完成两个确定性小任务：GLM 5.2 只回复
  NATURAL-GLM-MARKER-OK；deepseek-v4-flash 用 high 思考，只回复
  NATURAL-FLASH-HIGH-MARKER-OK。你可以继续独立工作；等他们完成后，
  告诉我两个原样标记。模型身份和思考档位请以运行时工具回执为准，不要要求
  子代理自报或核验模型/档位。不要读取文件、联网或调用诊断工具。
debug_log: true
capability: delegation
timeout_seconds: 180
criteria:
  - type: exit_code
    code: 0
  - type: session_event_count
    event_type: agent_spawned
    min: 1
    max: 1
    json_match:
      path: /metadata/model_configuration/prepared_selection/model_name
      equals: glm-5.2
  - type: session_event_count
    event_type: agent_spawned
    min: 1
    max: 1
    json_match:
      path: /metadata/model_configuration/prepared_selection/model_name
      equals: deepseek-v4-flash
  - type: session_event_count
    event_type: agent_spawned
    min: 1
    max: 1
    json_match:
      path: /metadata/model_configuration/thinking/effort
      equals: high
  - type: session_event_count
    event_type: LlmRoundCompleted
    min: 1
    json_match:
      path: /payload/model
      equals: glm-5.2
      same_run_as:
        event_type: agent_spawned
        run_id_path: /metadata/run_id
        related_match:
          path: /metadata/model_configuration/prepared_selection/model_name
          equals: glm-5.2
  - type: session_event_count
    event_type: LlmRoundCompleted
    min: 1
    json_match:
      path: /payload/model
      equals: deepseek-v4-flash
      same_run_as:
        event_type: agent_spawned
        run_id_path: /metadata/run_id
        related_match:
          path: /metadata/model_configuration/thinking/effort
          equals: high
  - type: session_event_count
    event_type: agent_terminated
    min: 2
    max: 2
  - type: session_child_result_adopted
    expected_result: NATURAL-GLM-MARKER-OK
    spawn_match:
      path: /metadata/model_configuration/prepared_selection/model_name
      equals: glm-5.2
  - type: session_child_result_adopted
    expected_result: NATURAL-FLASH-HIGH-MARKER-OK
    spawn_match:
      path: /metadata/model_configuration/prepared_selection/model_name
      equals: deepseek-v4-flash
  - type: text_contains
    needle: NATURAL-GLM-MARKER-OK
  - type: text_contains
    needle: NATURAL-FLASH-HIGH-MARKER-OK
