name: flash_near_version_must_not_substitute
description: |
  A nearby but unavailable version must not be silently replaced by the
  authorized GLM 5.2 child. Run only when 5.3 is absent from the catalog.
prompt: |
  下一步必须只调用一次 agent(action="spawn")，请求 glm-5.3 模型的子代理
  回答 ASTRA-EXACT-VERSION。使用合法的参数
  requested_model_policy={"mode":"fixed","selector":{"kind":"configured_name","model_name":"glm-5.3"}}，
  不要设置 execution 或其他模型字段。这个 spawn 应由运行时 admission 拒绝；不要先
  调用 model_catalog，不要用 glm-5.2 或其他模型替代，不要重试，也不要用
  文字模拟拒绝。最终如实说明失败原因，并包含 ASTRA-EXACT-VERSION-NOT-AVAILABLE。
debug_log: true
capability: delegation
timeout_seconds: 180
criteria:
  - type: exit_code
    code: 0
  - type: execution_tool_count
    name: agent
    min: 1
    max: 1
    root_only: true
  - type: execution_tool_count
    name: agent
    min: 1
    max: 1
    ok: false
    root_only: true
    predicates:
      - document: arguments
        path: /action
        equals: spawn
      - document: arguments
        path: /requested_model_policy
        equals: {mode: fixed, selector: {kind: configured_name, model_name: glm-5.3}}
      - document: result
        path: /status
        equals: failed
  - type: any_of
    criteria:
      - type: execution_tool_count
        name: agent
        min: 1
        max: 1
        root_only: true
        ok: false
        predicates:
          - {document: arguments, path: /action, equals: spawn}
          - {document: result, path: /error_kind, equals: invalid_request}
          - {document: result, path: /executed, equals: false}
      - type: execution_tool_count
        name: agent
        min: 1
        max: 1
        root_only: true
        ok: false
        predicates:
          - {document: arguments, path: /action, equals: spawn}
          - {document: result, path: /error_kind, equals: delegation_model_scope_unresolved}
          - {document: result, path: /advisory/executed, equals: false}
  - type: text_contains
    needle: ASTRA-EXACT-VERSION-NOT-AVAILABLE
  - type: execution_child_count
    min: 0
    max: 0
  - type: execution_tool_count
    name: bash
    min: 0
    max: 0
  - type: execution_tool_count
    name: grep
    min: 0
    max: 0
  - type: execution_tool_count
    name: read_file
    min: 0
    max: 0
  - type: execution_tool_count
    name: reflect
    min: 0
    max: 0
