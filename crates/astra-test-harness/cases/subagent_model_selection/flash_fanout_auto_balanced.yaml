name: flash_fanout_auto_balanced
description: |
  Negative control: an explicit Auto Balanced request is rejected because
  comparable task-level routing evidence is not available; no child starts.
prompt: |
  Call agent_fanout.start exactly once with target_count 2. Use defaults with
  requested_model_policy {"mode":"auto","strategy":"balanced"}; do not
  substitute the parent model or silently pick a fixed model. Use two short
  explore slots. The call must be rejected because comparable task-level cost,
  quality, and completion-time evidence is missing. Report that structured
  limitation and ask me to name a fixed authorized model. Do not retry,
  change the requested policy, or start children. Do not call Reflect.
debug_log: true
capability: delegation
timeout_seconds: 180
criteria:
  - type: exit_code
    code: 0
  - type: session_event_count
    event_type: agent_spawned
    min: 0
    max: 0
  - type: journal_tool_call_count
    name: agent_fanout
    min: 1
    max: 1
    document: arguments
    path: /action
    equals: start
  - type: journal_tool_json
    name: agent_fanout
    document: arguments
    path: /defaults/requested_model_policy/mode
    equals: auto
  - type: journal_tool_json
    name: agent_fanout
    document: arguments
    path: /defaults/requested_model_policy/strategy
    equals: balanced
  - type: journal_tool_outcome_count
    name: agent_fanout
    ok: false
    min: 1
    max: 1
  - type: journal_tool_json_contains
    name: agent_fanout
    document: error
    path: ""
    contains: "automatic model routing is not available yet"
  - type: text_contains
    needle: "automatic model routing is not available yet"
  - type: journal_tool_call_count
    name: reflect
    min: 0
    max: 0
