name: flash_child_compact_json
description: |
  Natural named-model delegation with a compact JSON answer contract. Verify
  real child inference, exact result adoption, and the parent's final answer.
  This complements arithmetic cases without a task-specific runtime formatter.
prompt: |
  用 glm5.2 子代理判断“所有鸟类都会飞”是否成立。让它只回复紧凑 JSON，
  唯一字段 valid，值为布尔值，不要解释或 Markdown。你收到并采用它的结果后，
  也只回复该 JSON。不要访问文件或网络。
debug_log: true
capability: delegation
timeout_seconds: 120
criteria:
  - type: exit_code
    code: 0
  - type: execution_child_results_adopted
    children:
      - expected_result:
          json: {valid: false}
        model: glm-5.2
  - type: text_json_value
    path: ""
    equals: {valid: false}
  - type: turn_rounds_between
    min: 2
    max: 3
  - type: execution_tool_count
    name: model_catalog
    min: 0
    max: 0
  - type: execution_tool_count
    name: tool_search
    min: 0
    max: 0
  - type: execution_tool_count
    name: bash
    min: 0
    max: 0
  - type: execution_tool_count
    name: read_file
    min: 0
    max: 0
  - type: execution_tool_count
    name: list_dir
    min: 0
    max: 0
  - type: execution_tool_count
    name: grep
    min: 0
    max: 0
  - type: execution_tool_count
    name: web_fetch
    min: 0
    max: 0
  - type: execution_tool_count
    name: web_search
    min: 0
    max: 0
  - type: execution_tool_count
    name: write_file
    min: 0
    max: 0
  - type: execution_tool_count
    name: str_replace
    min: 0
    max: 0
