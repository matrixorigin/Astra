name: flash_scoped_child_and_parent
description: |
  Natural family-name delegation with independent primary work. The fixture
  must authorize exactly one GLM candidate identity. Verify actual
  child inference and result adoption, not model self-reporting. Unnecessary
  discovery, filesystem/network access and excessive primary rounds fail.
prompt: |
  让 glm 算一下 17×19，只回复整数。它运行时你算一下 9×11，最后汇总两份结果。
debug_log: true
capability: delegation
timeout_seconds: 120
criteria:
  - type: exit_code
    code: 0
  - type: execution_child_results_adopted
    children:
      - expected_result: {text: "323"}
        model: glm-5.2
  - type: text_contains
    needle: "323"
  - type: text_contains
    needle: "99"
  - type: turn_rounds_between
    min: 2
    max: 3
  - type: execution_tool_count
    name: model_catalog
    min: 0
    max: 0
  - type: execution_tool_count
    name: tool_search
    min: 0
    max: 0
  - type: execution_tool_count
    name: bash
    min: 0
    max: 0
  - type: execution_tool_count
    name: read_file
    min: 0
    max: 0
  - type: execution_tool_count
    name: list_dir
    min: 0
    max: 0
  - type: execution_tool_count
    name: grep
    min: 0
    max: 0
  - type: execution_tool_count
    name: web_fetch
    min: 0
    max: 0
  - type: execution_tool_count
    name: web_search
    min: 0
    max: 0
  - type: execution_tool_count
    name: write_file
    min: 0
    max: 0
  - type: execution_tool_count
    name: str_replace
    min: 0
    max: 0
