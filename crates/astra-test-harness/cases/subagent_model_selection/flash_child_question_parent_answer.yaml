name: flash_child_question_parent_answer
description: |
  A GLM child asks its parent a question, waits for the correlated answer,
  and only then completes its work.
prompt: |
  This is a read-only analysis task; do not change files or external state.
  Ask a GLM 5.2 subagent to produce a one-line handoff marker. Let the normal
  spawn default select the bounded read-only child persona. In its initial
  task, give it both possible outputs: JSON means exactly
  ASTRA-CHILD-ANSWERED-JSON, while TEXT means exactly
  ASTRA-CHILD-ANSWERED-TEXT. Do not choose the format for it yet. It must ask
  you which format to use and wait for your answer before producing its final
  line. When it asks, answer JSON. Report the child's actual final line; do not
  replace an unobserved child result with your own. Do not use a tool to compare
  the two literal marker strings; that comparison is deterministic and can be
  done in reasoning.
debug_log: true
capability: delegation
timeout_seconds: 90
criteria:
  - type: exit_code
    code: 0
  - type: execution_child_results_adopted
    children:
      - expected_result: {text: ASTRA-CHILD-ANSWERED-JSON}
        model: glm-5.2
        answered_question: true
        workspace_mutation: read_only
  - type: execution_tool_count
    name: agent
    root_only: true
    ok: true
    min: 1
    max: 1
    predicates:
      - {document: arguments, path: /action, equals: spawn}
      - {document: arguments, path: /prompt, contains: ASTRA-CHILD-ANSWERED-JSON}
      - {document: arguments, path: /prompt, contains: ASTRA-CHILD-ANSWERED-TEXT}
  - type: execution_tool_count
    name: agent
    ok: true
    min: 1
    max: 1
    predicates:
      - {document: arguments, path: /action, equals: send_message}
      - {document: arguments, path: /message_type, equals: question}
  - type: execution_tool_count
    name: agent
    ok: true
    min: 1
    max: 1
    predicates:
      - {document: arguments, path: /action, equals: send_message}
      - {document: arguments, path: /message_type, equals: answer}
  - type: text_contains
    needle: ASTRA-CHILD-ANSWERED-JSON
