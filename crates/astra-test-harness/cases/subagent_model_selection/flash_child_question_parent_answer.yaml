name: flash_child_question_parent_answer
description: |
  A GLM child asks its parent a question, waits for the correlated answer,
  and only then completes its work.
prompt: |
  This is a read-only analysis task; do not change files or external state.
  Ask a GLM 5.2 subagent to produce a one-line handoff marker. In its initial
  task, give it both possible outputs: JSON means exactly
  ASTRA-CHILD-ANSWERED-JSON, while TEXT means exactly
  ASTRA-CHILD-ANSWERED-TEXT. Do not choose the format for it yet. It must ask
  you which format to use and wait for your answer before producing its final
  line. When it asks, answer JSON. While the child runs, independently check
  that the two outputs differ. Report the child's actual final line and your
  independent check; do not replace an unobserved child result with your own.
debug_log: true
capability: delegation
timeout_seconds: 90
criteria:
  - type: exit_code
    code: 0
  - type: session_event_count
    event_type: agent_spawned
    min: 1
    max: 1
    json_match:
      path: /metadata/model_configuration/prepared_selection/model_name
      equals: glm-5.2
  - type: session_event_count
    event_type: agent_spawned
    min: 1
    max: 1
    json_match:
      path: /metadata/workspace_mutation
      equals: read_only
  - type: journal_tool_json_contains
    name: agent
    document: arguments
    path: /prompt
    contains: ASTRA-CHILD-ANSWERED-JSON
  - type: journal_tool_json_contains
    name: agent
    document: arguments
    path: /prompt
    contains: ASTRA-CHILD-ANSWERED-TEXT
  - type: session_event_count
    event_type: LlmRoundCompleted
    min: 1
    json_match:
      path: /payload/model
      equals: glm-5.2
      same_run_as:
        event_type: agent_spawned
        run_id_path: /metadata/run_id
  - type: journal_tool_call_count
    name: agent
    min: 1
    max: 1
    ok: true
    document: arguments
    path: /message_type
    equals: question
  - type: journal_tool_call_count
    name: agent
    min: 1
    max: 1
    ok: true
    document: arguments
    path: /message_type
    equals: answer
  - type: journal_tool_value_flow_bound
    producer: agent
    producer_document: result
    producer_path: /message_id
    producer_filters:
      - document: arguments
        path: /action
        equals: send_message
      - document: arguments
        path: /message_type
        equals: question
      - document: arguments
        path: /to
        equals: parent
    consumer: agent
    consumer_document: arguments
    consumer_paths: [/request_id]
    consumer_filters:
      - document: arguments
        path: /action
        equals: send_message
      - document: arguments
        path: /message_type
        equals: answer
  - type: session_event_count
    event_type: agent_terminated
    min: 1
    max: 1
    json_match:
      path: /metadata/status
      equals: completed
      same_run_as:
        event_type: agent_spawned
        run_id_path: /metadata/run_id
  - type: any_of
    criteria:
      - type: journal_tool_json
        name: agent
        document: result
        path: /result
        equals: ASTRA-CHILD-ANSWERED-JSON
        where_match:
          document: arguments
          path: /action
          equals: get_result
      - type: session_child_result_adopted
        expected_result: ASTRA-CHILD-ANSWERED-JSON
  - type: text_contains
    needle: ASTRA-CHILD-ANSWERED-JSON
