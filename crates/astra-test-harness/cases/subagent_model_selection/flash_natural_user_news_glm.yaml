name: flash_natural_user_news_glm
description: |
  An unscripted Chinese user request must select the uniquely available GLM
  child, let it fetch current news, and return the result to the parent.
prompt: 用glm5.2 去查一下最新新浪的一条新闻
debug_log: true
capability: delegation
timeout_seconds: 240
criteria:
  - type: exit_code
    code: 0
  - type: session_event_count
    event_type: agent_spawned
    min: 1
    max: 1
    json_match:
      path: /metadata/model_configuration/prepared_selection/model_name
      equals: glm-5.2
  - type: session_event_count
    event_type: LlmRoundCompleted
    min: 1
    json_match:
      path: /payload/model
      equals: glm-5.2
      same_run_as:
        event_type: agent_spawned
        run_id_path: /metadata/run_id
  - type: journal_child_tool_call_count
    parent: agent
    child: web_fetch
    min: 1
    max: 20
    min_distinct_child_runs: 1
  - type: text_contains
    needle: sina.com.cn
  - type: journal_tool_call_count
    name: reflect
    min: 0
    max: 0
