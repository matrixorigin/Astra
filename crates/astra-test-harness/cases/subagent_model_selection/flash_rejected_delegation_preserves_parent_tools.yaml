name: flash_rejected_delegation_preserves_parent_tools
description: |
  Rejected delegation must preserve independent parent catalog work without
  starting a substitute child.
prompt: |
  先只尝试一次委派，让 glm-99.99 模型的子代理回答 ASTRA-MISSING-MODEL-MUST-NOT-RUN。
  若委派失败，不要重试或换模型。之后由当前代理通过 model_catalog 查询可用的 Chat 模型，
  如实告诉我委派结果及可用模型；最后包含 ASTRA-PARENT-CATALOG-CHECKED。
debug_log: true
capability: delegation
timeout_seconds: 180
criteria:
  - type: exit_code
    code: 0
  - type: journal_tool_call_count
    name: agent
    min: 1
    max: 1
    document: arguments
    path: /action
    equals: spawn
  - type: journal_tool_outcome_count
    name: agent
    ok: false
    min: 1
    max: 1
  - type: journal_tool_json
    name: agent
    document: result
    path: /error_kind
    equals: delegation_model_scope_unresolved
  - type: journal_tool_json
    name: agent
    document: result
    path: /status
    equals: failed
  - type: text_contains
    needle: ASTRA-PARENT-CATALOG-CHECKED
  - type: session_event_count
    event_type: agent_spawned
    min: 0
    max: 0
  - type: session_event_count
    event_type: agent_terminated
    min: 0
    max: 0
  - type: journal_tool_call_count
    name: reflect
    min: 0
    max: 0
  - type: journal_tool_call_count
    name: model_catalog
    min: 1
    max: 1
  - type: journal_tool_json
    name: model_catalog
    document: result
    path: /purpose
    equals: chat
  - type: journal_tool_outcome_count
    name: model_catalog
    ok: false
    min: 0
    max: 0
  - type: journal_tool_sequence
    tools: [agent, model_catalog]
