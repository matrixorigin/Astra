name: flash_semantic_model_reference_glm
description: |
  A natural-language model reference with reordered terms must be resolved
  against the authorized candidate catalog, not by a hard-coded alias.
prompt: |
  请让 5.2glm 模型的子代理只回答 ASTRA-SEMANTIC-MODEL-OK，然后把它的回答告诉我。
debug_log: true
capability: delegation
timeout_seconds: 180
criteria:
  - type: exit_code
    code: 0
  - type: execution_child_results_adopted
    children:
      - expected_result: {text: ASTRA-SEMANTIC-MODEL-OK}
        model: glm-5.2
  - type: text_contains
    needle: ASTRA-SEMANTIC-MODEL-OK
  - type: execution_tool_count
    name: reflect
    min: 0
    max: 0
  - type: execution_tool_count
    name: bash
    min: 0
    max: 0
  - type: execution_tool_count
    name: grep
    min: 0
    max: 0
  - type: execution_tool_count
    name: read_file
    min: 0
    max: 0
