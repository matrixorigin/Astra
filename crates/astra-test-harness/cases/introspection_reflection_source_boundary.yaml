name: introspection_reflection_source_boundary
description: |
  **What**: In one real session, inspect live execution state and then reflect on durable
  session evidence.
  **Tests**: The agent can invoke both diagnostic tools, their calls are present in the
  canonical durable turn journal even when a deferred tool is selected through the typed
  discovery/dispatch path, and the model is asked not to conflate a fresh process snapshot
  with the session journal.
  **Why**: `introspect` and `reflect` answer adjacent but different questions. Treating a
  process-local zero as a durable-session zero hides history and produces misleading diagnosis.
  **Pass means**: Both tools execute in order and their durable tool records are readable after
  the turn; the reply distinguishes live-process evidence from durable-session evidence.
  **Fail means**: Either diagnostic path is unavailable, its journal projection is missing, or
  the model collapses the two evidence scopes into one claim.
prompt: |
  Do exactly two read-only diagnostic tool calls, in this order:

  1. Call `introspect` once with facet `overview`, depth `diagnostic`, and horizon `recent`.
  2. Call `reflect` once with facet `overview`, depth `diagnostic`, and horizon `session`.

  Then give a concise answer that explicitly distinguishes live-process evidence from
  durable-session evidence. Do not say their counts are identical unless the tool outputs
  establish that. Necessary typed tool discovery is allowed to expose these two
  diagnostics; do not perform any other diagnostic or task tool calls.
capability: "custom:diagnostic_observability"
difficulty: 4
weight: 2.0
timeout_seconds: 180
debug_log: true
criteria:
  - type: exit_code
    code: 0
  - type: journal_tool_sequence
    tools: [introspect, reflect]
  - type: tools_count_between
    min: 2
    max: 4
  - type: journal_tool_call_count
    name: introspect
    min: 1
    max: 1
  - type: journal_tool_call_count
    name: reflect
    min: 1
    max: 1
  - type: journal_tool_call_count
    name: introspect
    min: 1
    max: 1
    document: arguments
    path: /facet
    equals: overview
  - type: journal_tool_call_count
    name: introspect
    min: 1
    max: 1
    document: arguments
    path: /depth
    equals: diagnostic
  - type: journal_tool_call_count
    name: introspect
    min: 1
    max: 1
    document: arguments
    path: /horizon
    equals: recent
  - type: journal_tool_call_count
    name: reflect
    min: 1
    max: 1
    document: arguments
    path: /facet
    equals: overview
  - type: journal_tool_call_count
    name: reflect
    min: 1
    max: 1
    document: arguments
    path: /depth
    equals: diagnostic
  - type: journal_tool_call_count
    name: reflect
    min: 1
    max: 1
    document: arguments
    path: /horizon
    equals: session
  - type: journal_tool_outcome_count
    name: introspect
    ok: true
    min: 1
    max: 1
  - type: journal_tool_outcome_count
    name: reflect
    ok: true
    min: 1
    max: 1
  - type: hard_judger
    question: |
      Did the response accurately distinguish the scopes of the two diagnostics?
      `introspect` reports a recent live process/runtime projection, while `reflect`
      may inspect durable session artifacts. Score 1.0 only when the answer states that
      distinction without inventing equivalence. If the answer states a depth,
      it must match the actual result; do not claim diagnostic for summary; 0.5 when it is vague but not misleading;
      0.0 when it asserts a false equivalence or fabricates evidence.
    threshold: 0.8
