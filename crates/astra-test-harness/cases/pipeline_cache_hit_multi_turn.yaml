name: pipeline_cache_hit_multi_turn
description: |
  **What**: Four ACK-only turns measure cache reuse and inclusive input cost.
  **Tests**: Demonstrated cached reads, bounded cache creation, and exact responses
  without unrelated tools. Preserve primary and auxiliary costs in the report.
  **Pass means**: Four exact ACK responses, no tools, at least 10000 cumulative
  cached input tokens and at most 25000 cache-creation tokens.
  **Limits**: These cumulative bounds catch severe reuse loss or repeated creation;
  they do not prove exact request-prefix continuity or every local cache regression.
  New conversation input and necessary auxiliary calls can produce reasonable fresh
  cost despite stable system/tool identities. There is no universal percentage SLO
  in this case; inspect absolute costs and request evidence before assigning a bug.
prompt: |
  Reply with the single word ACK. Do not call any tools.
capability: custom:cache
difficulty: 2
weight: 1.0
timeout_seconds: 180
steps:
  - prompt: 'Reply with the single word ACK. Do not call any tools.'
    criteria:
      - type: text_equals
        expected: ACK
  - prompt: 'Reply with the single word ACK. Do not call any tools.'
    criteria:
      - type: text_equals
        expected: ACK
  - prompt: 'Reply with the single word ACK. Do not call any tools.'
    criteria:
      - type: text_equals
        expected: ACK
criteria:
  - type: exit_code
    code: 0
  - type: text_equals
    expected: "ACK\n\nACK\n\nACK\n\nACK"
  # Keep demonstrated reuse and absence of tool detours as hard requirements.
  - type: all_of
    criteria:
      - type: prompt_cache_tokens
        min_read: 10000
        min_creation: 0
        max_creation: 25000
      - type: tools_count_between
        min: 0
        max: 0
