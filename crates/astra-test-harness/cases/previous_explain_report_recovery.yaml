name: previous_explain_report_recovery
description: |
  A follow-up asks about the runtime Explain report from an earlier turn.
  Verify that the agent discovers its identity and status through the session
  reader without searching runtime-owned files.
prompt: "用一句话说明代码审查的目的。"
capability: "custom:previous_explain_report_recovery"
difficulty: 3
weight: 2.0
timeout_seconds: 180
debug_log: true
steps:
  - prompt: |
      刚才那轮运行的 Explain 报告是哪一个 run、capture status 是什么？
      请读取报告后回答，并说明报告声明的采集覆盖情况。
criteria:
  - type: exit_code
    code: 0
  - type: journal_tool_json
    name: introspect
    document: arguments
    path: /explain/target
    equals: previous
  - type: journal_tool_call_count
    name: bash
    min: 0
    max: 0
  - type: journal_tool_outcome_count
    name: introspect
    ok: false
    min: 0
    max: 0
  - type: hard_judger
    question: |
      Match the follow-up's run ID (or unambiguous prefix) and capture status
      to the previous Explain artifact returned by introspect. Check that any
      claims about coverage match its declared capture status and gaps.
      Do not accept SQL EXPLAIN interpretation or absence inferred from live counters.
    threshold: 0.8
