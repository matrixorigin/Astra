name: memory_tracking_intent_routes_correctly
description: |
  **What**: Ask the assistant to remember an interest in a project.
  **Tests**: The original natural-language request must produce a successful
  memory write of the user's interest, not just a conversational acknowledgment
  or a lookup. Unrelated filesystem exploration is unnecessary.
  **Pass means**: A successful remember call stores the requested fact and returns
  a real memory_id; the final answer accurately describes that write.
  **Limits**: A write receipt proves storage, not future-session recall.
prompt: |
  我关注oceanbase这个项目，帮我记住。
capability: memory
difficulty: 3
weight: 2.0
timeout_seconds: 120
cleanup_memory_records: true
criteria:
  - type: exit_code
    code: 0
  - type: journal_tool_call_count
    name: memory
    min: 1
    max: 3
    ok: true
    document: arguments
    path: /action
    equals: remember
  - type: tools_count_between
    min: 1
    max: 6
  - type: turn_rounds_between
    min: 1
    max: 5
  - type: journal_tool_call_count
    name: bash
    min: 0
    max: 0
  - type: journal_tool_call_count
    name: grep
    min: 0
    max: 0
  - type: journal_tool_call_count
    name: glob
    min: 0
    max: 0
  - type: journal_tool_call_count
    name: list_dir
    min: 0
    max: 0
  - type: hard_judger
    question: |
      From the canonical tool records, did a successful memory action=remember
      store the user's interest in OceanBase and return a nonempty memory_id?
      Bind the correct content, successful outcome, and receipt to the same call.
      A recall, failed write, unrelated stored fact, or bare acknowledgment does
      not satisfy this request. The final answer must accurately describe the
      observed write; it must not claim future recall has already been tested.
    threshold: 1.0
