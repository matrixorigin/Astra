name: fork_prefix_spawn_inherits
description: |
  **What**: Spawn a child agent with inherit_prefix and verify the full capture-resolve-probe cycle via the CLI path.
  **Tests**: Fork-prefix pipeline for canonical agent spawn — parent captures prefix on turn_completed, child resolves via InMemoryPrefixStore.
  **Why**: Regression for the CLI-exercisable fork-prefix path (distinct from server-side DelegationEngine), ensuring prefix inheritance works end-to-end.
  **Pass means**: The child resolved the parent's prefix, produced the expected reply, and the parent surfaced it in the final answer.
  **Fail means**: Prefix capture missed turn_completed, InMemoryPrefixStore lookup failed, or canonical agent spawn dispatch is broken.
prompt: |
  Use the `agent` tool with:
    action: "spawn"
    name: "child-delegate-G2"
    description: "Probe inherited prefix"
    prompt: "Say the exact text: delegate-G2-ok. Do not use any tools, just reply with that text."
    inherit_prefix:
      required: true

  Surface the child's exact reply in your final answer.
  Do not use any other tools.
debug_log: true
timeout_seconds: 300
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: agent
  - type: journal_tool_call_count
    name: agent
    min: 1
    max: 1
    document: arguments
    path: /inherit_prefix/required
    equals: true
  - type: journal_tool_json
    name: agent
    document: result
    path: /status
    equals: completed
  - type: journal_tool_json
    name: agent
    document: result
    path: /result
    equals: delegate-G2-ok
  - type: text_contains
    needle: "delegate-G2-ok"
