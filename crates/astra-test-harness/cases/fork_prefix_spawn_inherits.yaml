name: fork_prefix_spawn_inherits
description: |
  **What**: Request required parent-prefix inheritance through the CLI's Server-owned agent admission.
  **Tests**: The Server captures and resolves the parent prefix before launching the child; the CLI records canonical execution facts.
  **Why**: A required inherited prefix must work without a second CLI-local execution or prefix store.
  **Pass means**: One child launches with required inheritance, reaches a matching terminal result, and the parent adopts its exact reply.
  **Fail means**: Required-prefix admission rejects, child execution fails, or the parent reports an unadopted result.
prompt: |
  Use the `agent` tool with:
    action: "spawn"
    name: "child-delegate-G2"
    description: "Probe inherited prefix"
    prompt: "Say the exact text: delegate-G2-ok. Do not use any tools, just reply with that text."
    inherit_prefix:
      required: true

  Surface the child's exact reply in your final answer.
  Do not use any other tools.
debug_log: true
timeout_seconds: 300
criteria:
  - type: exit_code
    code: 0
  - type: tool_called
    name: agent
  - type: journal_tool_call_count
    name: agent
    min: 1
    max: 1
    document: arguments
    path: /inherit_prefix/required
    equals: true
  - type: journal_tool_json
    name: agent
    document: result
    path: /status
    equals: launched
  - type: journal_tool_json
    name: agent
    document: result
    path: /result_family
    equals: control_receipt
  - type: session_event_count
    event_type: agent_spawned
    min: 1
    max: 1
  - type: session_event_count
    event_type: agent_terminated
    min: 1
    max: 1
    json_match:
      path: /metadata/status
      equals: completed
      same_run_as:
        event_type: agent_spawned
        run_id_path: /metadata/run_id
  - type: session_child_result_adopted
    expected_result: "delegate-G2-ok"
  - type: text_contains
    needle: "delegate-G2-ok"
