name: multi_turn_delegation_followup
description: '**What**: Spawn a sub-agent in turn 1, then ask about its result in
  turn 2 to verify delegation results persist.

  **Tests**: Delegation discovery + dispatch + result surfacing + cross-turn persistence.
  Subsumes the

  basic spawn test — if this passes, tool discovery, delegation dispatch, and result
  surfacing all work.

  **Why**: In production multi-agent workflows, a coordinator often delegates in one
  turn and reasons about results in the next; losing delegation results breaks orchestration.

  **Pass means**: The sub-agent''s computed result (391) is correctly recalled in
  turn 2, proving delegation output persists in session state.

  **Fail means**: Delegation results were dropped between turns (session state bug)
  or the sub-agent failed to compute correctly.

  '
prompt: |
  Use the `agent` tool with action `spawn` to start one foreground child:
    description: "Calculate 17 times 23"
    prompt: "Calculate 17*23. Output only the final numeric answer, with no JSON, explanation, tool description, formatting, or extra words."
    agent_type: "general-purpose"

  The child result returns through the foreground tool call. Tell me the
  numerical result it gave you. Do not use other tools after receiving it.
capability: delegation
difficulty: 3
weight: 2.0
timeout_seconds: 240
steps:
- prompt: What was the numerical result the sub-agent gave you?
  criteria:
  - type: text_contains
    needle: '391'
criteria:
- type: exit_code
  code: 0
- type: tool_called
  name: agent
- type: turn_rounds_between
  min: 1
  max: 50
- type: judger
  question: 'Did the agent correctly delegate 17*23 to a sub-agent and report

    back the result 391? The agent must have used spawn_agent (not

    calculated directly) and the final answer must be 391.

    '
  threshold: 0.7
