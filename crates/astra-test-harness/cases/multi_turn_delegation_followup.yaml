name: multi_turn_delegation_followup
description: |
  Delegate a small calculation using a natural-language model request, then
  inspect its execution in a later user turn. The retrospective must preserve
  the result and obtain bounded evidence without failed introspection calls.
prompt: |
  Ask a GLM 5.2 subagent to calculate 17 times 23 and return only the integer.
  Report its actual result when it finishes. Do not change files or access the network.
capability: delegation
difficulty: 3
weight: 2.0
timeout_seconds: 240
debug_log: true
steps:
- prompt: Briefly audit the previous execution trace. Report the child's numerical result and actual model, the parent and child tool sequence, and the evidence for successful completion. Ground the timeline in recorded execution events, and say what evidence is unavailable. Do not change files or access the network.
  criteria:
  - type: text_contains
    needle: '391'
  - type: text_contains
    needle: 'glm-5.2'
criteria:
- type: exit_code
  code: 0
- type: tool_called
  name: agent
- type: journal_tool_call_count
  name: introspect
  min: 1
  max: 3
- type: journal_tool_outcome_count
  name: introspect
  ok: false
  min: 0
  max: 0
- type: journal_tool_call_count
  name: introspect
  min: 1
  max: 3
  ok: true
  document: arguments
  path: /explain/target
  equals: run
- type: journal_tool_value_flow_bound
  producer: agent
  producer_document: result
  producer_path: /run_id
  producer_filters:
    - document: arguments
      path: /action
      equals: spawn
  consumer: introspect
  consumer_document: arguments
  consumer_paths: [/explain/run_id]
  consumer_filters:
    - document: arguments
      path: /explain/target
      equals: run
  min_turns_after_producer: 1
- type: turn_rounds_between
  min: 1
  max: 10
- type: session_event_count
  event_type: agent_spawned
  min: 1
  max: 1
- type: session_event_count
  event_type: agent_spawned
  min: 1
  max: 1
  json_match:
    path: /metadata/model_configuration/prepared_selection/model_name
    equals: glm-5.2
- type: session_child_result_adopted
  expected_result: '391'
  spawn_match:
    path: /metadata/model_configuration/prepared_selection/model_name
    equals: glm-5.2
- type: session_event_count
  event_type: agent_terminated
  min: 1
  max: 1
  json_match:
    path: /metadata/status
    equals: completed
    same_run_as:
      event_type: agent_spawned
      run_id_path: /metadata/run_id
