name: hello_text_contains
description: |
  **What**: Send a trivial prompt and verify the response contains a specific word.
  **Tests**: Basic model responsiveness, instruction following, efficiency bounds, and
  criteria plumbing (text_contains, tokens_between, duration_between, turn_rounds_between, judger).
  **Why**: Smoke test — if this fails, nothing else will work (auth, routing, model access).
  Also serves as the harness criteria self-test (all criterion types exercised on one case).
  **Pass means**: The model is reachable, follows instructions, and all criteria types evaluate correctly.
  **Fail means**: Infrastructure issue (auth expired, model unavailable) or harness criteria bug.
prompt: |
  Please reply with a single short sentence that contains the word
  "astra-harness-ok" verbatim. Do not use any tools.
timeout_seconds: 60
criteria:
  - type: exit_code
    code: 0
  - type: text_contains
    needle: astra-harness-ok
  - type: tokens_between
    min: 1
    max: 15000
  - type: duration_between
    min_ms: 0
    max_ms: 30000
  - type: turn_rounds_between
    min: 1
    max: 3
  - type: judger
    question: |
      The agent was asked to reply with a sentence containing
      "astra-harness-ok" and use no tools. Score 1.0 if the output
      contains the exact token and zero tools were used. Score 0.5 if
      the token is present but tools were used. Score 0.0 if the token
      is missing.
    threshold: 0.5
