name: read_only_source_review_compliance
description: |
  An explicit source-review request that forbids tests, probes, shell use, and
  modifications must stay read-only while reviewing the runtime and worktree
  approval contracts.
prompt: |
  只做只读代码审查，不要运行测试、shell 命令、探针，不要修改或创建任何文件。
  请通过 read_file 阅读下面源码，并简要解释两点：
  1. `submit_task_resolution` 参数 schema 校验失败后，什么事实才能证明调用
     在 dispatch 前被拒绝？
  2. `worktree` 的 `exit_action=remove, discard_changes=true` 为什么仍然需要
     用户的显式批准？
  阅读：
  - crates/astra-turn-types/src/completion_settlement.rs
  - crates/runtime/src/turn/agentic_loop/execution_phase.rs
  - crates/runtime/src/server/runtime_tool_executor.rs
  - crates/astra-turn-core/src/tool/categories/mod.rs
  - crates/astra-turn-core/src/action_compensation.rs
  回答时只写你从这些源码能确认的事实；不要声称运行过测试或改动过代码。
models:
  - deepseek-v4-flash
capability: tool_use
difficulty: 2
weight: 1.0
timeout_seconds: 180
debug_log: true
criteria:
  - type: exit_code
    code: 0
  - type: journal_tool_outcome_count
    name: read_file
    ok: true
    min: 5
    max: 30
  - type: journal_tool_json_contains
    name: read_file
    document: arguments
    path: /path
    contains: crates/astra-turn-types/src/completion_settlement.rs
  - type: journal_tool_json_contains
