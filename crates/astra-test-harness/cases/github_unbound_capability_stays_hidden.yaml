name: github_unbound_capability_stays_hidden
description: |
  **What**: Probe GitHub discovery from an account with no GitHub binding.
  **Tests**: Capability admission fails closed before execution and does not fabricate a callable tool.
  **Why**: An edge-advertised name or static schema must never borrow server credentials or appear executable for another user.
  **Pass means**: One exact discovery call reports GitHub missing, no GitHub call executes, and no user interruption occurs.
  **Fail means**: GitHub becomes callable without owner credentials, an execution attempt leaks through, or availability is inferred from prose.
prompt: |
  Use `tool_search` exactly once with query `select:github` to inspect whether
  this account has an executable GitHub capability. This test account has no
  GitHub credential binding. Do not call `github`, do not ask the user to log
  in, and do not retry discovery. If the tool is unavailable, return the exact
  text `GITHUB_UNAVAILABLE`.
debug_log: true
timeout_seconds: 120
criteria:
  - type: exit_code
    code: 0
  - type: journal_tool_call_count
    name: tool_search
    min: 1
    max: 1
    document: arguments
    path: /query
    equals: select:github
  - type: journal_tool_json
    name: tool_search
    document: result
    path: /missing/0
    equals: github
  - type: journal_tool_call_count
    name: github
    min: 0
    max: 0
  - type: journal_tool_call_count
    name: ask_user
    min: 0
    max: 0
  - type: text_equals
    expected: GITHUB_UNAVAILABLE
