name: agent_discovery_only_child_preserves_github_boundary
description: |
  **What**: Delegate a discovery-only probe while GitHub is absent from the parent's executable surface.
  **Tests**: A child can use the discovery backbone but cannot acquire a capability outside its parent's authority.
  **Pass means**: One child discovers GitHub as missing, performs no GitHub call, and returns the exact negative result.
  **Fail means**: No child executes the probe, GitHub becomes executable, or the parent fabricates the child's result.
prompt: |
  Spawn exactly one foreground child with:
    action: "spawn"
    name: "github-boundary-child"
    description: "Probe child GitHub boundary"
    allowed_tools: ["tool_search"]
    prompt: |
      Call tool_search exactly once with query select:github. Do not call
      github and do not ask the user anything. If discovery reports github
      missing, reply with the exact text CHILD_GITHUB_UNAVAILABLE.

  Return the child's exact reply. Do not retry and do not use GitHub in the parent.
debug_log: true
timeout_seconds: 180
criteria:
  - type: exit_code
    code: 0
  - type: journal_tool_call_count
    name: agent
    min: 1
    max: 1
    document: arguments
    path: /action
    equals: spawn
  - type: journal_tool_json
    name: agent
    document: arguments
    path: /allowed_tools
    equals: [tool_search]
  - type: journal_tool_json
    name: agent
    document: result
    path: /status
    equals: completed
  - type: journal_tool_json
    name: agent
    document: result
    path: /result
    equals: CHILD_GITHUB_UNAVAILABLE
  - type: journal_tool_call_count
    name: tool_search
    min: 1
    max: 1
    document: arguments
    path: /query
    equals: select:github
  - type: journal_tool_json
    name: tool_search
    document: result
    path: /missing/0
    equals: github
  - type: journal_tool_call_count
    name: github
    min: 0
    max: 0
  - type: text_contains
    needle: CHILD_GITHUB_UNAVAILABLE
  - type: journal_child_tool_call_count
    parent: agent
    child: tool_search
    min: 1
    max: 1
