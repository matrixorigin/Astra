name: cache_volatile_lane_stability
description: |
  **What**: 5-turn session with a correction followed by three short turns,
  checking that the reusable prefix survives the correction path.
  **Tests**: Provider-observed cache reuse after a correction prompt. It does
  not prove that feedback state actually changed or identify which volatile
  field was updated; those require a separate typed runtime test.
  **Why**: Learned context and feedback rules must stay outside the stable
  prefix when they change. This smoke catches observable cache loss after a
  correction without inferring an unobserved internal state transition.
  **Pass means**: every turn after the correction has at least 10000
  provider-observed cache-read tokens, with no prompt-cache-break alert.
  **Fail means**: a later turn loses the stable prefix, even when earlier
  turns had enough cached tokens to make an aggregate total look healthy.
prompt: |
  Read the first 10 lines of Cargo.toml. Reply with the package name only.
capability: custom:cache
required_cache_scope: conversation_turns
difficulty: 2
weight: 1.0
timeout_seconds: 180
steps:
  - prompt: 'No wait, I meant read Makefile instead. Tell me the first target.'
  - prompt: 'Reply ACK. Do not call any tools.'
    criteria:
      - type: all_of
        criteria:
          - type: prompt_cache_tokens
            min_read: 10000
            min_creation: 0
  - prompt: 'Reply ACK. Do not call any tools.'
    criteria:
      - type: all_of
        criteria:
          - type: prompt_cache_tokens
            min_read: 10000
            min_creation: 0
  - prompt: 'Reply ACK. Do not call any tools.'
    criteria:
      - type: all_of
        criteria:
          - type: prompt_cache_tokens
            min_read: 10000
            min_creation: 0
criteria:
  - type: exit_code
    code: 0
  - type: all_of
    criteria:
      - type: pipeline_alert_count
        rule: prompt_cache_break
        max: 0
