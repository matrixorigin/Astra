# config/models.example.yaml
#
# Minimum model configuration for `make verify-llm` to pass.
#
# Setup:
#   1. cp config/models.example.yaml .models.yaml
#   2. Fill in your API keys and endpoint IDs
#   3. astra-admin model load .models.yaml
#
# After loading, run: make verify-llm

# LLM model (for NL→Script, chat, etc.)
- name: deepseek-v3
  provider: openai_compatible
  api_key: <your-api-key>
  base_url: https://ark.cn-beijing.volces.com/api/v3
  description: "DeepSeek V3 via Volcengine"
  context_window: 65536
  tags: [code, chat]

# Embedding model (for memory vector search)
- name: text-embedding-v3
  provider: openai_compatible
  api_key: <your-api-key>
  base_url: https://ark.cn-beijing.volces.com/api/v3
  description: "Embedding model for memory retrieval"
  tags: [embedding]
