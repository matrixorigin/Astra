[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "trust-mem-lite"
version = "0.2.5"
description = "Persistent memory for AI coding tools (Kiro, Cursor, Claude Code) — local single-user mode"
authors = ["MatrixOne Team"]
readme = "mo_memory_mcp/README.md"
packages = [
    {include = "mo_memory_mcp"},
    {include = "core/memory"},
    {include = "core/embedding"},
    {include = "core/git_for_data.py"},
    {include = "core/db_consumer.py"},
    {include = "core/validation.py"},
    {include = "core/exceptions.py"},
    {include = "core/utils"},
    {include = "core/__init__.py"},
    {include = "api/base.py"},
    {include = "api/__init__.py"},
    {include = "cli/mo_memory_cli.py"},
    {include = "cli/__init__.py"},
]

[tool.poetry.dependencies]
python = "^3.11"
pymysql = "^1.1.0"
sqlalchemy = "^2.0.0"
matrixone-python-sdk = ">=0.1.16"
pydantic = "^2.5.0"
mcp = "^1.26.0"
uuid-utils = "^0.9.0"
sentence-transformers = {version = ">=2.2.0", optional = true}

[tool.poetry.extras]
local-embedding = ["sentence-transformers"]

[tool.poetry.scripts]
trustmem = "cli.mo_memory_cli:main"
