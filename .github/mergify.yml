queue_rules:
  - name: main
    merge_conditions: []
    checks_timeout: 4h
    merge_method: squash
    commit_message_format:
      title: pr-title
      body: pr-body
      trailers:
        - approved-by

pull_request_rules:
  - name: Request XuPeng-SH review on every pull request
    conditions:
      - author!=XuPeng-SH
      - -draft
      - -approved-reviews-by=XuPeng-SH
    actions:
      request_reviews:
        users:
          - XuPeng-SH

  - name: Automatic queue on approval for main
    conditions:
      - "#changes-requested-reviews-by<=0"
      - label!=do-not-merge/wip
      - base=main
      - approved-reviews-by=XuPeng-SH
    actions:
      queue:
        name: main

  - name: Auto update branch
    conditions:
      - created-at>=00:10 ago
    actions:
      update:

merge_queue:
  max_parallel_checks: 1
