name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: [kind/bug]

body:
  - type: checkboxes
    attributes:
      label: Is there an existing issue for the same bug?
      description: Please check if an issue already exists.
      options:
        - label: I have checked the existing issues.
          required: true
  - type: input
    attributes:
      label: Version and environment (optional)
      description: Astra version or commit, deployment profile, OS, and CPU architecture.
      placeholder: e.g. Astra 0.1.0, Server + Edge, macOS 15 arm64
    validations:
      required: false
  - type: textarea
    attributes:
      label: Actual behavior
      description: What happened.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: What you expected.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional information
      description: Sanitized logs, traces, screenshots, or other context. Remove credentials, private URLs and paths, customer data, and proprietary information.
    validations:
      required: false
