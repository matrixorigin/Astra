name: "Rust CI Setup"
description: "Install Rust toolchain + nextest, configure build cache"

inputs:
  shared-key:
    description: "Cache shared-key suffix (e.g. ci-test-main, ci-check-main)"
    required: false
    default: "ci-test"
  save-cache:
    description: "Whether to save cache (true/false)"
    required: false
    default: "false"
  use-sccache:
    description: "Enable sccache with the GitHub Actions cache backend"
    required: false
    default: "true"
  use-mold:
    description: "Use mold as the Linux linker"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    # ubuntu-latest has ~14GB free; parallel shards each restore a multi-GB
    # rust-cache target/ dir. Only the build job used to run this cleanup.
    - name: Free disk space
      shell: bash
      run: |
        set -euxo pipefail
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune -af 2>/dev/null || true
        df -h /

    - uses: dtolnay/rust-toolchain@stable

    - uses: taiki-e/install-action@nextest

    - name: Install mold linker
      if: ${{ inputs.use-mold == 'true' && runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euxo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends mold
        if [[ -n "${RUSTFLAGS:-}" ]]; then
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold ${RUSTFLAGS}" >> "$GITHUB_ENV"
        else
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
        fi

    - name: Install sccache
      if: ${{ inputs.use-sccache == 'true' }}
      uses: mozilla-actions/sccache-action@v0.0.10

    - name: Configure sccache
      if: ${{ inputs.use-sccache == 'true' }}
      shell: bash
      run: |
        {
          echo "SCCACHE_GHA_ENABLED=true"
          echo "SCCACHE_CACHE_SIZE=5G"
          echo "RUSTC_WRAPPER=sccache"
        } >> "$GITHUB_ENV"

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust
        shared-key: ${{ inputs.shared-key }}-${{ github.base_ref || github.ref_name }}
        save-if: ${{ inputs.save-cache }}
