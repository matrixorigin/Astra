name: "Rust CI Setup"
description: "Install Rust toolchain + nextest, configure build cache"

inputs:
  shared-key:
    description: "Cache shared-key suffix (e.g. ci-test-main, ci-check-main)"
    required: false
    default: "ci-test"
  save-cache:
    description: "Whether to save cache (true/false)"
    required: false
    default: "false"
  use-sccache:
    description: "Enable sccache with the GitHub Actions cache backend"
    required: false
    default: "true"
  use-mold:
    description: "Use mold as the Linux linker"
    required: false
    default: "true"
  install-nextest:
    description: "Install cargo-nextest"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    # Avoid paying for cleanup when the filesystem containing the workspace has
    # enough room. Persistent runners reclaim only their disposable Cargo
    # artifacts; only hosted images use the privileged cleanup fallback.
    - name: Guard workspace disk space
      shell: bash
      env:
        ASTRA_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        ASTRA_CI_TARGET_DIR: ${{ runner.workspace }}/.astra-ci-target
      run: |
        set -euxo pipefail
        disk_guard_workspace="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE must be set}"
        disk_guard_threshold_kib=$((30 * 1024 * 1024))
        measure_workspace_disk() {
          disk_guard_available_kib=""
          disk_guard_measurement="invalid"
          if disk_guard_available_kib="$(
            df -Pk "${disk_guard_workspace}" |
              awk 'NR == 2 { print $4; exit }'
          )"; then
            if [[ "${disk_guard_available_kib}" =~ ^[0-9]+$ ]]; then
              disk_guard_measurement="valid"
            fi
          else
            disk_guard_measurement="failed"
          fi
        }
        measure_workspace_disk

        if [[ "${ASTRA_CI_RUNNER_ENVIRONMENT:-}" == self-hosted &&
              "${disk_guard_measurement}" == valid ]]; then
          disk_guard_target="${ASTRA_CI_TARGET_DIR:?ASTRA_CI_TARGET_DIR must be set}"
          disk_guard_target_limit_kib=$((64 * 1024 * 1024))
          if [[ -e "${disk_guard_target}" || -L "${disk_guard_target}" ]]; then
            if ! disk_guard_target_kib="$(du -sk "${disk_guard_target}" | awk 'NR == 1 { print $1; exit }')" ||
               [[ ! "${disk_guard_target_kib}" =~ ^[0-9]+$ ]]; then
              echo "::error::Cannot measure retained Cargo artifacts; refusing cleanup."
              exit 1
            fi
            if (( disk_guard_target_kib > disk_guard_target_limit_kib ||
                  disk_guard_available_kib < disk_guard_threshold_kib )); then
              echo "Reclaiming disposable Cargo artifacts: size=${disk_guard_target_kib} KiB; limit=${disk_guard_target_limit_kib} KiB (64 GiB); free=${disk_guard_available_kib} KiB."
              rm -rf -- "${disk_guard_target}"
              measure_workspace_disk
            fi
          fi
        fi

        if [[ "${disk_guard_measurement}" == "valid" ]] &&
          (( disk_guard_available_kib >= disk_guard_threshold_kib )); then
          echo "Disk guard decision: skip cleanup; workspace filesystem free=${disk_guard_available_kib} KiB; threshold=${disk_guard_threshold_kib} KiB (30 GiB)."
        elif [[ "${ASTRA_CI_RUNNER_ENVIRONMENT:-}" == self-hosted ]]; then
          echo "::error::Disk guard decision: fail self-hosted; measurement=${disk_guard_measurement}; workspace filesystem free=${disk_guard_available_kib:-unavailable} KiB; threshold=${disk_guard_threshold_kib} KiB (30 GiB). Reclaim runner disk before retrying."
          exit 1
        else
          echo "Disk guard decision: run cleanup; measurement=${disk_guard_measurement}; workspace filesystem free=${disk_guard_available_kib:-unavailable} KiB; threshold=${disk_guard_threshold_kib} KiB (30 GiB)."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af 2>/dev/null || true
        fi

        df -h "${disk_guard_workspace}"
        if [[ "${ASTRA_CI_RUNNER_ENVIRONMENT:-}" == self-hosted ]]; then
          # Survive checkout cleanup within this runner's isolated account.
          echo "CARGO_TARGET_DIR=${ASTRA_CI_TARGET_DIR}" >> "$GITHUB_ENV"
        fi

    - name: Install pinned Rust toolchain
      uses: ./.github/actions/rust-toolchain

    - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
      if: ${{ inputs.install-nextest == 'true' }}
      with:
        tool: cargo-nextest@0.9.109

    - name: Install mold linker
      if: ${{ inputs.use-mold == 'true' && runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euxo pipefail
        # mold comes from Ubuntu. Do not refresh unrelated runner repositories
        # (e.g. Chrome), whose broken indexes can block every Rust CI shard.
        ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
        if [[ ! -s "${ubuntu_sources}" ]]; then
          ubuntu_sources=/etc/apt/sources.list
        fi
        test -s "${ubuntu_sources}"
        apt_options=(
          -o "Dir::Etc::sourcelist=${ubuntu_sources}"
          -o "Dir::Etc::sourceparts=-"
          -o "APT::Get::List-Cleanup=0"
          -o "APT::Update::Error-Mode=any"
        )
        if ! command -v mold >/dev/null; then
          if sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 "${apt_options[@]}" update &&
             sudo apt-get "${apt_options[@]}" install -y --no-install-recommends mold; then
            :
          else
            echo "::warning::mold installation failed; using the linker bundled with Rust"
          fi
        fi
        if command -v mold >/dev/null; then
          ci_linker=mold
        else
          ci_host="$(rustc -vV | sed -n 's/^host: //p')"
          ci_linker="$(rustc --print sysroot)/lib/rustlib/${ci_host}/bin/gcc-ld/ld.lld"
          test -x "${ci_linker}"
        fi
        if [[ -n "${RUSTFLAGS:-}" ]]; then
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=${ci_linker} ${RUSTFLAGS}" >> "$GITHUB_ENV"
        else
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=${ci_linker}" >> "$GITHUB_ENV"
        fi

    - name: Install sccache
      id: install_sccache
      if: ${{ inputs.use-sccache == 'true' }}
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      # Compiler caching is an optimization. A transient GitHub API or action
      # distribution failure must not suppress the actual compile/test gates.
      continue-on-error: true

    - name: Configure sccache
      if: ${{ inputs.use-sccache == 'true' && steps.install_sccache.outcome == 'success' }}
      shell: bash
      env:
        ASTRA_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: scripts/ci/configure-sccache.sh

    - name: Report sccache fallback
      if: ${{ always() && inputs.use-sccache == 'true' && steps.install_sccache.outcome != 'success' }}
      shell: bash
      run: |
        echo "::warning::sccache setup failed; continuing with uncached Rust compilation"
        echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      if: ${{ runner.environment != 'self-hosted' }}
      # Restoring build artifacts is also an optimization. Every caller runs a
      # compiler/test gate afterwards, so cache-service failures remain visible
      # as slower builds rather than false CI failures.
      continue-on-error: true
      with:
        workspaces: .
        shared-key: ${{ inputs.shared-key }}-${{ github.base_ref || github.ref_name }}
        save-if: ${{ inputs.save-cache }}
