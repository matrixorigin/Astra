name: "Rust CI Setup"
description: "Install Rust toolchain + nextest, configure build cache"

inputs:
  shared-key:
    description: "Cache shared-key suffix (e.g. ci-test-main, ci-check-main)"
    required: false
    default: "ci-test"
  save-cache:
    description: "Whether to save cache (true/false)"
    required: false
    default: "false"
  use-sccache:
    description: "Enable sccache with the GitHub Actions cache backend"
    required: false
    default: "true"
  use-mold:
    description: "Use mold as the Linux linker"
    required: false
    default: "true"
  install-nextest:
    description: "Install cargo-nextest"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    # Avoid paying for cleanup when the filesystem containing the workspace has
    # enough room. Keep the cleanup fallback for low or unreadable disk space.
    - name: Guard workspace disk space
      shell: bash
      run: |
        set -euxo pipefail
        disk_guard_workspace="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE must be set}"
        disk_guard_threshold_kib=$((30 * 1024 * 1024))
        disk_guard_available_kib=""
        disk_guard_measurement="invalid"

        if disk_guard_available_kib="$(
          df -Pk "${disk_guard_workspace}" |
            awk 'NR == 2 { print $4; exit }'
        )"; then
          if [[ "${disk_guard_available_kib}" =~ ^[0-9]+$ ]]; then
            disk_guard_measurement="valid"
          fi
        else
          disk_guard_measurement="failed"
        fi

        if [[ "${disk_guard_measurement}" == "valid" ]] &&
          (( disk_guard_available_kib >= disk_guard_threshold_kib )); then
          echo "Disk guard decision: skip cleanup; workspace filesystem free=${disk_guard_available_kib} KiB; threshold=${disk_guard_threshold_kib} KiB (30 GiB)."
        else
          echo "Disk guard decision: run cleanup; measurement=${disk_guard_measurement}; workspace filesystem free=${disk_guard_available_kib:-unavailable} KiB; threshold=${disk_guard_threshold_kib} KiB (30 GiB)."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af 2>/dev/null || true
        fi

        df -h "${disk_guard_workspace}"

    - name: Install pinned Rust toolchain
      # The repository toolchain also owns test-created Cargo fixtures.
      shell: bash
      run: rustc --version

    - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
      if: ${{ inputs.install-nextest == 'true' }}
      with:
        tool: cargo-nextest@0.9.109

    - name: Install mold linker
      if: ${{ inputs.use-mold == 'true' && runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euxo pipefail
        # mold comes from Ubuntu. Do not refresh unrelated runner repositories
        # (e.g. Chrome), whose broken indexes can block every Rust CI shard.
        ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
        if [[ ! -s "${ubuntu_sources}" ]]; then
          ubuntu_sources=/etc/apt/sources.list
        fi
        test -s "${ubuntu_sources}"
        apt_options=(
          -o "Dir::Etc::sourcelist=${ubuntu_sources}"
          -o "Dir::Etc::sourceparts=-"
          -o "APT::Get::List-Cleanup=0"
          -o "APT::Update::Error-Mode=any"
        )
        sudo apt-get "${apt_options[@]}" update
        sudo apt-get "${apt_options[@]}" install -y --no-install-recommends mold
        if [[ -n "${RUSTFLAGS:-}" ]]; then
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold ${RUSTFLAGS}" >> "$GITHUB_ENV"
        else
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
        fi

    - name: Install sccache
      id: install_sccache
      if: ${{ inputs.use-sccache == 'true' }}
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      # Compiler caching is an optimization. A transient GitHub API or action
      # distribution failure must not suppress the actual compile/test gates.
      continue-on-error: true

    - name: Configure sccache
      if: ${{ inputs.use-sccache == 'true' && steps.install_sccache.outcome == 'success' }}
      shell: bash
      run: scripts/ci/configure-sccache.sh

    - name: Report sccache fallback
      if: ${{ always() && inputs.use-sccache == 'true' && steps.install_sccache.outcome != 'success' }}
      shell: bash
      run: |
        echo "::warning::sccache setup failed; continuing with uncached Rust compilation"
        echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Restoring build artifacts is also an optimization. Every caller runs a
      # compiler/test gate afterwards, so cache-service failures remain visible
      # as slower builds rather than false CI failures.
      continue-on-error: true
      with:
        workspaces: .
        shared-key: ${{ inputs.shared-key }}-${{ github.base_ref || github.ref_name }}
        save-if: ${{ inputs.save-cache }}
