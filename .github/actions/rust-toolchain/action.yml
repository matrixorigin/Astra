name: Install repository Rust toolchain
description: Bootstrap rustup and install the toolchain from rust-toolchain.toml
runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain
      shell: bash
      run: |
        set -euo pipefail
        ci_cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
        export PATH="$ci_cargo_bin:$PATH"
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 --retry 3 --location --silent --show-error --fail \
            https://sh.rustup.rs | sh -s -- --default-toolchain none --no-modify-path -y
        fi
        echo "$ci_cargo_bin" >> "$GITHUB_PATH"
        # Resolve the repository pin rather than a runner service override.
        unset RUSTUP_TOOLCHAIN
        # Older rustup installs implicitly on show; newer versions require the
        # explicit install. Both read the repository file, including components.
        rustup show active-toolchain || rustup toolchain install
        ci_rust_toolchain="$(rustup show active-toolchain)"
        ci_rust_toolchain="${ci_rust_toolchain%% *}"
        test -n "$ci_rust_toolchain"
        export RUSTUP_TOOLCHAIN="$ci_rust_toolchain"
        echo "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" >> "$GITHUB_ENV"
        rustc --version
