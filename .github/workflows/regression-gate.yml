name: Regression Gate

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'skills/**'
      - 'config/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  regression-gate:
    runs-on: ubuntu-latest

    env:
      MATRIXONE_HOST: localhost
      MATRIXONE_PORT: "6001"
      MATRIXONE_USER: root
      MATRIXONE_PASSWORD: "111"
      MATRIXONE_DATABASE: astra_runtime
      MATRIXONE_AUTO_CREATE_DATABASE: "1"
      JWT_SECRET_KEY: ci-jwt-secret-key-at-least-32-chars-long
      SECRET_KEY: ci-app-secret-key-at-least-32-chars-long
      TOKEN_ENCRYPTION_KEY: ci-token-encryption-key-at-least-32-chars
      CHAT_TURN_BRIDGE_SECRET: dev-bridge-secret-change-me
      MEMORIA_BASE_URL: http://localhost:8100
      MEMORIA_MASTER_KEY: ci-test-master-key
      MEMORIA_EMBEDDING_PROVIDER: mock
      MEMORIA_EMBEDDING_DIM: "384"

    steps:
      - uses: actions/checkout@v4
      - name: Prepare dependency env
        run: |
          cp .env.example .env
          {
            echo "MEMORIA_MASTER_KEY=${MEMORIA_MASTER_KEY}"
            echo "MEMORIA_EMBEDDING_PROVIDER=${MEMORIA_EMBEDDING_PROVIDER}"
            echo "MEMORIA_EMBEDDING_DIM=${MEMORIA_EMBEDDING_DIM}"
          } >> .env
      - name: Start dependencies
        run: make dev-deps-up
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: ci-online
          save-if: false
      - name: Wait for dependencies
        run: make dev-deps-wait

      - name: Run contract tests
        id: gate
        run: |
          if make test-contract; then
            echo '{"verdict":"pass","summary":"Contract tests passed"}' > gate_result.json
          else
            echo '{"verdict":"fail","summary":"Contract tests failed"}' > gate_result.json
          fi

      - name: Comment on PR
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let result = { verdict: 'fail', summary: 'Contract tests did not produce a result' };
            try { result = JSON.parse(fs.readFileSync('gate_result.json', 'utf8')); } catch {}
            const emoji = result.verdict === 'pass' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Regression Gate\n\n${emoji} ${result.summary}`
            });

      - name: Check gate result
        if: always()
        run: |
          if [ ! -f gate_result.json ]; then
            echo "❌ gate_result.json not found"
            exit 1
          fi
          verdict=$(jq -r '.verdict' gate_result.json)
          if [ "$verdict" != "pass" ]; then
            echo "❌ Regression gate failed"
            exit 1
          fi
          echo "✅ Regression gate passed"

      - name: Dump dependency logs
        if: failure()
        run: make dev-deps-logs-once

      - name: Stop dependencies
        if: always()
        run: make dev-deps-down
