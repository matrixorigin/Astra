name: Regression Gate

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'skills/**'
      - 'config/**'

jobs:
  regression-gate:
    runs-on: ubuntu-latest

    services:
      matrixone:
        image: matrixorigin/matrixone:latest
        ports:
          - 6001:6001
        options: >-
          --health-cmd "curl -sf http://127.0.0.1:6060/debug/vars || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

      memoria:
        image: matrixorigin/memoria:latest
        ports:
          - 8100:8100
        env:
          DATABASE_URL: mysql://root:111@matrixone:6001/memoria
          MASTER_KEY: ci-test-master-key
          EMBEDDING_PROVIDER: mock
          EMBEDDING_DIM: "384"
        options: >-
          --health-cmd "curl -sf http://127.0.0.1:8100/health || exit 1"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 6
          --health-start-period 15s

    env:
      MATRIXONE_HOST: localhost
      MATRIXONE_PORT: "6001"
      MATRIXONE_USER: root
      MATRIXONE_PASSWORD: "111"
      MATRIXONE_DATABASE: astra_runtime
      MATRIXONE_AUTO_CREATE_DATABASE: "1"
      JWT_SECRET_KEY: ci-jwt-secret-key-at-least-32-chars-long
      SECRET_KEY: ci-app-secret-key-at-least-32-chars-long
      TOKEN_ENCRYPTION_KEY: ci-token-encryption-key-at-least-32-chars
      CHAT_TURN_BRIDGE_SECRET: dev-bridge-secret-change-me
      MEMORIA_BASE_URL: http://localhost:8100
      MEMORIA_MASTER_KEY: ci-test-master-key

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run contract tests
        id: gate
        run: |
          if make test-contract; then
            echo '{"verdict":"pass","summary":"Contract tests passed"}' > gate_result.json
          else
            echo '{"verdict":"fail","summary":"Contract tests failed"}' > gate_result.json
          fi
        continue-on-error: true

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('gate_result.json', 'utf8'));
            const emoji = result.verdict === 'pass' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Regression Gate\n\n${emoji} ${result.summary}`
            });

      - name: Check gate result
        run: |
          verdict=$(jq -r '.verdict' gate_result.json)
          if [ "$verdict" = "fail" ]; then
            echo "❌ Regression gate failed"
            exit 1
          fi
          echo "✅ Regression gate passed"
