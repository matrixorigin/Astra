name: Regression Gate

on:
  pull_request:
    paths:
      - 'prompts/**'
      - 'skills/**'
      - 'config/**'
      - 'core/skills/**'

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    
    services:
      matrixone:
        image: matrixorigin/matrixone:latest
        ports:
          - 6001:6001
        options: >-
          --health-cmd "mysql -h127.0.0.1 -P6001 -uroot -p111 -e 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Detect change type
        id: detect-change
        run: |
          # Detect what changed
          if git diff --name-only origin/main | grep -q '^prompts/'; then
            echo "change_type=prompt" >> $GITHUB_OUTPUT
            echo "change_id=prompt_$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT
          elif git diff --name-only origin/main | grep -q '^skills/'; then
            echo "change_type=skill" >> $GITHUB_OUTPUT
            echo "change_id=skill_$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT
          elif git diff --name-only origin/main | grep -q '^config/'; then
            echo "change_type=config" >> $GITHUB_OUTPUT
            echo "change_id=config_$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT
          else
            echo "change_type=selector" >> $GITHUB_OUTPUT
            echo "change_id=selector_$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT
          fi
      
      - name: Prepare change content
        run: |
          # Create change content JSON (placeholder - customize based on actual change)
          echo '{"version": "test", "content": "test change"}' > change.json
      
      - name: Run regression gate
        id: gate
        env:
          DATABASE_URL: mysql://root:111@localhost:6001/mo_agent
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m core.evaluation.gate_cli run \
            --change-type ${{ steps.detect-change.outputs.change_type }} \
            --change-id ${{ steps.detect-change.outputs.change_id }} \
            --change-file change.json \
            --sessions 50 \
            --error-threshold 0.05 \
            --score-threshold -0.1 \
            --output gate_result.json
        continue-on-error: true
      
      - name: Generate report
        if: always()
        run: |
          python -m core.evaluation.gate_cli report \
            --input gate_result.json \
            --format github-comment \
            --output gate_comment.md
      
      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('gate_comment.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Check gate result
        run: |
          # Check if gate was skipped or passed
          if [ -f gate_result.json ]; then
            verdict=$(jq -r '.verdict' gate_result.json)
            if [ "$verdict" = "fail" ]; then
              echo "❌ Regression gate failed"
              exit 1
            elif [ "$verdict" = "skip" ]; then
              echo "⚠️ Regression gate skipped (no golden sessions)"
              exit 0
            else
              echo "✅ Regression gate passed"
            fi
          else
            echo "⚠️ Gate result not found"
            exit 1
          fi
