name: Regression Gate

on:
  pull_request:
    paths:
      - 'prompts/**'
      - 'skills/**'
      - 'config/**'
      - 'rust/**'

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    
    services:
      matrixone:
        image: matrixorigin/matrixone:latest
        ports:
          - 6001:6001
        options: >-
          --health-cmd "mysql -h127.0.0.1 -P6001 -uroot -p111 -e 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-
      
      - name: Detect change type
        id: detect-change
        run: |
          # Detect what changed
          if git diff --name-only origin/main | grep -q '^prompts/'; then
            echo "change_type=prompt" >> $GITHUB_OUTPUT
            echo "change_id=prompt_$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT
          elif git diff --name-only origin/main | grep -q '^skills/'; then
            echo "change_type=skill" >> $GITHUB_OUTPUT
            echo "change_id=skill_$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT
          elif git diff --name-only origin/main | grep -q '^config/'; then
            echo "change_type=config" >> $GITHUB_OUTPUT
            echo "change_id=config_$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT
          else
            echo "change_type=selector" >> $GITHUB_OUTPUT
            echo "change_id=selector_$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT
          fi
      
      - name: Prepare change content
        run: |
          # Create change content JSON (placeholder - customize based on actual change)
          echo '{"version": "test", "content": "test change"}' > change.json
      
      - name: Run regression gate
        id: gate
        run: |
          if cargo test --manifest-path rust/Cargo.toml -p astra-runtime --test evaluation_contract; then
            echo '{"verdict":"pass","summary":"Rust evaluation contracts passed"}' > gate_result.json
          else
            echo '{"verdict":"fail","summary":"Rust evaluation contracts failed"}' > gate_result.json
          fi
        continue-on-error: true
      
      - name: Generate report
        if: always()
        run: |
          echo "## Regression Gate Result" > gate_comment.md
          echo "" >> gate_comment.md
          jq -r '.summary' gate_result.json >> gate_comment.md
      
      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('gate_comment.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Check gate result
        run: |
          # Check if gate was skipped or passed
          if [ -f gate_result.json ]; then
            verdict=$(jq -r '.verdict' gate_result.json)
            if [ "$verdict" = "fail" ]; then
              echo "❌ Regression gate failed"
              exit 1
            elif [ "$verdict" = "skip" ]; then
              echo "⚠️ Regression gate skipped (no golden sessions)"
              exit 0
            else
              echo "✅ Regression gate passed"
            fi
          else
            echo "⚠️ Gate result not found"
            exit 1
          fi
