name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      matrixone:
        image: matrixorigin/matrixone:latest
        ports:
          - 6001:6001
        options: >-
          --health-cmd "mysql -h127.0.0.1 -P6001 -uroot -p111 -e 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-dev-${{ hashFiles('poetry.lock') }}
          restore-keys: ${{ runner.os }}-poetry-dev-

      # Single source of truth for dev dependencies — see Makefile.
      - name: Install dependencies
        run: make install-dev-deps

      - name: Run unit tests (parallel)
        env:
          DATABASE_URL: mysql://root:111@localhost:6001/mo_agent
          REDIS_URL: redis://localhost:6379/0
        run: |
          poetry run pytest tests/unit/ -n auto --dist loadscope -v --tb=short

      - name: Run integration tests (parallel)
        env:
          DATABASE_URL: mysql://root:111@localhost:6001/mo_agent
          REDIS_URL: redis://localhost:6379/0
        run: |
          poetry run pytest tests/integration/ -n auto --dist loadscope -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .pytest_cache/
            test-results.xml
