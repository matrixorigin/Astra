name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Offline: split by crate for parallel execution and easier fault isolation ──

  test-offline-cli:
    name: "Offline: astra-cli"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: ci-offline
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # astra-cli is binary-only (no lib target, no crate-root integration tests/).
      # Partition by Rust test path: `edge_tools::` marks tests under src/edge_tools/.
      # `source()` is invalid filterset DSL; `/edge_tools/` alone parses as a broken regex.
      - name: "Test astra-cli (bins: non-edge_tools modules)"
        run: >-
          cargo nextest run --manifest-path rust/Cargo.toml -p astra-cli --bins
          -E 'not test(/edge_tools::/)' --no-fail-fast
      - name: "Test astra-cli (bins: edge_tools)"
        run: >-
          cargo nextest run --manifest-path rust/Cargo.toml -p astra-cli --bins
          -E 'test(/edge_tools::/)' --no-fail-fast

  test-offline-runtime:
    name: "Offline: astra-runtime"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: ci-offline
          save-if: false
      - name: Test astra-runtime (default features)
        run: cargo nextest run --manifest-path rust/Cargo.toml -p astra-runtime --no-fail-fast
      - name: Test trusted_moi auth integration
        run: cargo nextest run --manifest-path rust/Cargo.toml -p astra-runtime --test trusted_moi_auth_integration --no-capture

  test-offline-runtime-e2e:
    name: "Offline: bridge-e2e-hooks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: ci-offline
          save-if: false
      - name: Test bridge-e2e-hooks
        run: cargo nextest run --manifest-path rust/Cargo.toml -p astra-runtime --features bridge-e2e-hooks --no-fail-fast

  test-offline-services:
    name: "Offline: astra-services"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: ci-offline
          save-if: false
      - name: Test astra-services
        run: cargo nextest run --manifest-path rust/Cargo.toml -p astra-services --no-fail-fast

  test-offline-core:
    name: "Offline: core crates"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: ci-offline
          save-if: false
      - name: Test all core crates
        run: >-
          cargo nextest run --manifest-path rust/Cargo.toml
          -p astra-core -p astra-thin-client -p astra-admin-cli
          -p astra-tools -p astra-pipeline -p astra-turn-types
          -p astra-skills -p astra-sandbox
          --no-fail-fast

  # ── Online: needs MatrixOne + Memoria ─────────────────────────────────
  test-online:
    name: Online Tests
    runs-on: ubuntu-latest
    env:
      MATRIXONE_HOST: localhost
      MATRIXONE_PORT: "6001"
      MATRIXONE_USER: root
      MATRIXONE_PASSWORD: "111"
      MATRIXONE_DATABASE: astra_runtime
      MATRIXONE_DATABASE_PREFIX: "test_"
      MATRIXONE_AUTO_CREATE_DATABASE: "1"
      JWT_SECRET_KEY: ci-jwt-secret-key-at-least-32-chars-long
      SECRET_KEY: ci-app-secret-key-at-least-32-chars-long
      TOKEN_ENCRYPTION_KEY: ci-token-encryption-key-at-least-32-chars
      ASTRA_BRIDGE_TEST_SECRET: system-matrix-e2e-secret
      CHAT_TURN_BRIDGE_SECRET: dev-bridge-secret-change-me
      MEMORIA_BASE_URL: http://localhost:8100
      MEMORIA_MASTER_KEY: ci-test-master-key
      MEMORIA_EMBEDDING_PROVIDER: mock
      MEMORIA_EMBEDDING_DIM: "384"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare dependency env
        run: |
          cp .env.example .env
          {
            echo "MEMORIA_MASTER_KEY=${MEMORIA_MASTER_KEY}"
            echo "MEMORIA_EMBEDDING_PROVIDER=${MEMORIA_EMBEDDING_PROVIDER}"
            echo "MEMORIA_EMBEDDING_DIM=${MEMORIA_EMBEDDING_DIM}"
          } >> .env
      - name: Start dependencies
        run: make dev-deps-up
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: ci-online
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Wait for dependencies
        run: make dev-deps-wait
      - name: Run online tests
        env:
          ASTRA_SYSTEM_MATRIX_E2E: "1"
          ASTRA_SYSTEM_MATRIX_E2E_TEST_THREADS: "1"
          ASTRA_MULTI_AGENT_IT: "1"
          ASTRA_SERVICES_DB_IT: "1"
        run: make test-online
      - name: Dump dependency logs
        if: failure()
        run: make dev-deps-logs-once
      - name: Stop dependencies
        if: always()
        run: make dev-deps-down
