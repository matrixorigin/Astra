name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Stage 1: compile once, cache for all downstream jobs ───────────
  build:
    name: "Build & Cache"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: ci-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Compile all test binaries (default + bridge-e2e-hooks) without running
      - name: Compile test binaries
        run: |
          cargo nextest run --manifest-path rust/Cargo.toml --workspace --no-run
          cargo nextest run --manifest-path rust/Cargo.toml -p astra-runtime --features bridge-e2e-hooks --no-run

  # ── Stage 2: parallel offline test shards (all need: build) ────────
  #
  # Shard balance (test counts):
  #   shard-a: astra-cli (2550)                    — heaviest, shell tests need process isolation
  #   shard-b: astra-runtime (3151) + contracts (19) + trusted_moi (4)
  #   shard-c: astra-turn-core (2167) + astra-services (1186)
  #   shard-d: core crates ~2460 + bridge-e2e-hooks (3176, mostly overlaps runtime)

  shard-a:
    name: "Test: astra-cli"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: ci-test
          save-if: false
      - name: "Test astra-cli (non-edge_tools)"
        run: >-
          cargo nextest run --manifest-path rust/Cargo.toml -p astra-cli
          --profile ci --bins -E 'not test(/edge_tools::/)'
      - name: "Test astra-cli (edge_tools)"
        timeout-minutes: 15
        run: >-
          cargo nextest run --manifest-path rust/Cargo.toml -p astra-cli
          --profile ci --bins -E 'test(/edge_tools::/)'
      - name: Dump processes on failure
        if: failure()
        run: ps -ef | grep -E 'cargo|nextest|astra|bash|sleep' || true

  shard-b:
    name: "Test: astra-runtime"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: ci-test
          save-if: false
      - name: Test astra-runtime
        run: >-
          cargo nextest run --manifest-path rust/Cargo.toml -p astra-runtime
          --profile ci
      - name: Test contract (http + admin + settings)
        run: |
          cargo nextest run --manifest-path rust/Cargo.toml -p astra-runtime --profile ci --test http_contract --test admin_contract
          cargo nextest run --manifest-path rust/Cargo.toml -p astra-core --profile ci --lib -E 'test(/settings_contract/)'
      - name: Test trusted_moi auth integration
        run: >-
          cargo nextest run --manifest-path rust/Cargo.toml -p astra-runtime
          --profile ci --test trusted_moi_auth_integration
      - name: Comment contract failure on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Regression Gate\n\n❌ Contract tests failed — see [shard-b logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`
            });

  shard-c:
    name: "Test: turn-core + services"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: ci-test
          save-if: false
      - name: Test astra-turn-core + astra-services
        run: >-
          cargo nextest run --manifest-path rust/Cargo.toml
          -p astra-turn-core -p astra-services
          --profile ci

  shard-d:
    name: "Test: core crates + bridge hooks"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: ci-test
          save-if: false
      - name: Test core crates
        run: >-
          cargo nextest run --manifest-path rust/Cargo.toml
          -p astra-core -p astra-thin-client -p astra-admin-cli
          -p astra-tools -p astra-pipeline -p astra-turn-types
          -p astra-skills -p astra-sandbox -p astra-server-types
          -p astra-messaging -p astra-text-utils
          -p astra-config -p astra-learning
          -p astra-plan -p astra-prompts
          --profile ci
      - name: Test bridge-e2e-hooks
        run: >-
          cargo nextest run --manifest-path rust/Cargo.toml -p astra-runtime
          --features bridge-e2e-hooks --profile ci

  # ── Stage 3: online tests (needs DB, runs after offline passes) ────
  test-online:
    name: "Test: online (DB)"
    needs: [shard-a, shard-b, shard-c, shard-d]
    runs-on: ubuntu-latest
    env:
      MATRIXONE_HOST: localhost
      MATRIXONE_PORT: "6001"
      MATRIXONE_USER: root
      MATRIXONE_PASSWORD: "111"
      MATRIXONE_DATABASE: astra_runtime
      MATRIXONE_DATABASE_PREFIX: "test_"
      MATRIXONE_AUTO_CREATE_DATABASE: "1"
      JWT_SECRET_KEY: ci-jwt-secret-key-at-least-32-chars-long
      SECRET_KEY: ci-app-secret-key-at-least-32-chars-long
      TOKEN_ENCRYPTION_KEY: ci-token-encryption-key-at-least-32-chars
      ASTRA_BRIDGE_TEST_SECRET: system-matrix-e2e-secret
      CHAT_TURN_BRIDGE_SECRET: dev-bridge-secret-change-me
      MEMORIA_BASE_URL: http://localhost:8100
      MEMORIA_MASTER_KEY: ci-test-master-key
      MEMORIA_EMBEDDING_PROVIDER: mock
      MEMORIA_EMBEDDING_DIM: "384"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare dependency env
        run: |
          cp .env.example .env
          {
            echo "MEMORIA_MASTER_KEY=${MEMORIA_MASTER_KEY}"
            echo "MEMORIA_EMBEDDING_PROVIDER=${MEMORIA_EMBEDDING_PROVIDER}"
            echo "MEMORIA_EMBEDDING_DIM=${MEMORIA_EMBEDDING_DIM}"
          } >> .env
      - name: Start dependencies
        run: make dev-deps-up
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: ci-test
          save-if: false
      - name: Wait for dependencies
        run: make dev-deps-wait
      - name: Run online tests
        env:
          ASTRA_SYSTEM_MATRIX_E2E: "1"
          ASTRA_SYSTEM_MATRIX_E2E_TEST_THREADS: "1"
          ASTRA_MULTI_AGENT_IT: "1"
          ASTRA_SERVICES_DB_IT: "1"
        run: make test-online
      - name: Dump dependency logs
        if: failure()
        run: make dev-deps-logs-once
      - name: Stop dependencies
        if: always()
        run: make dev-deps-down
