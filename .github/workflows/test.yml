name: Test Suite
run-name: >-
  Test Suite pr=${{ github.event.pull_request.number || 0 }} base=${{ github.event.pull_request.base.sha || github.event.before }} head=${{ github.event.pull_request.head.sha || github.sha }} merge=${{ github.sha }}

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  scope:
    name: Determine test scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos_runner: ${{ steps.scope.outputs.macos_runner }}
      test_cli: ${{ steps.scope.outputs.test_cli }}
      test_runtime: ${{ steps.scope.outputs.test_runtime }}
      test_services: ${{ steps.scope.outputs.test_services }}
      test_core: ${{ steps.scope.outputs.test_core }}
      online_core: ${{ steps.scope.outputs.online_core }}
      online_integration: ${{ steps.scope.outputs.online_integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A PR merge commit plus both parents is enough for the path diff.
          # Detection falls back to all scopes if a longer push range is absent.
          fetch-depth: 2
          persist-credentials: false
      - name: Classify changed paths
        id: scope
        env:
          ASTRA_MACOS_MAIN_ENABLED: ${{ vars.ASTRA_MACOS_MAIN_ENABLED == '1' && '1' || '0' }}
        run: python3 scripts/ci/ci_scope.py

  macos-plan:
    name: Resolve macOS execution
    needs: scope
    if: >-
      !cancelled() && github.run_attempt == 1 &&
      (needs.scope.outputs.test_cli == 'true' || needs.scope.outputs.test_core == 'true') &&
      contains(fromJSON(needs.scope.outputs.macos_runner || '[]'), 'self-hosted')
    runs-on: ubuntu-latest
    timeout-minutes: 82
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      result: ${{ steps.mini.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Wait for a bounded mini attempt
        id: mini
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/macos_dispatch.py wait --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

  # Package groups remain parallel. CLI builds and executes its full inventory
  # once; stable protected labels require that same completed test result.
  # Short CLI partitions are not the workflow critical path, so separate
  # artifact consumers only repeat setup, download and extraction work.
  #
  # Runtime profile guardrails are intentionally covered across these shards
  # instead of running `make test-runtime-profiles` as a separate CI job. That
  # target is a focused local/PR triage gate; in CI, shard-b covers astra-runtime
  # default-feature profile tests, shard-d covers runtime-env/edge plus bridge
  # hook web-agent E2E, shard-a covers the CLI-local lib guardrail, and
  # static-checks.yml covers the web Vitest files. This keeps the invariant
  # protected without repeating the same Rust/Web tests in an extra job.

  cli-test-build:
    name: "Test: shared CLI executables"
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.test_cli == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: ci-test
          save-cache: ${{ github.event_name == 'push' }}
      - name: Prebuild mock MCP server
        run: cargo build --locked -p astra-cli --bin mock_mcp_server
      - name: Test complete CLI inventory
        run: cargo nextest run --locked -p astra-cli --lib --bins --test cli_pipe --test process_supervisor --test shell_execution_boundaries --test cli_mcp_setup --profile ci
      - name: Verify native delivery through the production supervisor
        run: |
          cargo build --locked -p astra-cli --bin astra
          # Build the test target once; nextest gives each exact test its own process.
          # The strict profile leaves the complete inventory's CI JUnit file intact.
          ASTRA_NATIVE_HARNESS_SUPERVISOR_BIN="$PWD/target/debug/astra" \
            cargo nextest run --locked -p astra-cli --lib --profile strict \
            --run-ignored only --test-threads 1 --retries 0 -- --exact \
            cli::edge_lifecycle::native_delivery::tests::authenticated_shared_ws_executes_native_provider_through_cli_entrypoint \
            edge_tools::native_codex::tests::discovery_preserves_the_whole_budget_across_protocol_phases \
            cli::edge_lifecycle::native_delivery::tests::discovery_publishes_only_the_first_verified_path_client
      - name: Start isolated historical-client dependencies
        env:
          MEMORIA_MASTER_KEY: ci-test-master-key
          MEMORIA_EMBEDDING_PROVIDER: mock
        run: >-
          docker compose --env-file .env.example
          -f deployment/all-in-one/docker-compose.deps.yml
          up -d --wait --wait-timeout 180 matrixone memoria
      - name: Restore released client components
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/historical-clients/*.tar.gz
          key: historical-clients-linux-amd64-${{ hashFiles('scripts/ci/historical-clients.json') }}
      - name: Test historical and already-built current CLI against the fresh Server
        env:
          MATRIXONE_HOST: localhost
          MATRIXONE_PORT: "6001"
          MATRIXONE_USER: root
          MATRIXONE_PASSWORD: "111"
          ASTRA_TEST_DB_IT: "1"
          ASTRA_JWT_SECRET: ci-jwt-secret-key-at-least-32-chars-long
          ASTRA_TOKEN_ENCRYPTION_KEY: ci-token-encryption-key-at-least-32-chars
          ASTRA_RUNTIME_ROOT_SECRET: ci-runtime-root-secret-at-least-32-chars
          MEMORIA_BASE_URL: http://localhost:8100
          MEMORIA_MASTER_KEY: ci-test-master-key
          MEMORIA_SELF_HOSTED_MASTER_ACCESS: "1"
          ASTRA_COMPAT_ARTIFACTS: ${{ github.workspace }}/target/historical-clients
          ASTRA_COMPAT_REPORT: ${{ github.workspace }}/target/client-compatibility.json
          ASTRA_COMPAT_CURRENT_CLI_BIN: ${{ github.workspace }}/target/debug/astra
          ASTRA_COMPAT_SERVER_SOURCE: ${{ github.sha }}
          RUST_MIN_STACK: "16777216"
        run: cargo test --locked -p astra-runtime --features moi-compat-tests --test client_compatibility -- --include-ignored --nocapture
      - name: Stop isolated historical-client dependencies
        if: always()
        run: >-
          docker compose --env-file .env.example
          -f deployment/all-in-one/docker-compose.deps.yml down -v
      - name: Retain CLI test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-timings-${{ github.run_attempt }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 3

  shard-a:
    name: "Test: astra-cli (${{ matrix.segment }})"
    needs: [scope, cli-test-build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUN_TESTS: ${{ needs.scope.result != 'success' || needs.scope.outputs.test_cli == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        segment: [non-edge, edge-shell, edge-fs-tools, edge-git-gix, edge-rest]

    steps:
      - name: Skip unaffected test segment
        if: env.RUN_TESTS != 'true'
        run: echo "No astra-cli test impact detected."
      - name: Require complete CLI test result
        if: env.RUN_TESTS == 'true'
        env:
          TEST_RESULT: ${{ needs.cli-test-build.result }}
        run: test "$TEST_RESULT" = success

  shard-b:
    name: "Test: astra-runtime"
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.test_runtime == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: ci-test
      - name: Test astra-runtime
        run: >-
          cargo nextest run --manifest-path Cargo.toml -p astra-runtime
          --profile ci
      - name: Measure history compaction work (offline)
        run: make test-history-work NEXTEST_OFFLINE_PROFILE=ci

  shard-c:
    name: "Test: turn-core + services + plan"
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.test_services == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: ci-test
      - name: Test astra-turn-core + astra-services + astra-plan
        run: >-
          cargo nextest run --manifest-path Cargo.toml
          -p astra-turn-core -p astra-services
          -p astra-plan -p astra-prompts
          --profile ci

  shard-d:
    name: "Test: core crates + bridge hooks"
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.test_core == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: ci-test
      - name: Test core crates
        run: >-
          cargo nextest run --manifest-path Cargo.toml
          -p astra-core -p astra-thin-client -p astra-runtime-env
          -p astra-tools -p astra-pipeline -p astra-turn-types
          -p astra-skills -p astra-sandbox -p astra-server-types
          -p astra-messaging -p astra-text-utils
          -p astra-config -p astra-edge
          -p astra-credentials -p astra-mcp -p astra-memoria
          -p astra-harness -p astra-test-harness
          -p astra-logging -p astra-sync-protocol
          --profile ci
      - name: Test server e2e-hooks (selective)
        env:
          RUST_MIN_STACK: "16777216"
        run: >-
          cargo nextest run --manifest-path Cargo.toml -p astra-runtime
          --features e2e-hooks --profile ci
          -E 'test(/bridge/) or test(/e2e/) or binary(phase_r5_mock_lifecycle_e2e) or binary(phase_r6_unhappy_lifecycle) or binary(phase_r7_context_design_invariants) or binary(phase_j_prompt_cache_gaps) or binary(cache_provider_matrix_e2e) or test(/web_agent/) or test(/mock_llm/)'

  vendored-terminal:
    name: "Test: vendored terminal (${{ matrix.os }})"
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.test_cli == 'true' || needs.scope.outputs.test_core == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: ./.github/actions/rust-toolchain
      # The patched crate is deliberately outside the application workspace.
      # These are parser/unit tests, not the real-reader PTY regression suite.
      - name: Test vendored terminal units
        run: bash scripts/ci/run-macos-lanes.sh vendored

  # Preserve required check names while the reader/reflow builds stay isolated.
  # Both aggregate checks require the entire terminal matrix.
  terminal-pty:
    name: "Test: terminal PTY (${{ matrix.os }})"
    needs: [scope, terminal-pty-shards, terminal-pty-shards-macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - name: Require terminal PTY shards
        shell: bash
        env:
          SHARDS_RESULT: ${{ needs.terminal-pty-shards.result }}
          MACOS_RESULT: ${{ needs.terminal-pty-shards-macos.result }}
          SHARDS_REQUIRED: ${{ needs.scope.result != 'success' || needs.scope.outputs.test_cli == 'true' || needs.scope.outputs.test_core == 'true' }}
        run: |
          set -euo pipefail
          for result in "$SHARDS_RESULT" "$MACOS_RESULT"; do
            if [ "$SHARDS_REQUIRED" = true ]; then
              test "$result" = success
            else
              case "$result" in success|skipped) ;; *) exit 1 ;; esac
            fi
          done

  terminal-pty-shards:
    name: "Terminal: ${{ matrix.segment }} (${{ matrix.os }})"
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.test_cli == 'true' || needs.scope.outputs.test_core == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        segment: [default-reader, dev-tty-reader, reflow]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: ci-terminal-pty
          # One writer per OS populates the shared dependency cache on pushes.
          save-cache: ${{ github.event_name == 'push' && matrix.segment == 'default-reader' }}
          install-nextest: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: matrix.segment == 'reflow'
        with:
          node-version-file: .nvmrc
      - name: Test terminal lane
        env:
          MACOS_LANE: ${{ matrix.segment }}
        run: bash scripts/ci/run-macos-lanes.sh "$MACOS_LANE"

  macos-workspace-coordination:
    name: "Test: macOS workspace coordination"
    needs: [scope, macos-workspace-coordination-tests, terminal-pty-shards, terminal-pty-shards-macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require macOS coordination and CLI execution
        shell: bash
        env:
          COORDINATION_RESULT: ${{ needs.macos-workspace-coordination-tests.result }}
          TERMINAL_RESULT: ${{ needs.terminal-pty-shards.result }}
          MACOS_TERMINAL_RESULT: ${{ needs.terminal-pty-shards-macos.result }}
          SHARDS_REQUIRED: ${{ needs.scope.result != 'success' || needs.scope.outputs.test_core == 'true' || needs.scope.outputs.test_cli == 'true' }}
        run: |
          set -euo pipefail
          for result in "$COORDINATION_RESULT" "$TERMINAL_RESULT" "$MACOS_TERMINAL_RESULT"; do
            if [ "$SHARDS_REQUIRED" = true ]; then
              test "$result" = success
            else
              case "$result" in success|skipped) ;; *) exit 1 ;; esac
            fi
          done

  vendored-terminal-macos:
    name: "Test: vendored terminal (macos-15)"
    needs: [scope, macos-plan]
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.test_cli == 'true' || needs.scope.outputs.test_core == 'true') }}
    runs-on: ${{ (github.run_attempt > 1 || !contains(fromJSON('["success","failure","obsolete"]'), needs.macos-plan.outputs.result)) && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      RUN_LANE: ${{ github.run_attempt > 1 || !contains(fromJSON('["success","failure","obsolete"]'), needs.macos-plan.outputs.result) }}
      MINI_RESULT: ${{ needs.macos-plan.outputs.result }}
    steps:
      - name: Require actual mini result
        if: env.RUN_LANE != 'true'
        run: |
          set -euo pipefail
          test "$MINI_RESULT" = success
          echo 'All five macOS lanes passed on the mini; see Resolve macOS execution for the worker run.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.RUN_LANE == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        if: env.RUN_LANE == 'true'
      - name: Run hosted macOS lane
        if: env.RUN_LANE == 'true'
        env:
          MACOS_LANE: vendored
        run: bash scripts/ci/run-macos-lanes.sh "$MACOS_LANE"

  terminal-pty-shards-macos:
    name: "Terminal: ${{ matrix.segment }} (macos-15)"
    needs: [scope, macos-plan]
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.test_cli == 'true' || needs.scope.outputs.test_core == 'true') }}
    runs-on: ${{ (github.run_attempt > 1 || !contains(fromJSON('["success","failure","obsolete"]'), needs.macos-plan.outputs.result)) && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      RUN_LANE: ${{ github.run_attempt > 1 || !contains(fromJSON('["success","failure","obsolete"]'), needs.macos-plan.outputs.result) }}
      MINI_RESULT: ${{ needs.macos-plan.outputs.result }}
    strategy:
      fail-fast: false
      matrix:
        segment: [default-reader, dev-tty-reader, reflow]
    steps:
      - name: Require actual mini result
        if: env.RUN_LANE != 'true'
        run: |
          set -euo pipefail
          test "$MINI_RESULT" = success
          echo 'All five macOS lanes passed on the mini; see Resolve macOS execution for the worker run.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.RUN_LANE == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        if: env.RUN_LANE == 'true'
        with:
          shared-key: ci-terminal-pty
          save-cache: ${{ github.event_name == 'push' && matrix.segment == 'default-reader' }}
          install-nextest: "false"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: env.RUN_LANE == 'true' && matrix.segment == 'reflow'
        with:
          node-version-file: .nvmrc
      - name: Run hosted macOS lane
        if: env.RUN_LANE == 'true'
        env:
          MACOS_LANE: ${{ matrix.segment }}
        run: bash scripts/ci/run-macos-lanes.sh "$MACOS_LANE"

  macos-workspace-coordination-tests:
    name: "macOS workspace coordination contracts"
    needs: [scope, macos-plan]
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.test_cli == 'true' || needs.scope.outputs.test_core == 'true') }}
    runs-on: ${{ (github.run_attempt > 1 || !contains(fromJSON('["success","failure","obsolete"]'), needs.macos-plan.outputs.result)) && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      RUN_LANE: ${{ github.run_attempt > 1 || !contains(fromJSON('["success","failure","obsolete"]'), needs.macos-plan.outputs.result) }}
      MINI_RESULT: ${{ needs.macos-plan.outputs.result }}
    steps:
      - name: Require actual mini result
        if: env.RUN_LANE != 'true'
        run: |
          set -euo pipefail
          test "$MINI_RESULT" = success
          echo 'All five macOS lanes passed on the mini; see Resolve macOS execution for the worker run.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.RUN_LANE == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        if: env.RUN_LANE == 'true'
        with:
          shared-key: ci-terminal-pty
          save-cache: "false"
          install-nextest: "false"
      - name: Run hosted macOS lane
        if: env.RUN_LANE == 'true'
        env:
          MACOS_LANE: coordination
        run: bash scripts/ci/run-macos-lanes.sh "$MACOS_LANE"

  # Preserve the required core check while its package groups run separately.
  # The aggregate requires all selected online jobs, including integration.
  test-online-core:
    name: "Test: online (core)"
    needs: [test-online, moi-compatibility]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require online shards
        shell: bash
        env:
          SHARDS_RESULT: ${{ needs.test-online.result }}
          MOI_RESULT: ${{ needs.moi-compatibility.result }}
        run: |
          set -euo pipefail
          test "$SHARDS_RESULT" = success
          test "$MOI_RESULT" = success

  # Always exercise the frozen consumer, independently of path classification.
  # The existing required online aggregate also requires this job to succeed.
  moi-compatibility:
    name: "Test: MOI fresh-Astra compatibility"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MATRIXONE_HOST: localhost
      MATRIXONE_PORT: "6001"
      MATRIXONE_USER: root
      MATRIXONE_PASSWORD: "111"
      ASTRA_TEST_DB_IT: "1"
      ASTRA_JWT_SECRET: ci-jwt-secret-key-at-least-32-chars-long
      ASTRA_TOKEN_ENCRYPTION_KEY: ci-token-encryption-key-at-least-32-chars
      ASTRA_RUNTIME_ROOT_SECRET: ci-runtime-root-secret-at-least-32-chars
      MEMORIA_MASTER_KEY: ci-test-master-key
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: ci-test
          install-nextest: "false"
      - name: Start isolated MatrixOne
        run: >-
          docker compose --env-file .env.example
          -f deployment/all-in-one/docker-compose.deps.yml
          up -d --wait --wait-timeout 180 matrixone
      - name: Test historical MOI against fresh Astra
        timeout-minutes: 25
        run: |
          cargo clippy --locked -p astra-runtime --features moi-compat-tests --test moi_fresh_astra -- -D warnings
          cargo test --locked -p astra-runtime --features moi-compat-tests --test moi_fresh_astra -- --include-ignored --nocapture
      - name: Dump MatrixOne logs
        if: failure()
        run: >-
          docker compose --env-file .env.example
          -f deployment/all-in-one/docker-compose.deps.yml logs --tail 200 matrixone
      - name: Stop isolated dependencies
        if: always()
        run: >-
          docker compose --env-file .env.example
          -f deployment/all-in-one/docker-compose.deps.yml down -v

  # Each online job owns a separate MatrixOne/Memoria stack. Keep tests serial
  # within that stack; parallelism comes from isolated runners, not DB pressure.
  test-online:
    name: "Test: online (${{ matrix.lane }})"
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [core-runtime, core-turn-core, core-services, integration]
    env:
      RUN_TESTS: >-
        ${{ needs.scope.result != 'success' ||
            (matrix.lane != 'integration' && needs.scope.outputs.online_core == 'true') ||
            (matrix.lane == 'integration' && needs.scope.outputs.online_integration == 'true') }}
      MATRIXONE_HOST: localhost
      MATRIXONE_PORT: "6001"
      MATRIXONE_USER: root
      MATRIXONE_PASSWORD: "111"
      ASTRA_AUTO_CREATE_DATABASE: "1"
      ASTRA_JWT_SECRET: ci-jwt-secret-key-at-least-32-chars-long
      ASTRA_TOKEN_ENCRYPTION_KEY: ci-token-encryption-key-at-least-32-chars
      ASTRA_TEST_E2E_SECRET: ci-server-e2e-secret-at-least-32-chars
      ASTRA_RUNTIME_ROOT_SECRET: ci-runtime-root-secret-at-least-32-chars
      MEMORIA_BASE_URL: http://localhost:8100
      MEMORIA_MASTER_KEY: ci-test-master-key
      MEMORIA_EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_API_KEY != '' && 'openai' || 'mock' }}
      MEMORIA_EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      MEMORIA_EMBEDDING_BASE_URL: ${{ vars.EMBEDDING_BASE_URL || '' }}
      MEMORIA_EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'BAAI/bge-m3' }}
      MEMORIA_EMBEDDING_DIM: ${{ vars.EMBEDDING_DIM || '1024' }}
      ASTRA_ONLINE_LANE: ${{ matrix.lane }}
    steps:
      - name: Skip unaffected online lane
        if: env.RUN_TESTS != 'true'
        run: echo "No online-test impact detected."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.RUN_TESTS == 'true'
        with:
          persist-credentials: false
      - name: Prepare dependency env
        if: env.RUN_TESTS == 'true'
        run: |
          cp .env.example .env
          {
            echo "MEMORIA_MASTER_KEY=${MEMORIA_MASTER_KEY}"
            echo "MEMORIA_EMBEDDING_PROVIDER=${MEMORIA_EMBEDDING_PROVIDER}"
            printf 'MEMORIA_EMBEDDING_API_KEY=%s\n' "$MEMORIA_EMBEDDING_API_KEY"
            echo "MEMORIA_EMBEDDING_BASE_URL=${MEMORIA_EMBEDDING_BASE_URL}"
            echo "MEMORIA_EMBEDDING_MODEL=${MEMORIA_EMBEDDING_MODEL}"
            echo "MEMORIA_EMBEDDING_DIM=${MEMORIA_EMBEDDING_DIM}"
          } >> .env
      - name: Start dependencies
        if: env.RUN_TESTS == 'true'
        run: make dev-deps-up
      - uses: ./.github/actions/rust-setup
        if: env.RUN_TESTS == 'true'
        with:
          shared-key: ci-test
      - name: Wait for dependencies
        if: env.RUN_TESTS == 'true'
        run: make dev-deps-wait
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: env.RUN_TESTS == 'true' && matrix.lane == 'integration'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            packages/sdk/package-lock.json
            web/package-lock.json
      - name: Build Web for real Next integration
        if: env.RUN_TESTS == 'true' && matrix.lane == 'integration'
        run: |
          npm --prefix packages/sdk ci --ignore-scripts
          npm --prefix packages/sdk run build
          npm --prefix web ci
          npm --prefix web run build
      - name: Install Chromium for browser session recovery
        if: env.RUN_TESTS == 'true' && matrix.lane == 'integration'
        working-directory: web
        run: npm exec -- playwright install --with-deps chromium --only-shell
      - name: Run online tests
        if: env.RUN_TESTS == 'true'
        env:
          ASTRA_TEST_DB_IT: "1"
          ASTRA_TEST_DB_IT_TEST_THREADS: "1"
        run: make test-online NEXTEST_ONLINE_PROFILE=strict-online-ci
      - name: Dump dependency logs
        if: failure() && env.RUN_TESTS == 'true'
        run: make dev-deps-logs-once
      - name: Stop dependencies
        if: always() && env.RUN_TESTS == 'true'
        run: make dev-deps-down
