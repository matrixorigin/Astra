name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  MATRIXONE_HOST: localhost
  MATRIXONE_PORT: "6001"
  MATRIXONE_USER: root
  MATRIXONE_PASSWORD: "111"
  MATRIXONE_DATABASE: astra_runtime
  MATRIXONE_AUTO_CREATE_DATABASE: "1"
  JWT_SECRET_KEY: ci-jwt-secret-key-at-least-32-chars-long
  SECRET_KEY: ci-app-secret-key-at-least-32-chars-long
  TOKEN_ENCRYPTION_KEY: ci-token-encryption-key-at-least-32-chars
  ASTRA_BRIDGE_TEST_SECRET: system-matrix-e2e-secret
  CHAT_TURN_BRIDGE_SECRET: dev-bridge-secret-change-me
  MEMORIA_BASE_URL: http://localhost:8100
  MEMORIA_MASTER_KEY: ci-test-master-key

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      matrixone:
        image: matrixorigin/matrixone:latest
        ports:
          - 6001:6001
        options: >-
          --health-cmd "curl -sf http://127.0.0.1:6060/debug/vars || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

      memoria:
        image: matrixorigin/memoria:latest
        ports:
          - 8100:8100
        env:
          DATABASE_URL: mysql://root:111@matrixone:6001/memoria
          MASTER_KEY: ci-test-master-key
          EMBEDDING_PROVIDER: mock
          EMBEDDING_DIM: "384"
        options: >-
          --health-cmd "curl -sf http://127.0.0.1:8100/health || exit 1"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 6
          --health-start-period 15s

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Wait for dependencies
        run: |
          set -euo pipefail
          echo "Waiting for MatrixOne..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:6060/debug/vars >/dev/null 2>&1; then
              echo "MatrixOne is up"
              break
            fi
            echo "  waiting ($i/90)..."
            sleep 2
          done
          echo "Waiting for Memoria..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8100/health >/dev/null 2>&1; then
              echo "Memoria is up"
              break
            fi
            echo "  waiting ($i/60)..."
            sleep 2
          done

      - name: Run full test suite (test-offline + test-online)
        env:
          ASTRA_SYSTEM_MATRIX_E2E: "1"
          ASTRA_SYSTEM_MATRIX_E2E_TEST_THREADS: "1"
          ASTRA_MULTI_AGENT_IT: "1"
        run: make test
