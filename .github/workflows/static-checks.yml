name: Static Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-check-${{ hashFiles('poetry.lock') }}
          restore-keys: ${{ runner.os }}-poetry-check-
      # Static checks don't need sentence-transformers — use lighter install.
      - name: Install dependencies
        run: make install-check-deps
      - name: Run ruff
        run: poetry run ruff check .
      - name: Check formatting
        run: poetry run ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-check-${{ hashFiles('poetry.lock') }}
          restore-keys: ${{ runner.os }}-poetry-check-
      # Static checks don't need sentence-transformers — use lighter install.
      - name: Install dependencies
        run: make install-check-deps
      - name: Run mypy
        run: poetry run mypy sdk/ core/ api/
