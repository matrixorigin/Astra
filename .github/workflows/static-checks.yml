name: Static Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: ci-test-${{ github.base_ref || github.ref_name }}
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Run clippy
        run: make lint
      - name: Server tool schema guards (astra-tools)
        run: make check-server-tool-schemas
      - name: Check formatting
        run: make format-check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.1
      - name: cargo audit (RustSec advisory DB)
        working-directory: rust
        run: cargo audit

  sdk:
    name: "@astra/sdk (typecheck, test+coverage, build)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json
      - name: Install, typecheck, test with coverage gates, build
        working-directory: packages/sdk
        run: |
          npm ci
          npm run typecheck
          ASTRA_SDK_E2E=1 npm run test:coverage
          npm run build
