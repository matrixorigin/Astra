name: Static Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: ci-check
          save-cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Run clippy
        run: make lint
      - name: Check formatting
        run: make format-check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.1
      - name: cargo audit (RustSec advisory DB)
        working-directory: rust
        run: cargo audit

  sdk:
    name: "@astra/sdk (typecheck, test+coverage, build)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json
      - name: Install, typecheck, test with coverage gates, build
        working-directory: packages/sdk
        env:
          ASTRA_SDK_E2E: "1"
        run: |
          npm ci
          npm run ci

  web:
    name: "web (typecheck, test, build)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            packages/sdk/package-lock.json
            web/package-lock.json
      - name: Build local SDK dependency
        working-directory: packages/sdk
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Install, typecheck, test, build
        working-directory: web
        run: |
          npm ci
          npm run ci
