name: Build IDC Container Candidates

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      candidate_image:
        description: IDC staging repository for candidate manifests
        required: true
        type: string
      controller_sha:
        description: Trusted workflow and verification-script revision
        required: true
        type: string
      image_version:
        description: Candidate image version used for OCI metadata
        required: true
        type: string
      source_sha:
        description: Immutable source commit selected by the caller
        required: true
        type: string
      source_ref:
        description: Selected source branch or immutable commit for OCI metadata
        required: true
        type: string
      matrix_json:
        description: JSON platform build matrix
        required: true
        type: string
    # Values come from idc-publication after each job enters the Environment.
    # They may be empty in the caller; the runtime credential guard is required.
    secrets:
      IDC_REGISTRY_USERNAME:
        required: false
      IDC_REGISTRY_PASSWORD:
        required: false

env:
  IMAGE_NAME: ${{ inputs.candidate_image }}
  RELEASE_SOURCE_REF: ${{ inputs.source_ref }}
  RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
  RELEASE_IMAGE_VERSION: ${{ inputs.image_version }}

jobs:
  build:
    name: Build ${{ matrix.platform }} IDC candidate
    runs-on: ${{ matrix.runner }}
    environment: idc-publication
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix_json) }}

    steps:
      - name: Require IDC registry credentials
        shell: bash
        env:
          IDC_REGISTRY_USERNAME: ${{ secrets.IDC_REGISTRY_USERNAME }}
          IDC_REGISTRY_PASSWORD: ${{ secrets.IDC_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in IDC_REGISTRY_USERNAME IDC_REGISTRY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required IDC credential: ${key}"
              exit 1
            fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.controller_sha }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          path: source

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.CONTAINER_MIRROR_REGISTRY }}
          username: ${{ secrets.IDC_REGISTRY_USERNAME }}
          password: ${{ secrets.IDC_REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: source
          file: source/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_IMAGE_VERSION }}
            org.opencontainers.image.revision=${{ env.RELEASE_SOURCE_SHA }}
            org.opencontainers.image.source=https://github.com/matrixorigin/astra
          build-args: |
            IMAGE_VERSION=${{ env.RELEASE_IMAGE_VERSION }}
            IMAGE_REVISION=${{ env.RELEASE_SOURCE_SHA }}
            IMAGE_SOURCE_DIRTY=false
            IMAGE_BRANCH=${{ env.RELEASE_SOURCE_REF }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.slug }}
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.slug }},mode=max
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Export immutable digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build returned an invalid image digest: ${digest:-<empty>}" >&2
            exit 1
          fi
          touch "/tmp/digests/${digest#sha256:}"

      - name: Retain IDC candidate with a run-scoped immutable tag
        shell: bash
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          scripts/reconcile-docker-candidate-tag.sh \
            "${IMAGE_NAME}" \
            "astra-idc-candidate-${GITHUB_RUN_ID}-${{ matrix.slug }}-${digest#sha256:}" \
            "${digest}" \
            create

      - name: Upload IDC candidate digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: idc-digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: Verify ${{ matrix.platform }} IDC candidate
    needs: build
    runs-on: ${{ matrix.runner }}
    environment: idc-publication
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix_json) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.controller_sha }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: idc-digest-${{ matrix.slug }}
          path: /tmp/digest

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.CONTAINER_MIRROR_REGISTRY }}
          username: ${{ secrets.IDC_REGISTRY_USERNAME }}
          password: ${{ secrets.IDC_REGISTRY_PASSWORD }}

      - name: Start candidate through the released all-in-one path
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          digest_files=(/tmp/digest/*)
          if [ "${#digest_files[@]}" -ne 1 ]; then
            echo "Expected one candidate digest for ${{ matrix.platform }}, found ${#digest_files[@]}" >&2
            exit 1
          fi
          digest="$(basename "${digest_files[0]}")"
          if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Candidate artifact contains an invalid image digest: ${digest}" >&2
            exit 1
          fi
          release_image="${IMAGE_NAME}@sha256:${digest}"

          make stack-env
          sed -i "s|^ASTRA_IMAGE=.*|ASTRA_IMAGE=${release_image}|" deployment/all-in-one/.env
          sed -i 's|^MEMORIA_EMBEDDING_PROVIDER=.*|MEMORIA_EMBEDDING_PROVIDER=mock|' deployment/all-in-one/.env
          make stack-up

          revision="$(docker image inspect "${release_image}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [ "${revision}" != "${RELEASE_SOURCE_SHA}" ]; then
            echo "Candidate image revision ${revision:-<missing>} does not match ${RELEASE_SOURCE_SHA}" >&2
            exit 1
          fi
          image_version="$(docker image inspect "${release_image}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          if [ "${image_version}" != "${RELEASE_IMAGE_VERSION}" ]; then
            echo "Candidate image version ${image_version:-<missing>} does not match ${RELEASE_IMAGE_VERSION}" >&2
            exit 1
          fi

      - name: Verify health and exact memory round trip
        run: make stack-verify

      - name: Write IDC candidate summary
        shell: bash
        run: |
          {
            echo "## Verified Astra IDC candidate"
            echo "- Platform: \`${{ matrix.platform }}\`"
            echo "- Source: \`${RELEASE_SOURCE_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Show service logs after failure
        if: ${{ failure() }}
        working-directory: deployment/all-in-one
        run: docker compose --env-file .env logs --no-color --tail=200 api memoria matrixone || true

      - name: Remove candidate smoke stack
        if: ${{ always() }}
        run: make stack-clean || true
