# Validate PR metadata in the existing required check, without checking out code.
name: PR Title

permissions: {}

on:
  pull_request:
    types: [opened, edited, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Check PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          # Conventional Commits: type(scope?): description
          # Allowed types: feat, fix, docs, style, refactor, perf, test, chore, build, ci, revert
          PATTERN: '^(feat|fix|docs|style|refactor|perf|test|chore|build|ci|revert)(\([a-z0-9-]+\))?!?:\s+.+'
        run: |
          if echo "$TITLE" | grep -qE "$PATTERN"; then
            echo "✅ PR title OK: $TITLE"
          else
            echo "::error::Invalid PR title! Must follow Conventional Commits format."
            echo ""
            echo "✅ Examples:"
            echo "   feat(auth): add login with Google"
            echo "   fix(checkout): correct tax calculation"
            echo "   docs: update installation guide"
            echo "   ci: enforce PR title format"
            echo ""
            echo "❌ Your title: '$TITLE'"
            echo ""
            echo "📚 Learn more: https://www.conventionalcommits.org"
            exit 1
          fi
      - name: Validate capability assessment
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              body = json.load(source)["pull_request"].get("body") or ""
          # A raw first-line field, not a Markdown section or rendered-text check.
          line, separator, _ = body.partition("\n") if isinstance(body, str) else ("", "", "")
          if separator and line.endswith("\r"):
              line = line[:-1]
          disposition = re.fullmatch(r"Capability assessment: (Updated|Unchanged|N/A): ([^\r\n]*)", line) if len(line) <= 1024 else None
          explanation = disposition[2].strip() if disposition else ""
          placeholder = re.fullmatch(r"[\W_]*(?:TODO|TBD|None|N/?A|explanation)[\W_]*", explanation, re.IGNORECASE)
          if not re.search(r"[^\W_]", explanation) or placeholder or re.match(r"(?:TODO|TBD)\b", explanation, re.IGNORECASE):
              print("::error::Start the PR body with 'Capability assessment: Updated|Unchanged|N/A: explanation' (one disposition, at most 1024 characters).")
              sys.exit(1)
          print("Capability assessment supplied; reviewers verify its accuracy.")
          PY
