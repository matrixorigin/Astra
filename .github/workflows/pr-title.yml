# Validate PR metadata in the existing required check, without checking out code.
name: PR Title

permissions: {}

on:
  pull_request:
    types: [opened, edited, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Check PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          # Conventional Commits: type(scope?): description
          # Allowed types: feat, fix, docs, style, refactor, perf, test, chore, build, ci, revert
          PATTERN: '^(feat|fix|docs|style|refactor|perf|test|chore|build|ci|revert)(\([a-z0-9-]+\))?!?:\s+.+'
        run: |
          if echo "$TITLE" | grep -qE "$PATTERN"; then
            echo "✅ PR title OK: $TITLE"
          else
            echo "::error::Invalid PR title! Must follow Conventional Commits format."
            echo ""
            echo "✅ Examples:"
            echo "   feat(auth): add login with Google"
            echo "   fix(checkout): correct tax calculation"
            echo "   docs: update installation guide"
            echo "   ci: enforce PR title format"
            echo ""
            echo "❌ Your title: '$TITLE'"
            echo ""
            echo "📚 Learn more: https://www.conventionalcommits.org"
            exit 1
          fi
      - name: Validate capability assessment
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              body = json.load(source)["pull_request"].get("body") or ""
          sections = []
          current = None
          fence = None
          comment = False
          for line in body.splitlines():
              if fence is not None:
                  if re.fullmatch(r" {0,3}" + re.escape(fence[0]) + "{" + str(len(fence)) + r",}\s*", line):
                      fence = None
                  continue
              opening = re.match(r"^ {0,3}(`{3,}|~{3,})", line)
              if not comment and opening:
                  fence = opening[1]
                  continue
              # Fenced examples are opaque, including literal comment markers.
              visible = []
              while line:
                  if comment:
                      end = line.find("-->")
                      if end < 0:
                          break
                      line = line[end + 3:]
                      comment = False
                  else:
                      start = line.find("<!--")
                      if start < 0:
                          visible.append(line)
                          break
                      visible.append(line[:start])
                      line = line[start + 4:]
                      comment = True
              line = "".join(visible)
              heading = re.match(r"^ {0,3}(#{1,2})\s+(.+?)\s*#*\s*$", line)
              if heading:
                  current = [] if heading[1] == "##" and heading[2] == "Capability assessment" else None
                  if current is not None:
                      sections.append(current)
              elif current is not None:
                  current.append(line)

          assessment = "\n".join(sections[0]).strip() if len(sections) == 1 else ""
          disposition = re.fullmatch(r"(Updated|Unchanged|N/A):\s*(.*)", assessment, re.DOTALL)
          explanation = disposition[2].strip() if disposition else ""
          placeholder = re.fullmatch(r"[\W_]*(?:TODO|TBD|None|N/?A|explanation)[\W_]*", explanation, re.IGNORECASE)
          if not re.search(r"[^\W_]", explanation) or placeholder or re.match(r"(?:TODO|TBD)\b", explanation, re.IGNORECASE):
              print("::error::Provide exactly one '## Capability assessment' section with Updated:, Unchanged:, or N/A: and an explanation. Comments and fenced examples do not count.")
              sys.exit(1)
          print("Capability assessment supplied; reviewers verify its accuracy.")
          PY
