name: Harness regression (live)

on:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.*", "rust-toolchain.toml", ".cargo/**", "Makefile", "scripts/dev/**", "scripts/lib/**", "scripts/harness/**", "scripts/ci/**", ".github/workflows/**", ".github/actions/**", "deployment/all-in-one/**", "fixtures/harness/**"]
  pull_request:
    branches: [main]
    paths: ["crates/**", "Cargo.*", "rust-toolchain.toml", ".cargo/**", "Makefile", "scripts/dev/**", "scripts/lib/**", "scripts/harness/**", "scripts/ci/**", ".github/workflows/**", ".github/actions/**", "deployment/all-in-one/**", "fixtures/harness/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    # Never run fork source with repository secrets. Fork changes are tested
    # automatically after merge; maintainers can dispatch the manual workflow
    # for a reviewed exact SHA beforehand. Do not use pull_request_target.
    if: ${{ github.repository == 'matrixorigin/Astra' && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/harness-manual.yml
    with:
      repository: ${{ github.repository }}
      ref: ${{ github.sha }}
      profile: regression
    secrets:
      HARNESS_GLM_BASE_URL: ${{ secrets.HARNESS_GLM_BASE_URL }}
      HARNESS_GLM_API_KEY: ${{ secrets.HARNESS_GLM_API_KEY }}
      HARNESS_ADDITIONAL_MODELS_JSON: ${{ secrets.HARNESS_ADDITIONAL_MODELS_JSON }}
