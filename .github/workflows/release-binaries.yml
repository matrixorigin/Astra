name: Release Astra CLI Binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, e.g. 0.1.0 or v0.1.0"
        required: true
        type: string

env:
  BINARY: astra
  RELEASE_REPOSITORY: matrixorigin/astra-suite

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.resolve.outputs.value }}
      tag: ${{ steps.resolve.outputs.tag }}
      source_tag: ${{ steps.resolve.outputs.source_tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Resolve release version
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${version}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${version}" >&2
            echo "Expected format: 0.1.0, v0.1.0, or 0.1.0-rc.1" >&2
            exit 1
          fi

          value="${version#v}"
          prerelease=false
          if [[ "${value}" == *-* ]]; then
            prerelease=true
          fi

          echo "value=${value}" >> "${GITHUB_OUTPUT}"
          echo "tag=astra-cli-v${value}" >> "${GITHUB_OUTPUT}"
          echo "source_tag=v${value}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: linux-amd64
            use-cross: false
            features: --features release-vendored-openssl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            suffix: linux-arm64
            use-cross: true
            features: --features release-vendored-openssl
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: darwin-amd64
            use-cross: false
            features: ""
          - os: macos-15
            target: aarch64-apple-darwin
            suffix: darwin-arm64
            use-cross: false
            features: ""

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_tag }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-${{ matrix.target }}-

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl build deps
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install cross
        if: ${{ matrix.use-cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross
        if: ${{ matrix.use-cross }}
        run: |
          cross build --release --no-default-features ${{ matrix.features }} --manifest-path rust/Cargo.toml --target "${{ matrix.target }}" -p astra-cli --bin "${BINARY}"

      - name: Build native
        if: ${{ !matrix.use-cross }}
        run: |
          cargo build --release --no-default-features ${{ matrix.features }} --manifest-path rust/Cargo.toml --target "${{ matrix.target }}" -p astra-cli --bin "${BINARY}"

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail

          checksum_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            else
              shasum -a 256 "$1"
            fi
          }

          mkdir -p dist
          archive="${BINARY}-v${{ needs.version.outputs.value }}-${{ matrix.suffix }}.tar.gz"
          tar -czf "dist/${archive}" \
            -C "rust/target/${{ matrix.target }}/release" \
            "${BINARY}"
          (cd dist && checksum_file "${archive}" | tee "${archive}.sha256" > /dev/null)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.suffix }}
          path: dist/

  release:
    name: Create Release
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bins-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cd dist
          cat astra-v*.tar.gz.sha256 > checksums.txt
          sha256sum checksums.txt | tee checksums.txt.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASE_REPOSITORY }}
          token: ${{ secrets.ASTRA_SUITE_PAT }}
          name: Astra CLI v${{ needs.version.outputs.value }}
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: main
          draft: false
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: false
          body: |
            Astra CLI v${{ needs.version.outputs.value }}.

            This release contains the `astra` CLI binaries consumed by astra-suite `scripts/install-astra.sh`.
            Source release tag: ${{ needs.version.outputs.source_tag }}.

            Assets:
            - astra-v${{ needs.version.outputs.value }}-linux-amd64.tar.gz
            - astra-v${{ needs.version.outputs.value }}-linux-arm64.tar.gz
            - astra-v${{ needs.version.outputs.value }}-darwin-amd64.tar.gz
            - astra-v${{ needs.version.outputs.value }}-darwin-arm64.tar.gz
            - checksums.txt
          make_latest: false
          files: dist/*
          fail_on_unmatched_files: true
