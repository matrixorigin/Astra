name: Release Astra CLI Binaries

permissions:
  contents: read

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, e.g. 0.1.0 or v0.1.0"
        required: true
        type: string

concurrency:
  group: release-binaries
  # Never cancel a run that may already be publishing immutable artifacts.
  cancel-in-progress: false

env:
  BINARY: astra
  CROSS_REVISION: 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27 # upstream main, 2026-08-19

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      value: ${{ steps.resolve.outputs.value }}
      mirror_tag: ${{ steps.resolve.outputs.mirror_tag }}
      source_tag: ${{ steps.resolve.outputs.source_tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Resolve release version
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${version}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${version}" >&2
            echo "Expected format: 0.1.0, v0.1.0, or 0.1.0-rc.1" >&2
            exit 1
          fi

          value="${version#v}"
          prerelease=false
          if [[ "${value}" == *-* ]]; then
            prerelease=true
          fi

          echo "value=${value}" >> "${GITHUB_OUTPUT}"
          echo "mirror_tag=astra-cli-v${value}" >> "${GITHUB_OUTPUT}"
          echo "source_tag=v${value}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ steps.resolve.outputs.source_tag }}

      - name: Validate manifest version
        run: scripts/validate-release-version.sh "${{ steps.resolve.outputs.value }}"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: linux-amd64
            use-cross: false
            features: --features release-vendored-openssl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            suffix: linux-arm64
            use-cross: true
            features: --features release-vendored-openssl
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: darwin-amd64
            use-cross: false
            features: ""
          - os: macos-15
            target: aarch64-apple-darwin
            suffix: darwin-arm64
            use-cross: false
            features: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.source_tag }}

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-${{ matrix.target }}-

      - name: Install pinned Rust toolchain and target
        shell: bash
        run: |
          rustc --version
          rustup target add "${{ matrix.target }}"

      - name: Install musl build deps
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install cross
        if: ${{ matrix.use-cross }}
        run: >-
          cargo install cross
          --git https://github.com/cross-rs/cross
          --rev "${CROSS_REVISION}"
          --locked

      - name: Build with cross
        if: ${{ matrix.use-cross }}
        run: |
          cross build --release --no-default-features ${{ matrix.features }} --manifest-path Cargo.toml --target "${{ matrix.target }}" -p astra-cli --bin "${BINARY}"

      - name: Build native
        if: ${{ !matrix.use-cross }}
        run: |
          cargo build --release --no-default-features ${{ matrix.features }} --manifest-path Cargo.toml --target "${{ matrix.target }}" -p astra-cli --bin "${BINARY}"

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail

          checksum_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            else
              shasum -a 256 "$1"
            fi
          }

          mkdir -p dist
          package_dir="${RUNNER_TEMP}/${BINARY}-package"
          mkdir -p "${package_dir}"
          install -m 0755 \
            "target/${{ matrix.target }}/release/${BINARY}" \
            "${package_dir}/${BINARY}"
          install -m 0644 LICENSE "${package_dir}/LICENSE"
          archive="${BINARY}-v${{ needs.version.outputs.value }}-${{ matrix.suffix }}.tar.gz"
          tar -czf "dist/${archive}" -C "${package_dir}" "${BINARY}" LICENSE
          (cd dist && checksum_file "${archive}" | tee "${archive}.sha256" > /dev/null)

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bins-${{ matrix.suffix }}
          path: dist/

  release:
    name: Create Release
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bins-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cd dist
          cat astra-v*.tar.gz.sha256 > checksums.txt
          sha256sum checksums.txt | tee checksums.txt.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          token: ${{ github.token }}
          name: Astra v${{ needs.version.outputs.value }}
          tag_name: ${{ needs.version.outputs.source_tag }}
          draft: false
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          make_latest: ${{ needs.version.outputs.prerelease == 'false' }}
          files: dist/*
          fail_on_unmatched_files: true

  mirror:
    name: Mirror Release
    if: ${{ vars.RELEASE_MIRROR_REPOSITORY != '' }}
    needs:
      - version
      - build
      - release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bins-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cd dist
          cat astra-v*.tar.gz.sha256 > checksums.txt
          sha256sum checksums.txt | tee checksums.txt.sha256

      - name: Mirror GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          repository: ${{ vars.RELEASE_MIRROR_REPOSITORY }}
          token: ${{ secrets.ASTRA_SUITE_PAT }}
          name: Astra CLI v${{ needs.version.outputs.value }}
          tag_name: ${{ needs.version.outputs.mirror_tag }}
          target_commitish: main
          draft: false
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: false
          body: |
            Astra CLI v${{ needs.version.outputs.value }}.

            Source release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.version.outputs.source_tag }}.
          make_latest: false
          files: dist/*
          fail_on_unmatched_files: true
