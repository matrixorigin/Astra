name: Release Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish, e.g. 0.1.0 or v0.1.0'
        required: true
        type: string

env:
  IMAGE_NAME: matrixorigin/astra
  IDC_REGISTRY: shanghai.idc.matrixorigin.cn:30019
  IDC_IMAGE_NAME: shanghai.idc.matrixorigin.cn:30019/mocloud/astra

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      image_version: ${{ steps.release.outputs.image_version }}
      latest: ${{ steps.release.outputs.latest }}

    steps:
      - name: Resolve release version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${version}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${version}" >&2
            echo "Expected format: 0.1.0, v0.1.0, or 0.1.0-rc.1" >&2
            exit 1
          fi

          image_version="${version#v}"
          latest=true
          if [[ "${image_version}" == *-* ]]; then
            latest=false
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image_version=${image_version}" >> "${GITHUB_OUTPUT}"
          echo "latest=${latest}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build DockerHub ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.latest == 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.latest == 'true' }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE_NAME }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ needs.version.outputs.image_version }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_BRANCH=${{ github.ref_name }}
          cache-from: type=gha,scope=docker-${{ matrix.slug }}
          cache-to: type=gha,scope=docker-${{ matrix.slug }},mode=max
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge & Push DockerHub Manifest
    needs:
      - version
      - build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.latest == 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.latest == 'true' }}

      - name: Create DockerHub manifest list
        shell: bash
        working-directory: /tmp/digests
        env:
          DOCKERHUB_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DOCKERHUB_METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          create_manifest_list() {
            local image_name="$1"
            local metadata_json="$2"
            local -a tag_args=()
            local -a sources=()

            mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "${metadata_json}")
            if [ "${#tag_args[@]}" -eq 0 ]; then
              echo "No Docker tags were generated for ${image_name}" >&2
              exit 1
            fi

            for digest in *; do
              sources+=("${image_name}@sha256:${digest}")
            done
            if [ "${#sources[@]}" -eq 0 ]; then
              echo "No platform image digests were downloaded" >&2
              exit 1
            fi

            docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          }

          create_manifest_list "${DOCKERHUB_IMAGE_NAME}" "${DOCKERHUB_METADATA_JSON}"

  idc:
    name: Push IDC image
    needs: version
    runs-on: amd64-mo-shanghai-dind
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.IDC_REGISTRY }}
          username: ${{ secrets.IDC_REGISTRY_USERNAME }}
          password: ${{ secrets.IDC_REGISTRY_PASSWORD }}

      - uses: docker/metadata-action@v5
        id: idc-meta
        with:
          images: ${{ env.IDC_IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.latest == 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.latest == 'true' }}

      - uses: docker/build-push-action@v6
        id: idc-build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.idc-meta.outputs.tags }}
          labels: ${{ steps.idc-meta.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ needs.version.outputs.image_version }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_BRANCH=${{ github.ref_name }}
          cache-from: type=registry,ref=${{ env.IDC_IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.IDC_IMAGE_NAME }}:cache,mode=max,oci-mediatypes=true,image-manifest=true,ignore-error=true

      - name: Write IDC summary
        if: always()
        shell: bash
        run: |
          {
            echo "## IDC image publish"
            echo
            echo "- Target: \`${{ env.IDC_IMAGE_NAME }}\`"
            echo "- DockerHub release jobs do not depend on this optional IDC job."
            echo "- This job is capped at 45 minutes to avoid long registry retry loops."
          } >> "${GITHUB_STEP_SUMMARY}"
