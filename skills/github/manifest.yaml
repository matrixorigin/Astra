# skills/github/manifest.yaml
name: github
version: "1.0.0"
description: "GitHub integration — PRs, issues, CI status, code search"
author: "mo-agent-engine"
table_prefix: sk_github

tables:
  - sk_github_repos
  - sk_github_pr_cache

settings:
  - name: api_base_url
    type: string
    default: "https://api.github.com"
    description: "GitHub API base URL (override for GitHub Enterprise)"

secrets:
  - name: github_token
    type: secret
    description: "GitHub Personal Access Token or App token"
    required: true

resources:
  type: repo
  key_pattern: "{owner}/{name}"
  bindings:
    - name: read_token
      type: secret
      description: "Per-repo read token (overrides github_token for this repo)"
      required: false

requires:
  - http

depends_on: []
